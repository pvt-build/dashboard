<style>
:root{
  /* paleta heredada de Athlete OS — mismo OS, mismo lenguaje */
  --bg:#0D0F13;
  --surface:#171A20; --surface2:#1D2128; --surface3:#252A33;
  --border:#2A2F39; --border-hi:#3C424E;
  --gold:#D8A847; --gold-dim:#8C7438; --gold-glow:rgba(216,168,71,.12);
  --hi:#F4F1E8; --mid:#B4B8BF; --low:#767B84;
  --good:#4ADE80; --danger:#E5484D; --warn:#E8B339;
  --blue:#5B9BD5; --teal:#4EC3A8; --purple:#A78BFA; --pink:#E879A6;
  /* un color por área del negocio: el mismo en toda la app */
  --a-mkt:#5B9BD5; --a-cml:#4ADE80; --a-cmn:#4EC3A8; --a-ent:#D8A847;
  --a-prd:#A78BFA; --a-bkd:#8B93A1; --a-fnd:#E8B339; --a-idd:#E879A6;

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  /* ESCALA TIPOGRÁFICA — rangos fijos, nada fuera de esta lista */
  --t-micro:10px;  /* labels de campo, códigos */
  --t-xs:11.5px;   /* metadata secundaria */
  --t-s:12.5px;    /* descripciones de fila */
  --t-m:13.5px;    /* nombres, cuerpo compacto */
  --t-l:15px;      /* lectura */
  --t-xl:17px;     /* subtítulo de bloque */
  --n-s:24px; --n-m:32px;   /* números */

  /* ESPACIADO — múltiplos de 4, nada suelto */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;

  --r-s:10px; --r-m:14px; --r-l:20px; --r-pill:999px;
  --gut:clamp(20px,4vw,56px);
  --maxw:1280px;
  --navh:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--hi);font-family:var(--sans);
  font-variant-numeric:tabular-nums;min-height:100vh;position:relative;
  font-size:var(--t-m);line-height:1.5}

/* ── ATMÓSFERA ── */
.atm{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.atm i{position:absolute;display:block;border-radius:50%;will-change:transform}
.p1{width:70vw;height:60vh;right:-18vw;top:-20vh;background:rgba(91,155,213,.07);
  filter:blur(70px);animation:d1 48s ease-in-out infinite alternate}
.p2{width:30vw;height:26vh;left:-8vw;bottom:-10vh;background:rgba(216,168,71,.12);
  filter:blur(52px);animation:d2 39s ease-in-out infinite alternate}
.p3{width:60vw;height:40vh;left:-10vw;bottom:-18vh;background:rgba(216,168,71,.05);
  filter:blur(64px);animation:d3 55s ease-in-out infinite alternate}
/* el rojo da la temperatura de fondo: sube el contraste del verde y del dorado */
.p4{width:64vw;height:52vh;right:-16vw;bottom:-22vh;background:rgba(229,72,77,.17);
  filter:blur(78px);animation:d4 44s ease-in-out infinite alternate}
.p5{width:44vw;height:34vh;left:6vw;top:-16vh;background:rgba(229,72,77,.10);
  filter:blur(88px);animation:d5 61s ease-in-out infinite alternate}
@keyframes d1{from{transform:translate3d(0,0,0)}to{transform:translate3d(-4vw,3vh,0) scale(1.1)}}
@keyframes d2{from{transform:translate3d(0,0,0)}to{transform:translate3d(5vw,-2vh,0) scale(1.12)}}
@keyframes d3{from{transform:translate3d(0,0,0)}to{transform:translate3d(3vw,-4vh,0) scale(1.07)}}
@keyframes d4{from{transform:translate3d(0,0,0)}to{transform:translate3d(-6vw,-4vh,0) scale(1.14)}}
@keyframes d5{from{transform:translate3d(0,0,0)}to{transform:translate3d(4vw,4vh,0) scale(1.09)}}
@media(prefers-reduced-motion:reduce){.atm i{animation:none}}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.03;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* ── SUPERFICIE PLANA ── el glass teñía el borde y lo rompía visualmente ── */
.glass{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-m);transition:border-color .15s;min-width:0}
.glass:hover{border-color:var(--border-hi)}

/* ── NAV FIJA ── */
.topnav{position:fixed;top:0;left:0;right:0;z-index:20;
  background:rgba(14,16,20,.86);backdrop-filter:blur(22px) saturate(130%);
  -webkit-backdrop-filter:blur(22px) saturate(130%);
  border-bottom:1px solid var(--border)}
.topnav-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);
  padding-top:env(safe-area-inset-top);
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  gap:var(--s4);min-height:var(--navh)}
.topnav-in > .navdate{grid-row:1;grid-column:2}
.topnav-in > .navver{grid-row:1;grid-column:2;align-self:end;margin-top:26px}
.navdate{font-size:var(--t-micro);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--low);white-space:nowrap;text-align:right}
.navver{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--gold);
  white-space:nowrap;text-align:right;opacity:.75}
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;position:relative;
  padding:5px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.tabs::-webkit-scrollbar{display:none}
/* el activo se hunde: sombra interior, no relleno de color */
.slider{position:absolute;top:5px;bottom:5px;border-radius:11px;
  background:var(--surface3);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.55),inset 0 -1px 0 rgba(255,255,255,.05),
    0 0 0 1px var(--border-hi);
  transition:left .3s cubic-bezier(.2,.8,.25,1),width .3s cubic-bezier(.2,.8,.25,1);
  z-index:0;pointer-events:none}
.tabs button{appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:inherit;color:var(--low);white-space:nowrap;position:relative;z-index:1;
  padding:10px var(--s4);border-radius:11px;
  font-size:var(--t-l);font-weight:600;letter-spacing:-.005em;
  transition:color .2s,transform .12s;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--mid)}
.tabs button:active{transform:translateY(1px)}
.tabs button.on{color:var(--hi);font-weight:700}
/* el punto cero es el ancla del panel, no una pestaña más */
.tabs button.cero{font-weight:700;letter-spacing:.06em;color:var(--mid)}
.tabs button.cero.on{color:var(--hi)}
.tabs .sep{width:1px;align-self:stretch;margin:6px 5px;background:var(--border);flex:0 0 auto}

.wrap{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;
  padding:calc(var(--navh) + var(--s7)) var(--gut) var(--s6)}

/* ── CABECERA DE VISTA ── */
.vhead{margin-bottom:var(--s5);padding-bottom:var(--s4);
  border-bottom:1px solid var(--border)}
.vkick{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.vkick i{width:16px;height:2px;background:var(--gold);flex:0 0 auto}
.vkick span{font-size:var(--t-micro);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold)}
.vtitle{font-size:clamp(22px,2.6vw,30px);line-height:1.1;font-weight:700;
  letter-spacing:-.025em;margin-bottom:var(--s2)}
.vtitle em{font-style:normal;color:var(--low);font-weight:500}
.vread{font-size:var(--t-l);font-weight:400;line-height:1.55;color:var(--mid);
  max-width:82ch}

/* ── BLOQUES ── */
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.card{padding:0}
.card-h{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:30px 1fr 20px;gap:var(--s3);align-items:center;
  padding:var(--s4) var(--s5)}
.card-h::-webkit-details-marker{display:none}
.card-h:hover .card-t{color:var(--mid)}
.card-nb{font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;color:var(--low);
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);
  text-align:center;padding:2px 0;line-height:1.2}
.card-t{font-size:var(--t-micro);font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--low);min-width:0}
.card-cv{font-size:16px;color:var(--low);justify-self:end;transition:transform .2s}
.card[open] .card-cv{transform:rotate(90deg)}
.card-in{padding:0 var(--s5) var(--s5)}
/* los sub-titulos que se escribian dentro del cuerpo siguen sirviendo */
.card-in > .card-t{margin-bottom:var(--s3)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s3)}
.tiles.eight{margin-bottom:0;row-gap:var(--s3)}
.tile{padding:var(--s4)}
.tile .k{font-size:var(--t-micro);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s2);line-height:1.4}
.tile .n{font-size:var(--n-m);font-weight:700;letter-spacing:-.03em;line-height:1}
.tile.live .n{color:var(--good)}
.tile.mid .n{color:var(--hi)}
.tile.brk .n{color:var(--danger)}
.tile.blind .n{color:var(--low)}
.tile .n em{font-style:normal;font-size:.44em;font-weight:500;letter-spacing:.01em;

.tile .f{margin-top:var(--s2);font-size:var(--t-xs);color:var(--mid);line-height:1.45}
.tile .st{margin-top:var(--s2);font-size:var(--t-micro);font-weight:600;

.s-live{color:var(--good)}.s-mid{color:var(--mid)}

/* ── RADAR ── */
.radar-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);

.legend{display:flex;gap:var(--s4);margin-bottom:var(--s3);

/* ── FILAS ── */
.rw{display:grid;align-items:center;gap:var(--s4);

.tkey{display:flex;gap:var(--s5);flex-wrap:wrap;margin-bottom:var(--s3)}
.tkey span{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--mid);display:flex;align-items:center;gap:6px}
.tkey i{width:14px;height:2px;border-radius:2px;display:inline-block}
.rev{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s3)}
.rev div{text-align:center}
.rev .m{font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s1)}
.rev .v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em}
.rev .v.zero{color:var(--low)}
.rev .v.gold{color:var(--gold)}

/* ── CONTRATOS ── */
.ct{display:grid;grid-template-columns:1.3fr 92px 1fr 80px;gap:var(--s4);
  align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.ct:last-child{border-bottom:0}

/* ── TERRITORIOS DE CONTENIDO ── */
.ikigai{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.ike{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.ike.core{border-color:var(--gold-dim);
  background:linear-gradient(160deg,var(--gold-glow),var(--surface))}
.ike .n{font-size:var(--t-m);font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;margin-bottom:var(--s2)}
.ike.core .n{color:var(--gold)}
.ike .d{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.ike .r{margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--border);
  font-size:var(--t-xs);color:var(--low);line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{font-size:var(--t-xs);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:5px 12px;color:var(--mid);white-space:nowrap;background:var(--surface2)}
.chip.off{color:var(--low);border-style:dashed}

.chain{display:flex;align-items:stretch;gap:var(--s2);flex-wrap:wrap}
.chain-i{flex:1 1 0;min-width:118px;padding:var(--s3);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border)}
.chain-i:last-child{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.07)}
.chain-i .n{font-size:var(--t-s);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.chain-i .d{margin-top:var(--s1);font-size:var(--t-xs);color:var(--mid);line-height:1.45}

.skillrow{display:grid;grid-template-columns:44px 1fr;gap:var(--s4);align-items:center;
  padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.skillrow:last-child{border-bottom:0}
.skillrow .m{font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}
.skillrow .m b{display:block;margin-top:2px;font-size:var(--t-xl);color:var(--hi)}

.foot{max-width:var(--maxw);margin:0 auto;
  padding:var(--s5) var(--gut) calc(var(--s6) + env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;
  font-size:var(--t-micro);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--low);position:relative;z-index:2}
.fresh{display:flex;gap:var(--s4);flex-wrap:wrap}
.fresh i{display:inline-block;width:4px;height:4px;border-radius:50%;
  margin-right:5px;vertical-align:middle;background:var(--good)}
.fresh i.lag{background:var(--warn)}.fresh i.none{background:var(--low)}

.view{display:none}.view.on{display:block;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── FUNNEL DE RATIOS ── */
.fn{display:flex;flex-direction:column;gap:2px}
.fnr{display:grid;grid-template-columns:112px 1fr 92px;gap:var(--s4);align-items:center}
.fn-n{font-size:var(--t-m);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.fn-n span{display:block;font-size:var(--t-xs);font-weight:400;color:var(--low);
  text-transform:none;letter-spacing:0;margin-top:2px}
.fn-bar{height:30px;border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);position:relative;overflow:hidden;
  display:flex;align-items:center}
.fn-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,
  rgba(216,168,71,.9),rgba(216,168,71,.45));display:block;border-radius:var(--r-s)}
.fn-bar.nil{background-image:repeating-linear-gradient(115deg,
  transparent 0 5px,rgba(255,255,255,.06) 5px 10px)}
.fn-bar b{position:relative;z-index:1;padding-left:var(--s3);
  font-size:var(--t-l);font-weight:700;color:var(--hi)}
.fn-bar.nil b{color:var(--low)}
.fn-rt{text-align:right;font-size:var(--t-l);font-weight:700;letter-spacing:-.02em}
.fn-rt span{display:block;font-size:var(--t-micro);font-weight:600;color:var(--low);
  letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.fn-rt.worst{color:var(--danger)}
.fn-gap{height:14px;margin-left:112px;border-left:1px dashed var(--border-hi);width:1px}

/* ── CLIENTES ── */
.cli{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);display:grid;
  grid-template-columns:1.15fr 88px 1fr 1.35fr;gap:var(--s4);align-items:center}
.cli + .cli{margin-top:var(--s2)}
.cli.brk{border-color:rgba(229,72,77,.3)}
.cli.live{border-color:rgba(74,222,128,.28)}
.cli-h .k1{font-size:var(--t-l)}
.cli-p{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.cli-x{font-size:var(--t-s);line-height:1.5}
.cli-x b{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:3px}
.ccbar{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);align-items:end;
  height:96px;margin-bottom:var(--s3)}
.ccb{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.ccb i{display:block;border-radius:var(--r-s) var(--r-s) 0 0;background:var(--gold);width:100%}
.ccb i.zero{background:var(--surface3);height:3px!important}
.ccb .v{font-size:var(--t-l);font-weight:700;margin-bottom:var(--s1);text-align:center}
.ccb .m{font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--low);text-align:center;margin-top:var(--s2)}

/* ── CANALES ── */
.cn{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.cn + .cn{margin-top:var(--s2)}
.cn.hot{border-color:var(--gold-dim);background:linear-gradient(160deg,var(--gold-glow),var(--surface))}
.cn-top{display:grid;grid-template-columns:1fr repeat(3,84px);gap:var(--s4);
  align-items:baseline;margin-bottom:var(--s3)}
.cn-n{font-size:var(--t-xl);font-weight:700;letter-spacing:-.015em}
.cn-m{text-align:right}
.cn-m b{display:block;font-size:var(--t-l);font-weight:700;letter-spacing:-.02em}
.cn-m span{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);margin-top:2px}
.cn-m.gold b{color:var(--gold)}
.cn-txt{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);
  padding-top:var(--s3);border-top:1px solid var(--border)}
.cn-txt div b{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s1)}
.cn-txt div p{font-size:var(--t-s);color:var(--mid);line-height:1.55}

/* ── IKIGAI ── */
.ik-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:var(--s6);align-items:center}
.ik-wrap > div{min-width:0}
.ik-svg{width:100%;height:auto;display:block;max-width:min(100%,560px);min-width:0;margin:0 auto}
.ik-c{fill-opacity:.10;stroke-width:1.5}
.ik-lbl{font-family:var(--sans);font-size:var(--t-s);font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;fill:var(--hi)}
.ik-sub{font-family:var(--sans);font-size:var(--t-micro);fill:var(--mid)}
.ik-core{font-family:var(--sans);font-size:var(--t-m);font-weight:700;fill:var(--gold)}
.ik-pair{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.06em;fill:var(--mid)}
.ik-side .core{padding:var(--s4);border-radius:var(--r-s);
  border:1px solid var(--gold-dim);background:linear-gradient(160deg,var(--gold-glow),var(--surface));
  margin-bottom:var(--s3)}
.ik-side .core b{font-size:var(--t-xl);color:var(--gold);display:block;margin-bottom:var(--s2)}
.ik-side .core p{font-size:var(--t-s);color:var(--mid);line-height:1.55}
.ik-p{display:grid;grid-template-columns:150px 1fr;gap:var(--s3);
  padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.ik-p:last-child{border-bottom:0}
.ik-p b{font-size:var(--t-s);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.ik-p span{font-size:var(--t-s);color:var(--mid);line-height:1.5}

/* ── GAPS ── */
.gp{display:grid;grid-template-columns:26px 1.1fr 1.35fr 1fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.gp:last-child{border-bottom:0}
.gp-p{font-size:var(--t-m);font-weight:700;color:var(--low)}
.gp.brk .gp-p{color:var(--danger)}
.gp-d{font-size:var(--t-s);color:var(--gold)}

/* ── ORIGEN / TIEMPO / DIAGNÓSTICO ── */
.og{display:grid;grid-template-columns:132px 54px 1fr;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.og:last-child{border-bottom:0}
.og-v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;text-align:right}
.og-v.brk{color:var(--danger)}
.og-bar{height:6px;border-radius:var(--r-pill);background:var(--surface3);
  margin-top:var(--s2);overflow:hidden}
.og-bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--mid)}
.og-bar i.brk{background:var(--danger)}

.tm{display:grid;grid-template-columns:150px 78px 84px 78px 1fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.tm:last-child{border-bottom:0}
.tm-v{font-size:var(--t-l);font-weight:700;letter-spacing:-.02em;text-align:right}
.tm-v.live{color:var(--good)}.tm-v.brk{color:var(--danger)}
.tm-h{display:grid;grid-template-columns:150px 78px 84px 78px 1fr;gap:var(--s4);
  padding-bottom:var(--s2);border-bottom:1px solid var(--border-hi);
  font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low)}
.tm-h span:not(:first-child):not(:last-child){text-align:right}

.dg{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);border-left:3px solid var(--danger)}
.dg.live{border-left-color:var(--good)}
.dg + .dg{margin-top:var(--s2)}
.dg-top{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3);flex-wrap:wrap}
.sev{display:flex;gap:3px;margin-left:auto}
.sev i{width:16px;height:6px;border-radius:2px;background:var(--surface3);display:block}
.sev i.on{background:var(--danger)}
.dg.live .sev i.on{background:var(--good)}
.dg-tr{font-size:var(--t-xl);font-weight:700;letter-spacing:-.015em}
.dg-cul{font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--danger);border:1px solid rgba(229,72,77,.35);border-radius:var(--r-pill);
  padding:3px 10px}
.dg.live .dg-cul{color:var(--good);border-color:rgba(74,222,128,.35)}
.dg-b{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.dg-b div b{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s1)}
.dg-b div p{font-size:var(--t-l);color:var(--mid);line-height:1.5}
.concl{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--border);
  font-size:var(--t-xl);color:var(--hi);line-height:1.6}
.concl b{color:var(--gold);font-weight:600;display:block;font-size:var(--t-micro);
  letter-spacing:.10em;text-transform:uppercase;margin-bottom:var(--s2)}

/* ── SKILLS POR PESTAÑA ── */
.sk-area{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border)}
.sk-area b{font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low);white-space:nowrap}

/* ── ESCALERA SOP → AGENTE ── */
.esc{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.esc-s{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);position:relative}
.esc-s.brk{border-color:rgba(229,72,77,.35)}
.esc-s.live{border-color:rgba(74,222,128,.3)}
.esc-n{font-size:var(--t-m);font-weight:700;letter-spacing:.10em;margin-bottom:var(--s2)}
.esc-v{font-size:var(--n-m);font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:var(--s2)}
.esc-s.live .esc-v{color:var(--good)}
.esc-s.brk .esc-v{color:var(--danger)}
.esc-d{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.esc-e{margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--border);
  font-size:var(--t-xs);color:var(--low);line-height:1.45}
.esc-ar{position:absolute;right:-11px;top:50%;transform:translateY(-50%);
  color:var(--low);font-size:var(--t-l);z-index:1}

/* ── INVENTARIO DE SKILLS ── */
.inv{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.inv-i{display:grid;grid-template-columns:104px 1fr 74px;gap:var(--s3);align-items:center;
  padding:var(--s2) var(--s3);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.inv-n{font-size:var(--t-m);font-weight:700}
.inv-c{font-size:var(--t-micro);font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--low);display:block;margin-top:2px}
.inv-d{font-size:var(--t-s);color:var(--mid);line-height:1.4}
.inv-l{font-size:var(--t-micro);font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  text-align:right;color:var(--low)}
.inv-l.sistema{color:var(--mid)}.inv-l.agente{color:var(--good)}

/* ── OBJECIONES ── */
.ob{display:grid;grid-template-columns:150px 56px 1fr;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.ob:last-child{border-bottom:0}
.ob-v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;text-align:right}

/* ── FOCO ── */
.marco{padding:var(--s5);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--gold-dim)}
.marco b{font-size:var(--t-xl);color:var(--gold);display:block;margin-bottom:var(--s2)}
.marco p{font-size:var(--t-l);color:var(--mid);line-height:1.6}
.marco q{display:block;margin-top:var(--s3);padding-top:var(--s3);
  border-top:1px solid var(--border);font-size:var(--t-l);font-style:italic;color:var(--hi)}
.gd{display:grid;grid-template-columns:30px 1.1fr 96px 1.9fr;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.gd:last-child{border-bottom:0}
.gd-p{font-size:var(--t-l);font-weight:700;color:var(--low)}
.gd-v{font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  text-align:center;border-radius:var(--r-pill);padding:4px 10px;border:1px solid var(--border)}
.gd-v.live{color:var(--good);border-color:rgba(74,222,128,.35)}
.gd-v.brk{color:var(--danger);border-color:rgba(229,72,77,.35)}
.gd-v.blind{color:var(--low)}
.ver{padding:var(--s5);border-radius:var(--r-s);background:rgba(229,72,77,.08);
  border:1px solid rgba(229,72,77,.3);font-size:var(--t-xl);line-height:1.55;color:var(--hi)}
.wk{display:grid;grid-template-columns:30px 1.25fr 2fr 132px;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.wk:last-child{border-bottom:0}
.wk-n{font-size:var(--t-l);font-weight:700;color:var(--gold)}
.wk-q{font-size:var(--t-micro);font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--low);text-align:right}

/* ── MOTOR DE CONTENIDO ── */
.motor{display:grid;grid-template-columns:repeat(5,1fr) ;gap:var(--s2);align-items:stretch}
.mo{min-width:0;padding:var(--s4) var(--s3);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border);position:relative;text-align:center}
.mo:first-child{border-color:var(--gold-dim);background:linear-gradient(160deg,var(--gold-glow),var(--surface2))}
.mo:last-child{border-color:rgba(74,222,128,.3)}
.mo .n{font-size:var(--t-m);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  margin-bottom:var(--s2)}
.mo:first-child .n{color:var(--gold)}
.mo .d{font-size:var(--t-xs);color:var(--mid);line-height:1.45}
.mo-ar{position:absolute;right:calc(var(--s2) * -1);top:50%;transform:translate(50%,-50%);
  color:var(--low);font-size:var(--t-l);z-index:1;line-height:1}
.loop{margin-top:var(--s3);padding:var(--s3);border-radius:var(--r-s);
  background:var(--surface2);border:1px dashed var(--border-hi);
  font-size:var(--t-s);color:var(--mid);text-align:center}
.loop b{color:var(--gold)}

/* ── FORMATOS ── */
.fmt{display:grid;grid-template-columns:130px 92px 1fr 92px 1.5fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.fmt:last-child{border-bottom:0}
.fmt-n{font-size:var(--t-m);font-weight:700}
.fmt-n span{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);margin-top:2px}
.fmt-c{font-size:var(--t-s);color:var(--mid)}
.fmt-v{font-size:var(--t-l);font-weight:700;text-align:right;letter-spacing:-.02em}
.fmt-v.brk{color:var(--danger)}
.fmt-b{height:8px;border-radius:var(--r-pill);background:var(--surface3);overflow:hidden}
.fmt-b i{display:block;height:100%;border-radius:var(--r-pill);background:var(--gold)}
.fmt-b.brk i{background:var(--danger)}

/* ── PROYECCIÓN ── */
.pj{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);align-items:end;
  height:132px;margin-bottom:var(--s3)}
.pj-c{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.pj-c i{display:block;border-radius:var(--r-s) var(--r-s) 0 0;width:100%}
.pj-c i.real{background:var(--gold)}
/* verde suave = proyectado, no cerrado */
.pj-c i.proy{background:rgba(74,222,128,.28);border:1px dashed rgba(74,222,128,.55);
  border-bottom:0}
.pj-c .v{font-size:var(--t-l);font-weight:700;text-align:center;margin-bottom:var(--s1)}
.pj-c .v.proy{color:var(--good)}
.pj-m{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4)}
.pj-m span{font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);text-align:center}
.pj-key{display:flex;gap:var(--s5);justify-content:center;margin-bottom:var(--s4);
  font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low)}
.pj-key i{display:inline-block;width:14px;height:8px;border-radius:2px;
  margin-right:6px;vertical-align:middle}
.pj-key i.real{background:var(--gold)}
.pj-key i.proy{background:rgba(74,222,128,.28);border:1px dashed rgba(74,222,128,.55)}

/* ── RENOVACIÓN ── */
.rn{display:grid;grid-template-columns:1.15fr 92px 88px 1.9fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.rn:last-child{border-bottom:0}
.rn-p{font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  text-align:center;border-radius:var(--r-pill);padding:4px 10px;border:1px solid var(--border)}
.rn-p.Alta{color:var(--good);border-color:rgba(74,222,128,.35)}
.rn-p.Media{color:var(--warn);border-color:rgba(232,179,57,.35)}
.rn-p.Baja{color:var(--danger);border-color:rgba(229,72,77,.35)}

/* ── BARRAS VERTICALES AGRUPADAS ── */
.bv{width:100%;height:auto;display:block;max-height:min(42vh,320px)}
.bv-b{transition:opacity .2s}
.bv-b.parcial{opacity:.55}
.bv-z{stroke:var(--border-hi);stroke-width:2}
.bv-v{font-family:var(--sans);font-size:var(--t-xs);font-weight:700}
.bv-v.zero{fill:var(--low)}
.bv-m{font-family:var(--sans);font-size:var(--t-m);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;fill:var(--hi)}
.bv-sub{font-family:var(--sans);font-size:var(--t-micro);font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;fill:var(--low)}

/* ── BARRAS AGRUPADAS ── */
.bg{display:grid;gap:var(--s5)}
.bg-m{display:grid;grid-template-columns:56px 1fr;gap:var(--s4);align-items:center}
.bg-lbl{font-size:var(--t-m);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mid)}
.bg-lbl span{display:block;font-size:var(--t-micro);font-weight:600;color:var(--low);
  margin-top:2px}
.bg-set{display:grid;gap:6px}
.bg-r{display:grid;grid-template-columns:74px 1fr 62px;gap:var(--s3);align-items:center}
.bg-n{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--low)}
.bg-t{height:20px;border-radius:var(--r-s);background:var(--surface3);overflow:hidden}
.bg-t i{display:block;height:100%;border-radius:var(--r-s)}
.bg-t i.c0{background:var(--gold)}
.bg-t i.c1{background:var(--blue)}
.bg-t i.c2{background:var(--teal)}
.bg-t i.c3{background:var(--good)}
.bg-t.parcial i{position:relative}
.bg-t.parcial i::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(115deg,rgba(0,0,0,.34) 0 5px,transparent 5px 10px)}
.bg-v{font-size:var(--t-l);font-weight:700;text-align:right;letter-spacing:-.02em}
.bg-key{display:flex;gap:var(--s5);flex-wrap:wrap;margin-bottom:var(--s4);
  font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--low)}
.bg-key i{display:inline-block;width:14px;height:8px;border-radius:2px;
  margin-right:6px;vertical-align:middle}
.bg-key i.c0{background:var(--gold)}
.bg-key i.c1{background:var(--blue)}
.bg-key i.c2{background:var(--teal)}
.bg-key i.c3{background:var(--good)}

/* ── ESTADO DEL CLIENTE ── */
.est-b{font-size:var(--t-micro);font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  border-radius:var(--r-pill);padding:4px 11px;display:inline-block;border:1px solid var(--border)}
.est-b.Avanza{color:var(--good);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.09)}
.est-b.Bloqueado{color:var(--danger);border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.09)}
.ins{display:grid;grid-template-columns:118px 1.5fr 1.5fr;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.ins:last-child{border-bottom:0}
.ins-a{font-size:var(--t-m);font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--gold)}

/* ── SALIDAS DE CONTENIDO ── */
.sal{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.sal-c{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.sal-c.brk{border-color:rgba(229,72,77,.3)}
.sal-n{font-size:var(--t-xl);font-weight:700;margin-bottom:var(--s1)}
.sal-d{font-size:var(--t-s);color:var(--low);margin-bottom:var(--s3)}
.sal-v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;margin-bottom:var(--s2)}
.sal-c.brk .sal-v{color:var(--danger)}
.sal-r{font-size:var(--t-s);color:var(--mid);line-height:1.5;
  padding-top:var(--s2);border-top:1px solid var(--border)}

/* ── EXPLICACIÓN DE DOS SERIES ── */
.ins-x{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s4);
  padding-top:var(--s4);border-top:1px solid var(--border)}
.ins-x b{display:block;font-size:var(--t-m);font-weight:700;margin-bottom:var(--s1)}
.ins-x div:first-child b{color:var(--blue)}
.ins-x div:last-child b{color:var(--gold)}
.ins-x p{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.gap-x{margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:rgba(229,72,77,.07);border:1px solid rgba(229,72,77,.25);
  font-size:var(--t-s);color:var(--hi);line-height:1.55}

/* ── ÁREA DESPLEGABLE ── */
details.ar{border-bottom:1px solid var(--border)}
details.ar:last-child{border-bottom:0}
details.ar > summary{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:26px 1.05fr 168px 92px 1.6fr 20px;gap:var(--s4);
  align-items:center;padding:var(--s3) 0}
details.ar > summary::-webkit-details-marker{display:none}
details.ar > summary:hover{background:rgba(255,255,255,.02)}
.ar-sc{display:block;margin-top:3px;font-size:var(--t-m);font-weight:700;
  letter-spacing:-.02em;color:var(--gold)}
.ar-cv{color:var(--low);font-size:var(--t-l);text-align:center;transition:transform .2s}
details.ar[open] .ar-cv{transform:rotate(90deg)}
details.ar.brk > summary{box-shadow:inset 2px 0 0 var(--danger);padding-left:var(--s3);margin-left:-14px}
.ar-body{padding:0 0 var(--s4) 42px;display:grid;gap:var(--s2)}
.fl{display:grid;grid-template-columns:18px 1fr 2fr;gap:var(--s3);align-items:start;
  padding:var(--s2) var(--s3);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.fl.brk{border-color:rgba(229,72,77,.28)}
.fl.live{border-color:rgba(74,222,128,.28)}
.fl-i{width:8px;height:8px;border-radius:2px;background:var(--mid);margin-top:5px}
.fl.brk .fl-i{background:var(--danger)}
.fl.live .fl-i{background:var(--good)}
.fl-q{font-size:var(--t-m);font-weight:700}
.fl-d{font-size:var(--t-s);color:var(--mid);line-height:1.5}

/* ── NEXT STEPS ── */
.ns{display:grid;grid-template-columns:30px 1.5fr 108px 1.7fr 120px;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.ns:last-child{border-bottom:0}
.ns-n{font-size:var(--t-xl);font-weight:700;color:var(--gold)}
.ns-t{font-size:var(--t-l);font-weight:700;line-height:1.35}
.ns-a{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--blue);border:1px solid rgba(91,155,213,.32);border-radius:var(--r-pill);
  padding:4px 10px;text-align:center}
.ns-q{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--low);text-align:right}

/* ── ESCALONES DE PROYECCIÓN ── */
.esl{display:grid;grid-template-columns:150px 1fr 96px 108px;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.esl:last-child{border-bottom:0}
.esl-n{font-size:var(--t-l);font-weight:700}
.esl-n span{display:block;margin-top:3px;font-size:var(--t-micro);font-weight:600;
  letter-spacing:.06em;color:var(--low)}
.esl-t{height:26px;border-radius:var(--r-s);background:var(--surface3);
  position:relative;overflow:hidden;display:flex;align-items:center}
.esl-t i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-s);
  background:var(--gold)}
.esl-t.brk i{background:var(--danger)}
.esl-t.live i{background:var(--good)}
.esl-r{font-size:var(--t-xl);font-weight:700;letter-spacing:-.025em;text-align:right}
.esl-d{font-size:var(--t-micro);font-weight:700;letter-spacing:.04em;
  text-align:right;color:var(--good)}
.esl-d span{display:block;font-size:var(--t-micro);font-weight:500;
  color:var(--low);margin-top:2px;text-transform:uppercase;letter-spacing:.08em}

/* ── PALANCAS ── */
.pal{display:grid;grid-template-columns:1.2fr 92px 92px 108px 1.7fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.pal:last-child{border-bottom:0}
.pal-h{display:grid;grid-template-columns:1.2fr 92px 92px 108px 1.7fr;gap:var(--s4);
  padding-bottom:var(--s2);border-bottom:1px solid var(--border-hi);
  font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low)}
.pal-b{font-size:var(--t-micro);font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  border-radius:var(--r-pill);padding:4px 10px;border:1px solid var(--border);
  text-align:center;color:var(--mid)}
.pal-i{font-size:var(--t-l);font-weight:700;text-align:right;color:var(--good)}
.pal-i.zero{color:var(--low)}

/* ── BANDEJA POR MADUREZ ── */
.bnd{display:grid;grid-template-columns:150px 72px 1fr 108px 1.6fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.bnd:last-child{border-bottom:0}
.bnd-v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;text-align:right}
.bnd-t{height:10px;border-radius:var(--r-pill);background:var(--surface3);overflow:hidden}
.bnd-t i{display:block;height:100%;border-radius:var(--r-pill);background:var(--gold)}
.bnd-t.blind i{background:repeating-linear-gradient(115deg,
  rgba(255,255,255,.22) 0 4px,transparent 4px 8px)}
.bnd-h{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mid);text-align:right}
.bnd-h span{display:block;font-weight:500;color:var(--low);margin-top:2px}

/* ── SIEMBRA ── */
.sb{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.sb-c{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.sb-n{font-size:var(--t-xl);font-weight:700;margin-bottom:var(--s1)}
.sb-q{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);margin-bottom:var(--s3)}
.sb-d{font-size:var(--t-s);color:var(--mid);line-height:1.5;
  padding-top:var(--s2);border-top:1px solid var(--border)}

/* ── FICHA DE CLIENTE ── */
.fc{padding:var(--s5);border-radius:var(--r-m);background:var(--surface2);
  border:1px solid var(--border)}
.fc + .fc{margin-top:var(--s3)}
.fc.Avanza{border-color:rgba(74,222,128,.3)}
.fc.Frenado{border-color:rgba(229,72,77,.3)}
.fc-top{display:grid;grid-template-columns:1.3fr 108px 110px 108px;gap:var(--s4);
  align-items:center;padding-bottom:var(--s3);margin-bottom:var(--s3);
  border-bottom:1px solid var(--border)}
.fc-n{font-size:var(--t-xl);font-weight:700}
.fc-n span{display:block;margin-top:4px;font-size:var(--t-s);font-weight:400;color:var(--low)}
.fc-m{text-align:right}
.fc-m b{display:block;font-size:var(--t-l);font-weight:700;letter-spacing:-.02em}
.fc-m span{display:block;margin-top:2px;font-size:var(--t-micro);font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--low)}
.fc-g{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s4)}
.fc-g div b{display:block;font-size:var(--t-micro);font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s1)}
.fc-g div p{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.fc-g div.key p{color:var(--hi)}
.fc-bar{grid-column:1/-1;margin-top:var(--s2)}
.fc-bar .lbl{display:flex;justify-content:space-between;font-size:var(--t-micro);
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--low);
  margin-bottom:var(--s1)}

/* ── CANAL con identidad ── */
.cn-dot{width:10px;height:10px;border-radius:3px;display:inline-block;
  margin-right:var(--s2);vertical-align:-1px}
.cn-cue{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--border);
  display:flex;align-items:center;gap:var(--s2);
  font-size:var(--t-s);color:var(--danger)}
.cn-cue b{font-size:var(--t-micro);font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low)}

/* ── VÍNCULO ÁREA → VISTA ── */
.ar-go{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--blue);border:1px solid rgba(91,155,213,.3);border-radius:var(--r-pill);
  padding:3px 9px;background:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.ar-go:hover{background:rgba(91,155,213,.12)}

/* ── IDEA ANOTADA ── */
.idea{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px dashed var(--border-hi)}
.idea b{display:block;font-size:var(--t-m);font-weight:700;color:var(--mid);
  margin-bottom:var(--s1)}
.idea p{font-size:var(--t-s);color:var(--low);line-height:1.55}

/* ── SECCIONES DEL PUNTO CERO ── */
.oz-s{display:flex;align-items:center;gap:var(--s3);margin:var(--s7) 0 var(--s4);
  font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em;color:var(--hi)}
.oz-s:first-child{margin-top:0}
.oz-s span{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;color:var(--low);
  border:1px solid var(--border);border-radius:var(--r-pill);padding:4px 9px}
.oz-s::after{content:"";flex:1;height:1px;background:var(--border)}
.oz .vhead{margin-bottom:var(--s4)}
.oz .vtitle{font-size:clamp(19px,2.4vh,26px)}
.oz .vread{font-size:var(--t-l)}
.oz .sk-area{display:none}

/* ── ENLACES A SISTEMAS VIVOS ── */
.lk{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.lk-c{display:block;padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);text-decoration:none;transition:border-color .15s}
.lk-c:hover{border-color:var(--blue)}
.lk-n{font-size:var(--t-m);font-weight:700;color:var(--hi);margin-bottom:var(--s1)}
.lk-d{font-size:var(--t-s);color:var(--mid);line-height:1.45}

/* ── SILENCIO CON EL CLIENTE ── */
.sil{display:inline-block;margin-left:var(--s2);padding:2px 9px;border-radius:var(--r-pill);
  font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--border)}
.sil.ok{color:var(--good);border-color:rgba(74,222,128,.35)}
.sil.warn{color:var(--warn);border-color:rgba(232,179,57,.35)}
.sil.brk{color:var(--danger);border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.08)}

/* ── LÍNEA DE CONTRATOS ── */
.ct-h{display:grid;grid-template-columns:150px 1fr;gap:var(--s4);margin-bottom:var(--s2)}
.ct-m{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.ct-m span{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--low);text-align:center}
.ct-r{display:grid;grid-template-columns:150px 1fr 96px;gap:var(--s4);align-items:center;
  padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.ct-r:last-child{border-bottom:0}
.ct-g{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;height:26px}
.ct-g i{border-radius:3px;background:var(--surface3);display:block}
.ct-g i.on{background:var(--gold)}
.ct-g i.on.live{background:var(--good)}
.ct-g i.on.brk{background:var(--danger)}
.ct-n{font-size:var(--t-m);font-weight:700}
.ct-n span{display:block;margin-top:2px;font-size:var(--t-micro);font-weight:500;color:var(--low)}
.ct-v{text-align:right}
.ct-v b{display:block;font-size:var(--t-l);font-weight:700;letter-spacing:-.02em}
.ct-v span{display:block;font-size:var(--t-micro);color:var(--low);margin-top:2px}

/* ── LAS TRES LECTURAS ── */
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.tres-c{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.tres-c.live{border-color:rgba(74,222,128,.3)}
.tres-v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;margin-bottom:var(--s1)}
.tres-c.live .tres-v{color:var(--good)}
.tres-n{font-size:var(--t-m);font-weight:700;margin-bottom:var(--s2)}
.tres-d{font-size:var(--t-s);color:var(--mid);line-height:1.5;
  padding-top:var(--s2);border-top:1px solid var(--border)}
.resp{margin-top:var(--s4);padding:var(--s4);border-radius:var(--r-s);
  background:rgba(216,168,71,.08);border:1px solid var(--gold-dim);
  font-size:var(--t-l);color:var(--hi);line-height:1.55}

/* ── PIPELINE ── */
.pp{display:grid;grid-template-columns:1.3fr 116px 108px 1fr 1.5fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.pp:last-child{border-bottom:0}
.pp-t{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mid);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:4px 10px;text-align:center}
.pp-c{font-size:var(--t-m);font-weight:700;text-align:center;color:var(--hi)}
.pp-p{display:flex;align-items:center;gap:var(--s2)}
.pp-p b{font-size:var(--t-l);font-weight:700;min-width:38px;text-align:right}
.pp.live .pp-p b{color:var(--good)}
.pp.brk .pp-p b{color:var(--danger)}

/* ── CASOS DE CONSULTORÍA ── */
.cs{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.cs + .cs{margin-top:var(--s2)}
.cs-top{display:grid;grid-template-columns:1fr 1.3fr 1.3fr 1.2fr;gap:var(--s4);align-items:start}
.cs-n{font-size:var(--t-l);font-weight:700}
.cs-b b{display:block;font-size:var(--t-micro);font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s1)}
.cs-b p{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.foco{display:flex;gap:var(--s1);flex-wrap:wrap;margin-top:var(--s2)}
.foco span{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:var(--r-pill);background:rgba(216,168,71,.14);
  color:var(--gold);border:1px solid var(--gold-dim)}
.tesis{padding:var(--s5);border-radius:var(--r-s);
  background:linear-gradient(160deg,var(--gold-glow),var(--surface2));
  border:1px solid var(--gold-dim)}
.tesis b{display:block;font-size:var(--t-xl);color:var(--gold);margin-bottom:var(--s3)}
.tesis p{font-size:var(--t-l);color:var(--hi);line-height:1.6;margin-bottom:var(--s3)}
.tesis .cs2{font-size:var(--t-l);color:var(--mid)}
.tesis .cns{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--gold-dim);
  font-size:var(--t-l);font-weight:700;color:var(--hi)}

/* ── RITMO DIARIO ── */
.rit{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.rit-c{padding:var(--s4);border-radius:var(--r-m);background:var(--surface2);
  border:1px solid var(--border)}
.rit-c.live{border-color:rgba(74,222,128,.32)}
.rit-h{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:var(--s3);margin-bottom:var(--s3);border-bottom:1px solid var(--border)}
.rit-h b{font-size:var(--t-xl);font-weight:700}
.rit-h span{font-size:var(--n-s);font-weight:700;color:var(--gold)}
.rit-i{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) 0;
  border-bottom:1px solid var(--border)}
.rit-i:last-child{border-bottom:0}
.rit-i .q{width:26px;height:26px;border-radius:7px;background:var(--surface3);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:var(--t-micro);font-weight:700;color:var(--hi)}
.rit-i .t{flex:1;font-size:var(--t-m);font-weight:600}
.rit-i .a{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--low);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 8px}

/* ── SEMANA ── */
.sem{display:grid;grid-template-columns:110px repeat(7,1fr);gap:3px;align-items:center}
.sem-h{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--low);text-align:center;padding-bottom:var(--s2)}
.sem-n{font-size:var(--t-s);font-weight:600;color:var(--mid);padding:3px 0}
.sem-d{height:22px;border-radius:5px;background:var(--surface3)}
.sem-d.on{background:var(--gold)}
.sem-d.on.mkt{background:var(--a-mkt)}.sem-d.on.cml{background:var(--a-cml)}
.sem-d.on.cmn{background:var(--a-cmn)}.sem-d.on.ent{background:var(--a-ent)}
.sem-d.on.prd{background:var(--a-prd)}.sem-d.on.bkd{background:var(--a-bkd)}
.sem-d.on.fnd{background:var(--a-fnd)}.sem-d.on.idd{background:var(--a-idd)}
/* la etiqueta de fila hereda el color de su área */
.sem-n.mkt{color:var(--a-mkt)}.sem-n.cml{color:var(--a-cml)}
.sem-n.cmn{color:var(--a-cmn)}.sem-n.ent{color:var(--a-ent)}
.sem-n.prd{color:var(--a-prd)}.sem-n.bkd{color:var(--a-bkd)}
.sem-n.fnd{color:var(--a-fnd)}.sem-n.idd{color:var(--a-idd)}

.alg{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin-bottom:var(--s4)}
.alg span{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-micro);
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--low)}
.alg i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}

/* la tarjeta de ritmo se tiñe con el área de cada ítem */
.rit-i .a{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 8px;border-radius:var(--r-pill);border:1px solid currentColor;
  opacity:.9;white-space:nowrap}
.rit-i.mkt .a{color:var(--a-mkt)}.rit-i.cml .a{color:var(--a-cml)}
.rit-i.cmn .a{color:var(--a-cmn)}.rit-i.ent .a{color:var(--a-ent)}
.rit-i.prd .a{color:var(--a-prd)}.rit-i.bkd .a{color:var(--a-bkd)}
.rit-i.fnd .a{color:var(--a-fnd)}.rit-i.idd .a{color:var(--a-idd)}
.rit-i{border-left:2px solid transparent;padding-left:var(--s3)}
.rit-i.mkt{border-left-color:var(--a-mkt)}.rit-i.cml{border-left-color:var(--a-cml)}
.rit-i.cmn{border-left-color:var(--a-cmn)}.rit-i.ent{border-left-color:var(--a-ent)}
.rit-i.prd{border-left-color:var(--a-prd)}.rit-i.bkd{border-left-color:var(--a-bkd)}
.rit-i.fnd{border-left-color:var(--a-fnd)}.rit-i.idd{border-left-color:var(--a-idd)}

/* ── TORTAS ── */
.pies{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
.pie-w{text-align:center}
.pie-t{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--low);margin-bottom:var(--s3)}
.pie-svg{width:100%;max-width:220px;height:auto;margin:0 auto var(--s3);display:block}
.pie-l{display:flex;flex-direction:column;gap:var(--s1)}
.pie-l div{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-s);color:var(--mid)}
.pie-l i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.pie-l b{margin-left:auto;color:var(--hi);font-weight:700}

/* ── LEVERAGE ── */
.lv{display:grid;grid-template-columns:130px 80px 84px 84px 96px 1fr;gap:var(--s3);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.lv:last-child{border-bottom:0}
.lv-h{display:grid;grid-template-columns:130px 80px 84px 84px 96px 1fr;gap:var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--border-hi);
  font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--low)}
.lv-v{font-size:var(--t-l);font-weight:700;text-align:right}
.lv-b{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;border-radius:var(--r-pill);padding:4px 8px;border:1px solid var(--border)}
.lv.live .lv-b{color:var(--good);border-color:rgba(74,222,128,.35)}
.lv.brk .lv-b{color:var(--danger);border-color:rgba(229,72,77,.35)}
.lv.mid .lv-b{color:var(--warn);border-color:rgba(232,179,57,.35)}

/* ── SISTEMAS POR ÁREA ── */
.bk{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.bk-c{padding:var(--s3);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.bk-a{font-size:var(--t-m);font-weight:700;margin-bottom:var(--s2);
  padding-bottom:var(--s2);border-bottom:1px solid var(--border)}
.bk-s{display:flex;align-items:flex-start;gap:var(--s2);padding:var(--s2) 0}
.bk-s + .bk-s{border-top:1px solid var(--border)}
.bk-d{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto;background:var(--low)}
.bk-d.live{background:var(--good)}.bk-d.mid{background:var(--warn)}.bk-d.brk{background:var(--danger)}
.bk-n{font-size:var(--t-s);font-weight:600;line-height:1.35}
.bk-st{font-size:var(--t-micro);color:var(--low);margin-top:2px}
.apps{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.app{font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;
  background:var(--surface3);color:var(--mid)}

/* ── GRUPOS DEL ARSENAL ── */
.gr{display:grid;grid-template-columns:110px 60px 1.4fr 92px 1fr;gap:var(--s3);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.gr:last-child{border-bottom:0}
.gr-g{font-size:var(--t-l);font-weight:700}
.gr-n{font-size:var(--n-s);font-weight:700;text-align:center;color:var(--gold)}
.gr-r{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;border-radius:var(--r-pill);padding:4px 8px;border:1px solid var(--border);color:var(--mid)}
.gr-r.Alta{color:var(--good);border-color:rgba(74,222,128,.35)}
.gr-sk{display:flex;gap:3px;flex-wrap:wrap}
.gr-sk span{font-size:9.5px;padding:2px 7px;border-radius:var(--r-pill);
  background:var(--surface3);color:var(--mid)}

/* ── RESUMEN GLOBAL ── */
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.res-c{padding:var(--s4);border-radius:var(--r-m);background:var(--surface2);
  border:1px solid var(--border);cursor:pointer;transition:border-color .15s}
.res-c:hover{border-color:var(--border-hi)}
.res-t{display:flex;justify-content:space-between;align-items:center;
  padding-bottom:var(--s2);margin-bottom:var(--s3);border-bottom:1px solid var(--border)}
.res-t b{font-size:var(--t-xl);font-weight:700}
.res-t .go{font-size:var(--t-micro);color:var(--low)}
.res-k{display:grid;grid-template-columns:1fr auto;gap:var(--s2);padding:var(--s1) 0;
  font-size:var(--t-s);color:var(--mid)}
.res-k b{font-weight:700}
.res-k b.live{color:var(--good)}.res-k b.brk{color:var(--danger)}
.res-k b.mid{color:var(--hi)}.res-k b.blind{color:var(--low)}

/* ── BADGE DE VARIACIÓN ── */
.dt{font-size:var(--t-micro);font-weight:700;letter-spacing:.04em;padding:2px 7px;
  border-radius:var(--r-pill);display:inline-block}
.dt.up{color:var(--good);background:rgba(74,222,128,.14)}
.dt.dn{color:var(--danger);background:rgba(229,72,77,.14)}
.dt.eq{color:var(--low);background:var(--surface3)}

/* ── LOGO DE CANAL ── */
.lg{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;font-size:var(--t-m);font-weight:700;color:#0E1014}
.lg.img{background:var(--surface3);display:flex;align-items:center;justify-content:center}
.cn-top2{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.cn-top2 .nm{flex:1;min-width:0}
.cn-top2 .nm b{display:block;font-size:var(--t-l);font-weight:700}
.cn-top2 .nm span{font-size:var(--t-micro);color:var(--low)}
.cn-nums{display:flex;gap:var(--s5);align-items:baseline;min-width:0;flex-wrap:wrap}
.cn-num{text-align:right}
.cn-num b{display:block;font-size:var(--n-s);font-weight:700;letter-spacing:-.03em}
.cn-num span{font-size:var(--t-micro);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}

/* ── MATRIZ DE CUENTAS ── */
.cta{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.cta-c{padding:var(--s5);border-radius:var(--r-m);background:var(--surface2);
  border:1px solid var(--border)}
.cta-c.live{border-color:var(--gold-dim)}
.cta-h b{font-size:var(--t-xl);font-weight:700;display:block}
.cta-h span{font-size:var(--t-s);color:var(--low)}
.cta-p{font-size:var(--t-s);color:var(--mid);margin:var(--s2) 0 var(--s3);
  padding-bottom:var(--s3);border-bottom:1px solid var(--border)}
.cta-i{padding:var(--s2) 0}
.cta-i + .cta-i{border-top:1px solid var(--border)}
.cta-i b{font-size:var(--t-m);font-weight:700;display:block}
.cta-i .q{font-size:var(--t-s);color:var(--mid);margin-top:2px}
.cta-i .w{font-size:var(--t-xs);color:var(--low);margin-top:3px;font-style:italic}
.regla{margin-top:var(--s4);padding:var(--s4);border-radius:var(--r-s);
  background:rgba(216,168,71,.08);border:1px solid var(--gold-dim);
  font-size:var(--t-l);color:var(--hi);line-height:1.55}
.errr{margin-top:var(--s2);padding:var(--s4);border-radius:var(--r-s);
  background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.3);
  font-size:var(--t-s);color:var(--mid);line-height:1.55}

/* ── RADAR MINI DE CLIENTE ── */
.mini{width:100%;max-width:240px;height:auto;display:block;margin:0 auto}
.mini polygon.g{fill:none;stroke:var(--border);stroke-width:1}
.mini polygon.v{fill:rgba(216,168,71,.2);stroke:var(--gold);stroke-width:1.5}
.mini text{font-family:var(--sans);font-size:7.5px;font-weight:700;fill:var(--low)}

/* ── ÁREA DEL BACKEND ── */
.ba{display:grid;grid-template-columns:26px 120px 1.2fr 1fr 90px;gap:var(--s3);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.ba:last-child{border-bottom:0}
.ba-e{width:10px;height:10px;border-radius:3px;background:var(--low);margin:0 auto}
.ba-e.live{background:var(--good)}.ba-e.mid{background:var(--warn)}.ba-e.brk{background:var(--danger)}
.ba-cl{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;border-radius:var(--r-pill);padding:3px 8px;border:1px solid var(--border);color:var(--low)}
.ba-cl.si{color:var(--blue);border-color:rgba(91,155,213,.35)}

/* ── LTV ── */
.ltv{display:grid;grid-template-columns:1.2fr 70px 90px 100px 96px 1.6fr;gap:var(--s3);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.ltv:last-child{border-bottom:0}
.ltv-h{display:grid;grid-template-columns:1.2fr 70px 90px 100px 96px 1.6fr;gap:var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--border-hi);
  font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--low)}
.ltv-v{font-size:var(--t-l);font-weight:700;text-align:right}
.ltv-v.big{color:var(--good)}
.ltv-r{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;border-radius:var(--r-pill);padding:4px 8px;border:1px solid var(--border);color:var(--mid)}
.ltv.live .ltv-r{color:var(--good);border-color:rgba(74,222,128,.35)}
.ltv.brk .ltv-r{color:var(--danger);border-color:rgba(229,72,77,.35)}
.ltv-tot{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.ltv-tot div{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);text-align:center}
.ltv-tot div.pot{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.07)}
.ltv-tot b{display:block;font-size:var(--n-m);font-weight:700;letter-spacing:-.03em}
.ltv-tot div.pot b{color:var(--good)}
.ltv-tot span{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}

/* ── WINS ── */
.win{display:grid;grid-template-columns:1.2fr 96px 84px 2fr;gap:var(--s3);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.win:last-child{border-bottom:0}
.win-t{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;border-radius:var(--r-pill);padding:4px 8px;
  color:var(--good);border:1px solid rgba(74,222,128,.3)}
.win-q{font-size:var(--t-s);color:var(--low);text-align:center}

/* ── EMBUDO COMPACTO ── */
.fn.mini .fnr{grid-template-columns:104px 1fr 76px}
.fn.mini .fn-bar{height:20px}
.fn.mini .fn-bar b{font-size:var(--t-m)}
.fn.mini .fn-gap{height:6px;margin-left:104px}
.fn.mini .fn-n{font-size:var(--t-s)}
.fn.mini .fn-n span{font-size:9.5px}

/* ══ CRITERIO VISUAL ÚNICO ══
   Todo lo que se repite en el panel se define acá una sola vez.
   Los bloques particulares heredan de esto en vez de re-declararlo. */

/* 1 · ETIQUETA — todo rótulo en mayúscula usa exactamente estas medidas */
.card-t,.arh span,.mt-k,.pg-h span,.ld-h span,.tm-h span,.gp3-m,
.sy-fa i,.ce-f b,.cf-r div b,.cf-key b,.cf-bl b,.bal b,.alg span,
.tsum > div > span,.via b,.pgm span,.cal-h,.win-t,.ltv-r{
  font-size:var(--t-micro);font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;line-height:1.3}

/* 2 · CIFRA — un solo tamaño por jerarquía, nunca un valor suelto */
.tile .n,.mt-v,.gp3-v,.tsum b,.arh b{letter-spacing:-.03em;line-height:1.05;font-weight:700}
.mt-v,.gp3-v{font-size:var(--n-m)}
.tsum b,.arh b{font-size:var(--n-s)}

/* 3 · SEMÁFORO — el estado se dice con el mismo color en todo el panel */
.s-live,.dot.live,.mt-c.live .mt-v,.pal.live .pal-v{color:var(--good)}
.s-brk,.dot.brk,.mt-c.brk .mt-v{color:var(--danger)}
.s-mid,.dot.mid{color:var(--warn)}

/* 4 · CAJA INTERNA — toda tarjeta dentro de un bloque comparte fondo y borde */
.mt-c,.gp3 > div,.arh div,.tsum div,.ce-f,.cf-f,.bal > div,.pgm > div,.cal-d{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s)}

/* 5 · FILA DE TABLA — mismo aire y misma línea en todas las listas */
.pg,.ld,.pal,.ltv,.win,.ac,.tm{border-bottom:1px solid var(--border)}
.pg:last-of-type,.ld:last-of-type,.pal:last-of-type,
.ltv:last-child,.win:last-child{border-bottom:0}

/* 6 · CABECERA DE TABLA — siempre con línea abajo, nunca sin ella */
.pg-h,.ld-h,.tm-h,.ltv-h{padding-bottom:var(--s2);border-bottom:1px solid var(--border)}

/* 7 · CONTRASTE — el texto secundario nunca baja de este gris sobre superficie */
.k2,.note,.ac-f,.cf-r div p,.ce-f p,.mt-d,.gp3-d{color:var(--mid)}
.note{opacity:.92}

/* ── EMBUDO COMERCIAL ── */
.fnl-w2{max-width:600px;margin:0 auto}
.fnl{width:100%;height:auto;display:block}
.fnl-v{font-family:var(--sans);font-size:19px;font-weight:700;letter-spacing:-.02em}
.fnl-n{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.1em;
  fill:var(--mid)}
.fnl-r{font-family:var(--sans);font-size:11px;font-weight:700;fill:var(--low)}
.fnl-r.worst{fill:var(--danger)}
.fnl-w{font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.12em;
  fill:var(--danger)}
.fnl-x{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);
  margin-top:var(--s4)}
.fnl-x > div{padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border)}
.fnl-x b{display:block;font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;
  line-height:1}
.fnl-x .no b{color:var(--danger)}
.fnl-x span{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);margin-top:4px;line-height:1.3}
.fnl-x .no{border-color:rgba(229,72,77,.3)}
.fnl-c{margin-top:var(--s4);padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:rgba(229,72,77,.06);border:1px solid rgba(229,72,77,.25);
  font-size:var(--t-s);color:var(--hi);line-height:1.5}

/* ── LAS TRES LECTURAS DE LA MISMA PLATA ── */
.lec{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.lec > div{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.lec > div.live{border-color:rgba(74,222,128,.28)}
.lec b{display:block;font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;line-height:1}
.lec > div.live b{color:var(--good)}
.lec span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin:5px 0 var(--s2)}
.lec p{font-size:var(--t-xs);color:var(--mid);line-height:1.45}

/* la barra de pagos compara cobrado contra firmado */
.pgm-b{display:flex;align-items:flex-end;justify-content:center;gap:4px;
  height:52px;margin:var(--s2) 0 0}
.pgm-b i{width:16px;border-radius:2px 2px 0 0;display:block}
.pgm-b i.cob{background:var(--good)}
.pgm-b i.cer{background:var(--blue)}
.pgm > div.nil .pgm-b i{background:var(--danger);opacity:.35}
.pgm-l{display:flex;gap:var(--s5);justify-content:center;margin:var(--s2) 0 var(--s3)}
.pgm-l span{display:inline-flex;align-items:center;gap:5px;font-size:9px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--low)}
.pgm-l i{width:10px;height:10px;border-radius:2px}
.pgm-l i.cob{background:var(--good)} .pgm-l i.cer{background:var(--blue)}

/* ── LA META DEL MES ── */
.mta{display:grid;grid-template-columns:auto 1fr auto auto;gap:var(--s5);
  align-items:center;padding:var(--s4) var(--s5);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border);margin-bottom:var(--s3)}
.mta-p{font-size:var(--t-l);font-weight:700;text-transform:capitalize}
.mta-d{display:flex;gap:var(--s3)}
.mta-d i{width:38px;height:38px;border-radius:50%;
  border:2px dashed var(--border-hi);flex:0 0 auto}
.mta-d i.on{border:2px solid var(--good);background:rgba(74,222,128,.16)}
.mta-n,.mta-t{text-align:right;white-space:nowrap}
.mta-n b{font-size:var(--n-m);font-weight:700;letter-spacing:-.03em;
  line-height:1;color:var(--danger)}
.mta-t{font-size:var(--t-l);font-weight:700;color:var(--gold)}
.mta-n span,.mta-t span{display:block;font-size:var(--t-micro);font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--low);margin-top:3px}
.mta-x{padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:rgba(216,168,71,.07);border:1px solid rgba(216,168,71,.3);
  font-size:var(--t-s);color:var(--hi);line-height:1.5;margin-bottom:var(--s3)}

/* ── CALENDARIO DEL MES ── */
.cal-t{font-size:var(--t-l);font-weight:700;letter-spacing:-.02em;
  text-transform:capitalize;margin:var(--s4) 0 var(--s3)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--low);text-align:center;padding-bottom:var(--s2)}
.cal-d{min-height:96px;padding:5px;border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border);min-width:0}
.cal-d.off{background:transparent;border-color:transparent}
.cal-d.fin{background:var(--surface3)}
.cal-d.hoy{border-color:var(--gold);box-shadow:0 0 0 1px rgba(216,168,71,.35)}
.cal-n{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.cal-n{font-size:var(--t-xs);font-weight:700;color:var(--mid)}
.cal-d.hoy .cal-n{color:var(--gold)}
.cal-n b{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--bg);background:var(--gold);border-radius:3px;padding:1px 4px}
.cal-n u{margin-left:auto;text-decoration:none;font-size:8.5px;font-weight:600;
  color:var(--low)}
.cal-b{display:flex;align-items:center;gap:4px;font-size:9px;line-height:1.25;
  color:var(--mid);padding:1.5px 0;min-width:0}
.cal-b i{width:5px;height:5px;border-radius:2px;background:var(--c);flex:0 0 auto}
.cal-b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── PAGOS DE CONSULTORÍA ── */
.pgm{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);
  margin-bottom:var(--s4);align-items:end}
.pgm > div{padding:var(--s3);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);text-align:center}
.pgm > div.nil{border-color:rgba(229,72,77,.3)}
.pgm b{display:block;font-size:var(--t-l);font-weight:700;color:var(--good)}
.pgm > div.nil b{color:var(--danger)}
.pgm span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);margin-top:5px}
.pg-h,.pg{display:grid;grid-template-columns:1fr 116px 54px 78px 2fr;gap:var(--s3);
  align-items:center}
.pg-h{padding-bottom:var(--s2);border-bottom:1px solid var(--border)}
.pg-h span{font-size:9px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low)}
.pg-h span:nth-child(3),.pg-h span:nth-child(4){text-align:right}
.pg{padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.pg:last-of-type{border-bottom:0}
.pg-c{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;padding:2px 8px;border-radius:var(--r-pill);
  border:1px solid var(--border);color:var(--low)}
.pg-c.ren{color:var(--gold);border-color:rgba(216,168,71,.4)}
.pg-m{font-size:var(--t-xs);color:var(--low);text-align:right;font-weight:600}
.pg-v{font-size:var(--t-l);font-weight:700;text-align:right;color:var(--good)}

/* ── MÉTRICAS EN TARJETA ── */
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.mt-c{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.mt-c.live{border-color:rgba(74,222,128,.28)}
.mt-c.brk{border-color:rgba(229,72,77,.28)}
.mt-k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--low);margin-bottom:var(--s2)}
.mt-v{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.mt-c.live .mt-v{color:var(--good)}
.mt-c.brk .mt-v{color:var(--danger)}
.mt-c.mid .mt-v{color:var(--hi)}
.mt-d{font-size:var(--t-xs);color:var(--low);line-height:1.45;margin-top:var(--s2)}

/* ── BALANZA DE DOLOR ── */
.bal{display:flex;gap:4px;margin-bottom:var(--s2)}
.bal > div{padding:var(--s3) var(--s2);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border);text-align:center;min-width:0}
.bal > div.nil{opacity:.4}
.bal i{display:block;width:18px;height:4px;border-radius:2px;margin:0 auto var(--s2)}
.bal b{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--low);line-height:1.2}
.bal u{display:block;text-decoration:none;font-size:var(--t-l);font-weight:700;margin-top:3px}
.bal-b{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:2px;
  margin-bottom:var(--s4)}
.bal-b span{display:block}
.ld-h,.ld{display:grid;grid-template-columns:118px 128px 1.2fr 1.2fr 168px 92px;
  gap:var(--s3);align-items:center}
.ld-h{padding-bottom:var(--s2);border-bottom:1px solid var(--border)}
.ld-h span{font-size:9px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low)}
.ld{padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.ld:last-of-type{border-bottom:0}
.ld-n{font-size:var(--t-s);font-weight:700;line-height:1.2}
.ld-n em{display:block;font-style:normal;font-size:9px;color:var(--low);
  font-weight:500;margin-top:2px}
.ld-p{font-size:9.5px;font-weight:600;color:var(--mid);line-height:1.3}
.ld-p.tec{color:var(--gold)}
.ld-d{font-size:var(--t-xs);color:var(--hi);line-height:1.4}
.ld-x{display:flex;gap:3px;flex-wrap:wrap}
.ld-x span{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 6px;border-radius:var(--r-pill);border:1px solid;white-space:nowrap}
.ld-pr{display:grid;grid-template-columns:1fr 32px;gap:var(--s2);align-items:center}
.ld-pr i{display:block;height:6px;border-radius:3px;background:var(--gold)}
.ld-pr b{font-size:var(--t-xs);font-weight:700;text-align:right;color:var(--low)}

/* ── EL ÁRBOL DEL OS · sistema → agente → skill → acción ── */
.via{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  padding:var(--s3) var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);margin-bottom:var(--s4)}
.via span{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--hi)}
.via i{width:14px;height:6px;flex:0 0 auto;
  border-top:1.5px solid var(--border-hi);border-right:1.5px solid var(--border-hi);
  transform:rotate(45deg);margin:0 2px}
.via b{margin-left:auto;font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--low)}

.tsum{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s2);
  margin-bottom:var(--s4)}
.tsum div{padding:var(--s3);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border)}
.tsum b{display:block;font-size:23px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.tsum b span{font-size:var(--t-s);color:var(--low);font-weight:600}
.tsum > div > span{display:block;font-size:9px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--low);margin-top:3px;line-height:1.3}
.tsum .ok b{color:var(--good)} .tsum .no b{color:var(--danger)}
.tsum .ok{border-color:rgba(74,222,128,.3)} .tsum .no{border-color:rgba(229,72,77,.3)}

/* nivel 1 — el sistema */
.sy{border:1px solid var(--border);border-radius:var(--r-m);
  background:var(--surface2);margin-bottom:var(--s2);overflow:hidden}
.sy.auto{border-color:rgba(74,222,128,.3)}
.sy.semi{border-color:rgba(232,179,57,.28)}
.sy > summary{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:30px 1fr 92px 62px 74px 1fr 68px 60px 18px;
  gap:var(--s3);align-items:center;padding:var(--s3) var(--s4)}
.sy > summary::-webkit-details-marker{display:none}
.sy > summary:hover{background:rgba(255,255,255,.02)}
.sy-i{font-size:var(--t-xs);font-weight:700;color:var(--low);
  background:var(--surface3);border-radius:var(--r-s);text-align:center;padding:2px 0}
.sy-n{font-size:var(--t-l);font-weight:700;line-height:1.2;min-width:0}
.sy-n em{display:block;font-style:normal;font-size:var(--t-micro);
  font-weight:500;color:var(--low);margin-top:2px}
.sy-ag{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  text-align:center;padding:3px 0;border-radius:var(--r-pill);
  border:1px solid var(--border);color:var(--low)}
.sy-ag.auto{color:var(--good);border-color:rgba(74,222,128,.4)}
.sy-ag.semi{color:var(--warn);border-color:rgba(232,179,57,.4)}
.sy-ag.mano{color:var(--danger);border-color:rgba(229,72,77,.35)}
.sy-c{font-size:var(--t-m);font-weight:700;text-align:right;white-space:nowrap}
.sy-c i{font-style:normal;font-size:9px;color:var(--low);font-weight:600;margin-left:3px}
.sy-b{display:block;height:8px;border-radius:3px;background:var(--surface3);overflow:hidden}
.sy-b i{display:block;height:100%;border-radius:3px;background:var(--good)}
.sy-ah{font-size:var(--t-m);font-weight:700;text-align:right;color:var(--good);
  white-space:nowrap}
.sy-ah.nil{color:var(--danger);font-size:var(--t-xs)}
.sy-u{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  text-align:center;color:var(--low)}
.sy-u.alta{color:var(--danger)}
.sy-cv{font-size:16px;color:var(--low);justify-self:end;transition:transform .2s}
.sy[open] > summary .sy-cv{transform:rotate(90deg)}
.sy-b2{padding:0 var(--s4) var(--s3) calc(30px + var(--s4) + var(--s3));
  border-top:1px solid var(--border)}

/* nivel 2 — la skill */
.sk2{border-bottom:1px solid var(--border)}
.sk2:last-child{border-bottom:0}
.sk2 > summary{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:190px 1fr 56px 64px 18px;gap:var(--s3);
  align-items:center;padding:var(--s3) 0}
.sk2 > summary::-webkit-details-marker{display:none}
.sk2 > summary:hover .sk2-n{color:var(--gold)}
.sk2-n{font-size:var(--t-s);font-weight:700;font-family:var(--sans);color:var(--hi)}
.sk2-r{font-size:var(--t-xs);color:var(--low);line-height:1.4;min-width:0}
.sk2-c{font-size:var(--t-s);font-weight:700;text-align:right;white-space:nowrap}
.sk2-c i{font-style:normal;font-size:9px;color:var(--low);margin-left:2px}
.sk2-ah{font-size:var(--t-s);font-weight:700;text-align:right;color:var(--good)}
.sk2-ah.nil{color:var(--low)}
.sk2-cv{font-size:14px;color:var(--low);justify-self:end;transition:transform .2s}
.sk2[open] > summary .sk2-cv{transform:rotate(90deg)}

/* nivel 3 — la acción */
.ac-w{padding:0 0 var(--s3)}
.ac{display:grid;grid-template-columns:1.5fr 96px 88px 96px 74px 84px 1fr;
  gap:var(--s3);align-items:center;padding:var(--s3);border-radius:var(--r-s);
  background:var(--surface);border:1px solid var(--border);margin-bottom:5px}
.ac.humo{border-color:rgba(229,72,77,.25);background:rgba(229,72,77,.04)}
.ac.humo .ac-n{color:var(--low)}
.ac-n{font-size:var(--t-s);font-weight:600;line-height:1.35;min-width:0}
.ac-t{text-align:right;white-space:nowrap}
.ac-t b{font-size:var(--t-m);font-weight:700}
.ac-t span{font-size:9px;color:var(--low);margin-left:2px}
.ac-t u{display:block;text-decoration:none;font-size:9px;color:var(--low);margin-top:1px}
.ac-t.dim b{color:var(--low);font-weight:600}
.ac-l{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  text-align:right}
.ac-l u{display:block;text-decoration:none;font-size:var(--t-s);
  letter-spacing:0;text-transform:none;font-weight:700;margin-top:1px}
.lv-alto{color:var(--good)} .lv-medio{color:var(--warn)}
.lv-bajo{color:var(--mid)}  .lv-nulo{color:var(--danger)}
.ac-im{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;padding:2px 6px;border-radius:var(--r-pill);
  border:1px solid var(--border);color:var(--low)}
.ac-im.directo{color:var(--gold);border-color:rgba(216,168,71,.35)}
.ac-au{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;padding:2px 6px;border-radius:var(--r-pill)}
.ac-au.auto{color:var(--good);background:rgba(74,222,128,.12)}
.ac-au.semi{color:var(--warn);background:rgba(232,179,57,.12)}
.ac-au.mano{color:var(--danger);background:rgba(229,72,77,.1)}
.ac-m{font-size:9.5px;color:var(--mid);line-height:1.35}
.ac-m.nil{color:var(--danger);opacity:.75}
.ac-f{font-size:9.5px;color:var(--low);line-height:1.4;
  padding-left:var(--s3);border-left:2px solid var(--border-hi)}
.ac-f b{display:block;font-size:8.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--border-hi);margin-bottom:2px}
.sy-fa{display:flex;flex-wrap:wrap;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.sy-fa span{display:flex;align-items:center;gap:var(--s2)}
.sy-fa i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}
.sy-fa b{font-size:var(--t-xs);font-weight:700}
.sy-fa b.ok{color:var(--good)}.sy-fa b.mid{color:var(--warn)}.sy-fa b.no{color:var(--danger)}
.sy-fa .con{margin-left:auto}
.sy-fa .con div{display:flex;gap:4px;flex-wrap:wrap}
.tm-src{margin-top:var(--s3);font-size:9.5px;color:var(--low);
  letter-spacing:.04em;text-align:right}

/* ── CATÁLOGO DE CONTENIDO ── */
.ang{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.ang-c{padding:var(--s4);border-radius:var(--r-m);background:var(--surface2);
  border:1px solid var(--border);border-top:3px solid var(--c);min-width:0}
.ang-h{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.ang-k{width:26px;height:26px;border-radius:var(--r-s);background:var(--c);
  color:var(--bg);font-size:var(--t-m);font-weight:700;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.ang-h b{font-size:var(--t-m);font-weight:700;line-height:1.2}
.ang-q{font-size:var(--t-s);color:var(--mid);line-height:1.5;margin-bottom:var(--s3)}
.ang-f{display:grid;grid-template-columns:64px 1fr;gap:var(--s2);
  font-size:var(--t-xs);color:var(--hi);padding:3px 0}
.ang-f i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}
.ang-e{display:flex;flex-direction:column;gap:3px;margin-top:var(--s3);
  padding-top:var(--s3);border-top:1px solid var(--border)}
.ang-e span{font-size:9.5px;color:var(--mid);line-height:1.35;
  padding-left:var(--s3);border-left:2px solid var(--c)}
.ang-p{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:var(--s3)}
.ang-p img{width:100%;height:auto;border-radius:4px;display:block;
  border:1px solid var(--border)}

.gen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.gen-c{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);position:relative}
.gen-c::after{content:'';position:absolute;right:-9px;top:50%;width:7px;height:7px;
  border-top:1.5px solid var(--border-hi);border-right:1.5px solid var(--border-hi);
  transform:translateY(-50%) rotate(45deg)}
.gen-c:last-child::after{display:none}
.gen-i{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--gold)}
.gen-c b{display:block;font-size:var(--t-m);font-weight:700;margin:3px 0 2px}
.gen-f{font-size:9.5px;font-weight:600;color:var(--mid)}
.gen-q{font-size:var(--t-xs);color:var(--low);font-style:italic;line-height:1.4;
  margin-top:var(--s2)}
.gen-e{font-size:9.5px;color:var(--hi);line-height:1.4;margin-top:var(--s2);
  padding-top:var(--s2);border-top:1px solid var(--border)}

.des{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2)}
.des > div{padding:var(--s3);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);text-align:center}
.des i{display:block;width:22px;height:3px;border-radius:2px;background:var(--c);
  margin:0 auto var(--s2)}
.des b{display:block;font-size:var(--t-s);font-weight:700}
.des span{display:block;font-size:9.5px;color:var(--low);margin-top:3px;line-height:1.35}
