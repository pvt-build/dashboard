        +'<div class="s8-sc"><span>'+pct(a)+'<u>/'+Math.round(a.t*100)+'</u></span>'
        +'<div class="bq"><i class="'+esc(a.e)+'" style="width:'+pct(a)+'%"></i>'
        +'<s style="left:calc('+Math.round(a.t*100)+'% - 1px)"></s></div></div>'
        +'<div class="s8-mv">'+esc(a.mv)+'</div>'
        +'</button>'; }).join('')+'</div>'
      +'<div class="concl"><b>Conclusión</b>'+esc(SI.concl)+'</div>';

    /* ficha de sistema: KPIs + su visual propio */
    var kpi=function(a){
      return '<div class="k8">'+a.kpis.map(function(x){
        return '<div class="k8-c '+esc(x.e)+'"><div class="k8-k">'+esc(x.k)+'</div>'
          +'<div class="k8-v">'+esc(x.v)+'</div></div>'; }).join('')+'</div>';
    };
    var mv=function(a){
      return '<div class="mv8"><span>Mínimo viable</span>'+esc(a.mv)+'</div>';
    };
    var lista=function(arr,campo){
      return chips(arr.map(function(x){
        return {n:x.n, v:x.v, d:x[campo], e:x.e}; }));

    var barras=function(arr,vkey,fmt){

        return '<div class="b8-r"><span>'+esc(x.n)+'</span>'
          +'<div class="bq"><i class="'+esc(x.e||'mid')+'" style="width:'
          +Math.round(x[vkey]/mx*100)+'%"></i></div>'
          +'<b>'+(fmt?fmt(x[vkey]):x[vkey])+'</b></div>'; }).join('')+'</div>';
    };

    var F=A[0], AV=A[1], OF=A[2], MK=A[3], CP=A[4], VT=A[5], EN=A[6], SU=A[7];

    var hF=kpi(F)+lista(F.items,'d')+mv(F);

    var hA=kpi(AV)
      + '<div class="card-t" style="margin-top:var(--s5)">Por tipo — cuántos entran y cuántos pagan</div>'
      + '<div class="avt">'+AV.tipos.map(function(t){
          return '<div class="avt-c '+esc(t.e)+'"><div class="avt-n">'+esc(t.n)+'</div>'
            +'<div class="avt-v">'+t.v+'<u>fichas</u></div>'
            +'<div class="avt-p">'+t.pago+' pagaron</div>'
            +'<div class="bq"><i class="'+esc(t.e)+'" style="width:'
            +Math.round(t.pago/t.v*100)+'%"></i></div>'
            +'<div class="k2">'+esc(t.d)+'</div></div>'; }).join('')+'</div>'
      + '<div class="dos"><div class="dos-c ok"><b>Cierra cuando</b>'
      + AV.cierra.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'
      + '<div class="dos-c no"><b>No cierra cuando</b>'
      + AV.nocierra.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div></div>'
      + '<div class="fnl-c">'+esc(AV.falta)+'</div>' + mv(AV);

    var esc2=OF.escalera, mxe=Math.max.apply(null,esc2.map(function(x){return x.v}));
    var hO=kpi(OF)
      + '<div class="card-t" style="margin-top:var(--s5)">Las tres capas</div>'
      + '<div class="cap3">'+OF.capas.map(function(c){
          return '<div class="cap3-c '+esc(c.e)+'"><div class="cap3-n">'+esc(c.n)+'</div>'
            +'<div class="cap3-p">'+esc(c.p)+'</div>'
            +'<div class="k2">'+esc(c.d)+'</div></div>'; }).join('')+'</div>'
      + figura('El ticket, mes a mes · USD',
               serie(esc2.map(function(x){return {m:x.m,v:x.v}}),
                     {fmt:function(v){return '$'+Math.round(v)}, hoy:esc2.length-1,
                      alt:'Ticket por mes'}),
               OF.esc_d)
      + mv(OF);

    var SC=(D.series||{}).contenido||[];
    var hM=kpi(MK)
      + '<div class="gr2">'
      + figura('Alcance por mes · último año',
               serie(SC.map(function(x){return {m:x.m,v:x.a}}),
                     {fmt:function(v){return v>=1000?Math.round(v/1000)+'k':Math.round(v)},
                      hoy:SC.length-1, alt:'Alcance mensual'}),
               'Un solo reel de junio hizo el 47% del alcance del año.')
      + figura('Piezas publicadas por mes',
               serie(SC.map(function(x){return {m:x.m,v:x.n}}),
                     {hoy:SC.length-1, alt:'Piezas por mes'}),
               'El volumen no explica el alcance: el pico no fue el mes de más piezas.')
      + '</div>'
      + barras(MK.mejor,'v',function(v){return money(v)})
      + '<div class="fnl-c">'+esc(MK.falta)+'</div>' + mv(MK);

    var hC=kpi(CP)
      + '<div class="card-t" style="margin-top:var(--s5)">Este mes</div>'
      + '<div class="k8">'+CP.mes.map(function(x){
          return '<div class="k8-c '+esc(x.e)+'"><div class="k8-k">'+esc(x.n)+'</div>'

      + '<div class="fnl-c">'+esc(CP.falta)+'</div>' + mv(CP);

               serie(SV,{fmt:function(v){return v>=1000?(v/1000).toFixed(1)+'M':Math.round(v)},
                         hoy:SV.map(function(x){return x.proy}).indexOf(true)-1,
                         alt:'Caja mensual de consultoría'}),
               'Lo rayado es proyección, no caja. Septiembre todavía no cierra.')
      + '<div class="card-t" style="margin-top:var(--s5)">Este mes</div>'
      + lista(VT.mes,'d') + mv(VT);

    var hE=kpi(EN)
      + '<div class="card-t" style="margin-top:var(--s5)">Entregables</div>'
      + lista(EN.entregables,'d') + mv(EN);

    var mxs=Math.max.apply(null,SU.agregada.map(function(x){return x.v}));
    var hS=kpi(SU)
      + '<div class="card-t" style="margin-top:var(--s5)">Facturación agregada de la cartera</div>'
      + '<div class="b8">'+SU.agregada.map(function(x){
          return '<div class="b8-r"><span>'+esc(x.n)+'</span>'
            +'<div class="bq"><i class="live" style="width:'
            +Math.round(x.v/mxs*100)+'%"></i></div>'

    var dec='<div class="dec">'
      +'<div class="dec-l"><span>El cuello de hoy</span>'
      + icono(peor.k) +'<b>'+esc(peor.n)+'</b>'
      +'<u>'+pct(peor)+' de '+Math.round(peor.t*100)+'</u></div>'
      +'<div class="dec-a"><span>Mueve esto</span><p>'+esc(peor.mv)+'</p></div>'
      +'<div class="dec-p"><span>Lo confirma</span><p>'
      + esc(peor.kpis[0].k+': '+peor.kpis[0].v)+'</p></div>'
      +'<button type="button" class="dec-go" data-go="'
      + esc({fnd:'os',avt:'crm',ofr:'ventas',mkt:'marketing',
             cap:'crm',vta:'ventas',ent:'delivery',suc:'success'}[peor.k])

    return vhead('Dashboard','el negocio en un vistazo',SI.lectura)

      + '<div class="stack">'

  function moverSlider(){
    var b=btns[cur]; if(!b) return;
    slider.style.left=b.offsetLeft+'px';
    slider.style.width=b.offsetWidth+'px';
  }
  window.addEventListener('resize',moverSlider);
  var montada={};
  function montar(i){
    var v=VIEWS[i], el=views[i];
    if(!v || !el || montada[v.id]) return;
    NB=0; el.innerHTML=v.r(); montada[v.id]=true;
  }
  function go(i){
    cur=(i+VIEWS.length)%VIEWS.length;
    montar(cur);
    for(var k=0;k<views.length;k++){
      views[k].classList.toggle('on',k===cur);
      btns[k].classList.toggle('on',k===cur);
      btns[k].setAttribute('aria-selected', k===cur ? 'true' : 'false');
      btns[k].tabIndex = k===cur ? 0 : -1;
    }
    moverSlider();
    if(btns[cur].scrollIntoView) btns[cur].scrollIntoView({block:'nearest',inline:'center'});
    window.scrollTo({top:0,behavior:'smooth'});
  }
  for(var k=0;k<btns.length;k++)
    btns[k].addEventListener('click',function(e){
      go(parseInt(e.currentTarget.getAttribute('data-i'),10)); });
  stage.addEventListener('click',function(e){
    var b=e.target.closest('.ar-go,.res-c,.s8-c,.dec-go'); if(!b) return;
    if(b.tagName==='A') return;
    e.preventDefault(); e.stopPropagation();
    var i=VIEWS.findIndex(function(v){return v.id===b.getAttribute('data-go')});
    if(i>=0) go(i);
  });
  /* Las flechas solo mandan cuando el foco está en la barra, como espera el
     patrón de pestañas. Antes se las quedaba el documento entero. */
  tabs.addEventListener('keydown',function(e){
    if(!e.target.matches || !e.target.matches('[role="tab"]')) return;
    if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
    e.preventDefault();
    go(cur+(e.key==='ArrowRight'?1:-1));
    if(btns[cur]) btns[cur].focus();
  });
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var t=e.target;
    if(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    var n=Number(e.key);
    if(n>=1 && n<=VIEWS.length){ e.preventDefault(); go(n-1); }
  });
  go(0);
})();
</script>
