.fmx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.fmx-c{display:grid;grid-template-columns:82px 1fr;gap:var(--s3);padding:var(--s3);
  border-radius:var(--r-s);background:var(--surface2);border:1px solid var(--border);
  min-width:0}
.fmx-c.live{border-color:rgba(74,222,128,.3)}
.fmx-c.brk{border-color:rgba(229,72,77,.28)}
.fmx-c img{width:100%;height:auto;border-radius:4px;display:block;align-self:start}
.fmx-nil{aspect-ratio:4/5;border-radius:4px;border:1px dashed var(--border-hi);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:8.5px;color:var(--low);line-height:1.3}
.fmx-b{min-width:0}
.fmx-h{display:flex;align-items:center;gap:5px;margin-bottom:var(--s2)}
.fmx-h b{font-size:var(--t-m);font-weight:700;flex:1}
.fmx-h u{text-decoration:none;font-size:9.5px;font-weight:700;color:var(--low)}
.fmx-b p{font-size:9.5px;color:var(--mid);line-height:1.45}
.fmx-f{display:flex;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap}
.fmx-f span{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--low)}
.fmx-e{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  margin-top:var(--s2);color:var(--low)}
.fmx-c.live .fmx-e{color:var(--good)}
.fmx-c.brk .fmx-e{color:var(--danger)}

.bnc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s2)}
.bnc-c{min-width:0}
.bnc-c img{width:100%;height:auto;border-radius:4px;display:block;
  border:1px solid var(--border)}
.bnc-n{font-size:9px;color:var(--mid);line-height:1.3;margin-top:5px}
.bnc-a{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.08em;
  padding:1px 5px;border-radius:3px;margin-top:3px;
  background:var(--surface3);color:var(--low)}
.bnc-a.aA{background:rgba(91,155,213,.2);color:var(--blue)}
.bnc-a.aB{background:rgba(229,72,77,.18);color:var(--danger)}
.bnc-a.aC{background:rgba(74,222,128,.18);color:var(--good)}
.bnc-a.aMP{background:rgba(167,139,250,.2);color:var(--purple)}
.pnd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);
  margin-top:var(--s4)}
.pnd-c{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);
  border-radius:var(--r-s);background:var(--surface2);
  border:1px dashed var(--border-hi)}
.pnd-c b{flex:1;font-size:var(--t-xs);font-weight:600;color:var(--mid)}
.pnd-c u{text-decoration:none;font-size:8.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}
.pnd-c u.pAlta{color:var(--danger)}

/* ── CADENA DE CONTENIDO · el diagrama ── */
.dg{display:flex;flex-direction:column;gap:var(--s3)}
.dg-fila{display:grid;grid-template-columns:64px 1fr;gap:var(--s4);align-items:start}
.dg-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--low);text-align:right;padding-top:var(--s4)}
.dg-row{display:flex;align-items:stretch;gap:0}
.dg-n{flex:1;min-width:0;padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border);position:relative}
.dg-n.live{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.06)}
.dg-n.mid{border-color:rgba(232,179,57,.35);background:rgba(232,179,57,.05)}
.dg-n.brk{border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.06)}
.dg-n.dg-fork{border-style:dashed}
.dg-n.dg-cl{background:var(--surface3)}
.dg-i{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--low)}
.dg-n.live .dg-i{color:var(--good)}
.dg-n.mid .dg-i{color:var(--warn)}
.dg-n.brk .dg-i{color:var(--danger)}
.dg-n b{display:block;font-size:var(--t-m);font-weight:700;margin:2px 0 1px;line-height:1.2}
.dg-n em{display:block;font-style:normal;font-size:9px;color:var(--low);line-height:1.3}
.dg-n u{display:block;text-decoration:none;font-size:9px;font-weight:600;
  color:var(--mid);margin-top:5px;padding-top:5px;border-top:1px solid var(--border)}
.dg-fl{flex:0 0 26px;align-self:center;height:9px;position:relative}
.dg-fl::before{content:'';position:absolute;left:0;right:7px;top:4px;height:1.5px;
  background:var(--border-hi)}
.dg-fl::after{content:'';position:absolute;right:5px;top:1.5px;width:7px;height:7px;
  border-top:1.5px solid var(--border-hi);border-right:1.5px solid var(--border-hi);
  transform:rotate(45deg)}

/* el carril partido en dos cuentas */
.dg-lanes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.dg-lane{padding:var(--s4);border-radius:var(--r-m);background:var(--surface2);
  border:1px solid var(--border);border-top:3px solid var(--c);min-width:0}
.dg-lh{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.dg-lh b{font-size:var(--t-l);font-weight:700;color:var(--c)}
.dg-lh span{font-size:var(--t-micro);color:var(--low)}
.dg-lh em{width:100%;font-style:normal;font-size:9px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--low);margin-top:3px}
.dg-lr{font-size:var(--t-s);color:var(--mid);line-height:1.5;
  margin:var(--s3) 0;padding-bottom:var(--s3);border-bottom:1px solid var(--border)}
.dg-hk{display:flex;flex-direction:column;gap:5px}
.hk{padding:var(--s2) var(--s3);border-radius:var(--r-s);background:var(--surface);
  border-left:2px solid var(--c)}
.hk-t{font-size:var(--t-s);font-weight:600;color:var(--hi);line-height:1.35}
.hk-g{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--low);margin-top:2px}
.dg-pz{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:var(--s3)}
.dg-lane:nth-child(2) .dg-pz{grid-template-columns:repeat(2,1fr)}
.dg-pz img{width:100%;height:auto;border-radius:var(--r-s);display:block;
  border:1px solid var(--border)}

/* ── LA FICHA DE CADA ETAPA ── */
.cad-l{margin-top:var(--s5);border-top:1px solid var(--border)}
.ce{border-bottom:1px solid var(--border)}
.ce summary{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:32px 1fr auto 128px 76px 18px;gap:var(--s3);
  align-items:center;padding:var(--s3) 0}
.ce summary::-webkit-details-marker{display:none}
.ce summary:hover{background:rgba(255,255,255,.018)}
.ce-i{font-size:var(--t-xs);font-weight:700;color:var(--low)}
.ce.live .ce-i{color:var(--good)}.ce.mid .ce-i{color:var(--warn)}.ce.brk .ce-i{color:var(--danger)}
.ce-n{font-size:var(--t-m);font-weight:700}
.ce-n em{display:block;font-style:normal;font-size:var(--t-micro);
  font-weight:500;color:var(--low);margin-top:2px}
.ce-p{display:flex;gap:4px;align-items:center}
.ce-w{font-size:9.5px;font-weight:600;color:var(--mid);text-align:right}
.ce-s{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  text-align:right;color:var(--low)}
.ce.live .ce-s{color:var(--good)}.ce.mid .ce-s{color:var(--warn)}.ce.brk .ce-s{color:var(--danger)}
.ce-cv{font-size:15px;color:var(--low);justify-self:end;transition:transform .2s}
.ce[open] .ce-cv{transform:rotate(90deg)}
.ce-b{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);
  padding:0 0 var(--s4) calc(32px + var(--s3))}
.ce-f{padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border)}
.ce-f b{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:5px}
.ce-f p{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.ce-f.ej{background:rgba(91,155,213,.07);border-color:rgba(91,155,213,.3)}
.ce-f.ej b{color:var(--blue)}
.ce-f.ej p{color:var(--hi)}
.ce-f.sk b{color:var(--gold)}
.ce-f.sk p{font-family:var(--sans);font-weight:600;color:var(--hi)}
.ce-f.dn{background:rgba(78,195,168,.06);border-color:rgba(78,195,168,.28)}
.ce-f.dn b{color:var(--teal)}
.ce-f.dn p{color:var(--hi)}
.ce-f.ft{background:rgba(229,72,77,.06);border-color:rgba(229,72,77,.25)}
.ce-f.ft b{color:var(--danger)}

.lgo{width:16px;height:16px;border-radius:4px;object-fit:contain;flex:0 0 auto;
  vertical-align:-3px}
.lgo.big{width:26px;height:26px;border-radius:7px}
.chp{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;
  padding:3px 8px 3px 5px;border-radius:var(--r-pill);
  background:var(--surface3);color:var(--mid);white-space:nowrap}
.chp .lgo{width:13px;height:13px;border-radius:3px}
.chp-d{width:6px;height:6px;border-radius:2px;background:var(--border-hi);
  margin-left:2px;flex:0 0 auto}

/* ── LAS 8 ÁREAS · fila enriquecida ── */
.arh{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s4)}
.arh div{padding:var(--s2) var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.arh b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.arh span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);margin-top:2px}
.arh .g b{color:var(--good)} .arh .m b{color:var(--warn)} .arh .b b{color:var(--danger)}

.arx{border-top:1px solid var(--border)}
.arx:first-of-type{border-top:0}
.arx summary{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:30px 172px 1fr 118px 20px;gap:var(--s4);
  align-items:center;padding:var(--s4) 0}
.arx summary::-webkit-details-marker{display:none}
.arx summary:hover{background:rgba(255,255,255,.018)}
.arx-i{font-size:var(--t-s);font-weight:700;color:var(--low);letter-spacing:.04em}
.arx.brk .arx-i{color:var(--danger)}
.arx-n{font-size:var(--t-l);font-weight:700;line-height:1.15}
.arx-s{font-size:var(--t-micro);color:var(--low);margin-top:3px}
.arx-s i{font-style:normal;color:var(--mid)}
.arx-mid{min-width:0}
.arx-et{font-size:var(--t-xs);font-weight:600;color:var(--mid);margin-bottom:5px}
.arx-nota{font-size:var(--t-s);color:var(--low);line-height:1.45;margin-top:6px}

/* barra de brecha: relleno = hoy, rayado = lo que falta, marca = objetivo */
.gap{position:relative;height:12px;border-radius:3px;background:var(--surface3);overflow:hidden}
.gap i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:var(--mid)}
.arx.live .gap i{background:var(--good)}
.arx.mid  .gap i{background:var(--warn)}
.arx.brk  .gap i{background:var(--danger)}
.gap u{position:absolute;top:0;bottom:0;text-decoration:none;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.11) 0 2px,transparent 2px 6px)}
.gap s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--hi);opacity:.55}

.arx-sc{text-align:right;white-space:nowrap}
.arx-sc b{font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em}
.arx-sc b span{font-size:var(--t-s);color:var(--low);font-weight:600}
.arx.live .arx-sc b{color:var(--good)}
.arx.mid  .arx-sc b{color:var(--warn)}
.arx.brk  .arx-sc b{color:var(--danger)}
.arx-gp{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);margin-top:2px}
.arx-cv{font-size:16px;color:var(--low);transition:transform .2s;justify-self:end}
.arx[open] .arx-cv{transform:rotate(90deg)}
.arx-fl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--danger);border:1px solid rgba(229,72,77,.4);border-radius:var(--r-pill);
  padding:1px 6px;margin-left:var(--s2);white-space:nowrap}
.arx-body{padding:0 0 var(--s5) calc(30px + var(--s4));
  display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.arx-r{grid-column:1/-1;font-size:var(--t-s);color:var(--mid);line-height:1.5;
  padding:var(--s3) var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border-left:2px solid var(--border-hi)}

/* ── FICHA DE CLIENTE EN CONSULTORÍA ── */
.cfg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);
  align-items:stretch}
.cf{padding:var(--s4);border-radius:var(--r-m);background:var(--surface2);
  border:1px solid var(--border);min-width:0;display:flex;flex-direction:column}
.cf.live{border-color:rgba(74,222,128,.3)}
.cf.mid{border-color:rgba(232,179,57,.28)}
.cf.brk{border-color:rgba(229,72,77,.3)}
.cf-hd{display:flex;align-items:flex-start;gap:var(--s2);
  padding-bottom:var(--s3);border-bottom:1px solid var(--border)}
.cf-hd .dot{margin-top:5px}
.cf-n{font-size:var(--t-m);font-weight:700;line-height:1.25}
.cf-meta{font-size:var(--t-micro);color:var(--low);margin-top:2px}

.cf-pg{padding:var(--s3) 0}
.cf-ses{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;line-height:1}
.cf-ses span{font-size:var(--t-xs);color:var(--low);font-weight:500}
.cf-est{font-size:var(--t-xs);font-weight:600;color:var(--mid);margin-top:3px}
.cf-bar{height:5px;border-radius:3px;background:var(--surface3);
  overflow:hidden;margin:var(--s2) 0 5px}
.cf-bar i{display:block;height:100%;border-radius:3px;background:var(--mid)}
.cf.live .cf-bar i{background:var(--good)}
.cf.mid  .cf-bar i{background:var(--warn)}
.cf.brk  .cf-bar i{background:var(--danger)}
.cf-rit{font-size:9.5px;color:var(--low)}
.cf-rl{font-size:9px;color:var(--low);line-height:1.35;text-align:center;
  margin:2px 0 var(--s3)}

.cf-key{padding:var(--s3);border-radius:var(--r-s);
  background:rgba(216,168,71,.07);border:1px solid rgba(216,168,71,.32)}
.cf-key b{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.cf-key p{font-size:var(--t-s);color:var(--hi);font-weight:600;line-height:1.45}
.cf-bl{margin-top:var(--s2);padding:var(--s3);border-radius:var(--r-s);
  background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.28);
  font-size:var(--t-xs);color:var(--hi);line-height:1.45}
.cf-bl b{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--danger);margin-bottom:3px}

.cf-mas{margin-top:auto;padding-top:var(--s2);border-top:1px solid var(--border)}
.cf-mas summary{list-style:none;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;padding:var(--s3) 0;
  font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}
.cf-mas summary::-webkit-details-marker{display:none}
.cf-mas summary:hover{color:var(--mid)}
.cf-mas summary span{font-size:15px;transition:transform .2s}
.cf-mas[open] summary span{transform:rotate(90deg)}
.cf-f{padding:var(--s3);border-radius:var(--r-s);background:var(--surface);
  border:1px solid var(--border);margin-bottom:var(--s2)}
.cf-f b{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:4px}
.cf-f p{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.cf-go{display:block;padding-top:var(--s3);text-align:center;
  font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--gold);text-decoration:none}
.cf-go:hover{color:var(--hi)}


/* ── RESPONSIVE ── */
@media(max-width:1100px){
  .cfg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .radar-wrap{grid-template-columns:1fr;gap:var(--s4)}
  .radar-svg{max-width:min(100%,440px)}
  .rw-ar{grid-template-columns:22px 1fr 124px 84px}
  .rw-ar .k2{grid-column:2/-1}
  .rw-sy{grid-template-columns:18px 1fr 1fr}
  .rw-sy .k2{grid-column:2/-1}
  .ikigai{grid-template-columns:1fr}
}
@media(max-width:860px){
  .topnav-in{min-height:auto;padding-top:var(--s2);padding-bottom:var(--s2);
    grid-template-columns:1fr;gap:var(--s2)}
  .navdate{display:none}
  .tabs{grid-column:1/-1;width:100%}
  .tabs button{font-size:var(--t-m);padding:var(--s2) var(--s3)}
  .wrap{padding-top:calc(62px + var(--s4))}
  .vhead{grid-template-columns:1fr;gap:var(--s2);align-items:start}
  .vtitle{white-space:normal}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .rw-tr{grid-template-columns:22px 1fr 72px}
  .rw-tr .meter{grid-column:2/-1}
  .rw-ch{grid-template-columns:100px 1fr 72px}
  .ct{grid-template-columns:1fr 84px;row-gap:var(--s1)}
  .ct .bar{grid-column:1/-1}
  .fnr{grid-template-columns:96px 1fr 76px;gap:var(--s3)}
  .fn-gap{margin-left:96px}
  .cli{grid-template-columns:1fr 88px;row-gap:var(--s3)}
  .cli-x,.cli-p{grid-column:1/-1}
  .cn-top{grid-template-columns:1fr 72px 72px;row-gap:var(--s2)}
  .cn-txt{grid-template-columns:1fr;gap:var(--s3)}
  .ik-wrap{grid-template-columns:1fr;gap:var(--s4)}
  .ik-p{grid-template-columns:1fr;gap:var(--s1)}
  .gp{grid-template-columns:26px 1fr;row-gap:var(--s1)}
  .gp .k2,.gp-d{grid-column:2}
  .og{grid-template-columns:1fr 54px;row-gap:var(--s1)}
  .og .k2{grid-column:1/-1}
  .tm,.tm-h{grid-template-columns:1fr 70px 76px;row-gap:var(--s1)}
  .tm .k2{grid-column:1/-1}
  .tm-h span:nth-child(n+4){display:none}
  .dg-b{grid-template-columns:1fr;gap:var(--s3)}
  .esc{grid-template-columns:repeat(2,1fr)}
  .esc-ar{display:none}
  .inv{grid-template-columns:1fr}
  .ob{grid-template-columns:1fr 56px;row-gap:var(--s1)}
  .ob .k2{grid-column:1/-1}
  .gd{grid-template-columns:30px 1fr 96px;row-gap:var(--s1)}
  .gd .k2{grid-column:2/-1}
  .wk{grid-template-columns:30px 1fr;row-gap:var(--s1)}
  .wk .k2,.wk-q{grid-column:2}
  .wk-q{text-align:left}
  .motor{grid-template-columns:1fr}
  .mo{text-align:left}
  .mo-ar{right:auto;left:50%;top:auto;bottom:calc(var(--s2) * -1);
    transform:translate(-50%,50%) rotate(90deg)}
  .fmt{grid-template-columns:1fr 84px 84px;row-gap:var(--s1)}
  .fmt-b,.fmt .k2{grid-column:1/-1}
  .rn{grid-template-columns:1fr 84px 80px;row-gap:var(--s1)}
  .rn .k2{grid-column:1/-1}
  .bg-m{grid-template-columns:1fr;gap:var(--s2)}
  .bg-r{grid-template-columns:64px 1fr 56px}
  .ins{grid-template-columns:1fr;gap:var(--s1)}
  .sal{grid-template-columns:1fr}
  .ins-x{grid-template-columns:1fr}
  .esl{grid-template-columns:1fr 96px;row-gap:var(--s1)}
  .esl-t{grid-column:1/-1}
  .pal,.pal-h{grid-template-columns:1fr 84px 92px;row-gap:var(--s1)}
  .pal .k2{grid-column:1/-1}
  .pal-h span:nth-child(n+4){display:none}
  .bnd{grid-template-columns:1fr 64px 100px;row-gap:var(--s1)}
  .bnd-t,.bnd .k2{grid-column:1/-1}
  .sb{grid-template-columns:1fr}
  .fc-top{grid-template-columns:1fr 100px;row-gap:var(--s2)}
  .fc-g{grid-template-columns:1fr}
  .lk{grid-template-columns:1fr 1fr}
  .tres{grid-template-columns:1fr}
  .pp{grid-template-columns:1fr 108px;row-gap:var(--s1)}
  .pp-c,.pp-p,.pp .k2{grid-column:1/-1}
  .cs-top{grid-template-columns:1fr;gap:var(--s3)}
  .ct-r,.ct-h{grid-template-columns:1fr;row-gap:var(--s1)}
  .rit{grid-template-columns:1fr}
  .pies{grid-template-columns:1fr;gap:var(--s5)}
  .sem{grid-template-columns:84px repeat(7,1fr);gap:2px}
  .sem-n{font-size:var(--t-xs)}
  .lv,.lv-h{grid-template-columns:1fr 70px 76px;row-gap:var(--s1)}
  .lv .k2,.lv-v:nth-of-type(n+3){grid-column:1/-1}
  .lv-h span:nth-child(n+4){display:none}
  .bk{grid-template-columns:1fr 1fr}
  .gr{grid-template-columns:1fr 56px;row-gap:var(--s1)}
  .res{grid-template-columns:1fr}
  .cta{grid-template-columns:1fr}
  .ba{grid-template-columns:26px 1fr;row-gap:var(--s1)}
  .ba .k2,.ba-cl,.gr-sk{grid-column:2}
  .cn-top2{flex-wrap:wrap;row-gap:var(--s3)}
  .cn-top2 .nm{flex:1 1 auto;min-width:0}

<script>
(function(){
  var D = JSON.parse(document.getElementById('pvt-data').textContent);
  var esc = function(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var money = function(n){ return n.toLocaleString('es-CL'); };
  /* los logos viven embebidos: el panel no depende de la red para pintarlos */
  var LG=(function(){ try{ return JSON.parse(document.getElementById('pvt-logos').textContent); }
    catch(e){ return {}; } })();
  var PZ=(function(){ try{ return JSON.parse(document.getElementById('pvt-piezas').textContent); }
    catch(e){ return {}; } })();
  var ALIAS={ig:'instagram', wsp:'whatsapp', yt:'youtube', li:'linkedin',
    ntn:'notion', gh:'github', ftm:'fathom'};
  function logo(k, cls){
    var id=ALIAS[k]||String(k||'').toLowerCase().replace(/[^a-z]/g,'');
    if(!LG[id]) return '';
    return '<img class="lgo '+(cls||'')+'" src="'+LG[id]+'" alt="'+esc(id)+'" loading="lazy">';
  }
  /* chip con logo cuando existe, con inicial cuando no */
  function chip(nombre){
    var l=logo(nombre);
    return '<span class="chp">'+(l||'<i class="chp-d"></i>')+esc(nombre)+'</span>';
  }
  var STATE = { live:'Corre', mid:'Flojo', brk:'Roto', blind:'A ciegas' };
  var LINE = ['gold','blue','teal'];

  var NB=0;
  /* cada bloque lleva número para poder nombrarlo, y se pliega desde la esquina */
  function card(t, inner){
    NB++; var n=(NB<10?'0':'')+NB;
    return '<details class="glass card" open><summary class="card-h">'
      + '<span class="card-nb">'+n+'</span>'
      + '<span class="card-t">'+(t?esc(t):'')+'</span>'
      + '<span class="card-cv">›</span></summary>'
      + '<div class="card-in">'+inner+'</div></details>'; }
  function tile(t){
    return '<div class="glass tile '+esc(t.s||'')+'"><div class="k">'+esc(t.k)+'</div>'
      + '<div class="n">'+esc(t.v)+(t.u?'<em>'+esc(t.u)+'</em>':'')+'</div>'
      + '<div class="f">'+esc(t.f)+'</div>'
      + (t.s?'<div class="st s-'+t.s+'">'+esc(STATE[t.s])+'</div>':'')+'</div>';
  }
  function tiles(a){ return '<div class="tiles">'+a.map(tile).join('')+'</div>'; }
  function meter(m,s){
    var h='<div class="meter'+(s==='live'?' live':s==='brk'?' brk':s==='blind'?' blind':'')+'">';
    for(var i=0;i<5;i++) h+='<i class="'+(i<m?'on':'')+'"></i>';
    return h+'</div>';
  }
  /* qué skills del OS operan esta pestaña */
  function skArea(id){
    var l=(D.skills_area||{})[id]; if(!l||!l.length) return '';
    return '<div class="sk-area"><b>Skills que operan esta vista</b>'
      + l.map(function(n){return '<span class="chip">'+esc(n)+'</span>'}).join('') + '</div>';
  }
  /* Barras verticales agrupadas con EJE COMPARTIDO.
     Escalar cada serie a su propio máximo hacía que 16 leads y 5 calls se
     vieran iguales: con eje común la caída del embudo se lee sola. */
  function barrasV(meses, series, opt){
    opt=opt||{};
    var W=760, H=opt.h||260, L=44, R=16, T=22, B=42;
    var iw=W-L-R, ih=H-T-B, N=meses.length, S=series.length;
    var max=0;
    meses.forEach(function(m){ series.forEach(function(se){
      max=Math.max(max, m[se.k]||0); }); });
    max=max||1;
    var esc_=Math.pow(10,Math.floor(Math.log10(max)));
    var tope=Math.ceil(max/esc_)*esc_;
    var gw=iw/N, bw=Math.min((gw-18)/S, 44);
    var y=function(v){ return T+ih-(v/tope)*ih; };
    var out='<svg viewBox="0 0 '+W+' '+H+'" class="bv" role="img" aria-label="'
      +esc(opt.alt||'Series por mes')+'">';
    [0,.5,1].forEach(function(f){
      var yy=(T+ih-f*ih).toFixed(1);
      out+='<line class="tg-grid" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/>'
        +'<text class="tg-axis" x="'+(L-9)+'" y="'+(+yy+4)+'" text-anchor="end">'
        +(opt.money?'$'+money(Math.round(tope*f)):Math.round(tope*f))+'</text>';
    });
    meses.forEach(function(m,mi){
      var gx=L+mi*gw, cx=gx+gw/2, tot=S*bw+(S-1)*4, x0=cx-tot/2;
      series.forEach(function(se,si){
        var v=m[se.k]||0, bx=x0+si*(bw+4), by=y(v), bh=T+ih-by;
        if(v>0){
          out+='<rect class="bv-b'+(m.parcial?' parcial':'')+'" x="'+bx.toFixed(1)+'" y="'
            +by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,2).toFixed(1)
            +'" rx="3" fill="var(--'+se.c+')"/>';
          out+='<text class="bv-v" x="'+(bx+bw/2).toFixed(1)+'" y="'+(by-7).toFixed(1)
            +'" text-anchor="middle" fill="var(--'+se.c+')">'
            +(opt.money?'$'+money(v):v)+'</text>';
        } else {
          out+='<line class="bv-z" x1="'+bx.toFixed(1)+'" y1="'+(T+ih)+'" x2="'
            +(bx+bw).toFixed(1)+'" y2="'+(T+ih)+'"/>';
          out+='<text class="bv-v zero" x="'+(bx+bw/2).toFixed(1)+'" y="'+(T+ih-7)
            +'" text-anchor="middle">0</text>';
        }
      });
      out+='<text class="bv-m" x="'+cx.toFixed(1)+'" y="'+(H-16)+'" text-anchor="middle">'
        +esc(m.m)+'</text>';
      if(m.parcial)
        out+='<text class="bv-sub" x="'+cx.toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">en curso</text>';
    });
    var key='<div class="bg-key">'+series.map(function(se){
      return '<span><i style="background:var(--'+se.c+')"></i>'+esc(se.n)+'</span>'; }).join('')+'</div>';
    return key+out+'</svg>';
  }
  function delta(v,l){
    if(v==null) return '';
    var c=v>0?'up':v<0?'dn':'eq', t=v>0?'▲ +'+v:v<0?'▼ '+v:'=';
    return '<span class="dt '+c+'" title="'+esc(l||'')+'">'+t+'</span>';
  }
  /* radar chico para cada cliente, mismos ejes para todos */
  function radarMini(vals, labels){
    var ejes=vals.map(function(v,i){return {l:labels[i], v:v};});
    var C=85,R=44,N=ejes.length;
    var pt=function(i,v){var a=-Math.PI/2+i*2*Math.PI/N;
      return [C+Math.cos(a)*R*v,C+Math.sin(a)*R*v];};
    var poly=function(f){return ejes.map(function(e,i){
      var p=pt(i,typeof f==='number'?f:e.v); return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');};
    var s='<svg class="mini" viewBox="-32 -4 234 178">';
    [0.5,1].forEach(function(g){ s+='<polygon class="g" points="'+poly(g)+'"/>'; });
    s+='<polygon class="v" points="'+poly()+'"/>';
    ejes.forEach(function(e,i){
      var lp=pt(i,1.34), a=-Math.PI/2+i*2*Math.PI/N, cx=Math.cos(a);
      var an=Math.abs(cx)<.3?'middle':(cx>0?'start':'end');
      s+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+2.5).toFixed(1)+'" text-anchor="'+an+'">'
        +esc(e.l.toUpperCase())+'</text>';
    });
    return s+'</svg>';
  }
  /* kicker + título + lectura: tres niveles, no un bloque de texto suelto */
  function vhead(t,em,read){
    return '<div class="vhead">'
      + '<div class="vkick"><i></i><span>'+esc(em)+'</span></div>'
      + '<h1 class="vtitle">'+esc(t)+'</h1>'
      + '<p class="vread">'+esc(read)+'</p></div>';
  }

  /* ── RADAR ── */
  function vRadar(){
    var r=D.radar, ejes=r.areas, W=430, C=W/2, R=W*.31, N=ejes.length, PX=64, PY=12;
    var pt=function(i,v){ var a=-Math.PI/2+i*2*Math.PI/N;
      return [C+Math.cos(a)*R*v, C+Math.sin(a)*R*v]; };
    var poly=function(vals){ return vals.map(function(v,i){
      var p=pt(i,v); return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' '); };
    var s='<svg class="radar-svg" viewBox="'+(-PX)+' '+(-PY)+' '+(W+PX*2)+' '+(W+PY*2)+'" '
      +'role="img" aria-label="Radar de areas: hoy contra objetivo">';
    [.25,.5,.75,1].forEach(function(v){
      s+='<polygon class="rx-grid" points="'+poly(ejes.map(function(){return v}))+'"/>'; });
    ejes.forEach(function(_,i){ var p=pt(i,1);
      s+='<line class="rx-spoke" x1="'+C+'" y1="'+C+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'; });
    s+='<polygon class="rx-target" points="'+poly(ejes.map(function(e){return e.t}))+'"/>';
    s+='<polygon class="rx-now" points="'+poly(ejes.map(function(e){return e.v}))+'"/>';
    ejes.forEach(function(e,i){
      var p=pt(i,e.v), brk=(e.t-e.v)>=.45;
      s+='<circle class="rx-dot'+(brk?' brk':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(brk?4:3)+'"/>';
      var lp=pt(i,1.30), a=-Math.PI/2+i*2*Math.PI/N, cx=Math.cos(a);
      var an=Math.abs(cx)<.25?'middle':(cx>0?'start':'end');
      s+='<text class="rx-lbl" x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="'+an+'">'+esc(e.n.toUpperCase())+'</text>'
        +'<text class="rx-val '+esc(e.e)+'" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+11).toFixed(1)+'" text-anchor="'+an+'">'
        +Math.round(e.v*100)+'<tspan class="rx-obj"> / '+Math.round(e.t*100)+'</tspan></text>';
    });
    s+='</svg>';
    var ar='';
    /* el sistema y el agente vienen del backend: una sola fuente por área */
    var BK={}; (D.backend.areas||[]).forEach(function(x){ BK[x.a]=x; });
    var gaps=(r.areas||[]).map(function(x){ return Math.round((x.t-x.v)*100); });
    var peor=gaps.indexOf(Math.max.apply(null,gaps));

    var cnt={live:0,mid:0,brk:0};
    (r.areas||[]).forEach(function(x){ cnt[x.e]=(cnt[x.e]||0)+1; });
    var tot=gaps.reduce(function(a,b){return a+b},0);
    ar+='<div class="arh">'
      +'<div class="g"><b>'+cnt.live+'<span style="font-size:var(--t-s);color:var(--low)"> / 8</span></b>'
      +'<span>En objetivo</span></div>'
      +'<div class="m"><b>'+cnt.mid+'<span style="font-size:var(--t-s);color:var(--low)"> / 8</span></b>'
      +'<span>Flojos</span></div>'
      +'<div class="b"><b>'+cnt.brk+'<span style="font-size:var(--t-s);color:var(--low)"> / 8</span></b>'
      +'<span>Rotos</span></div>'
      +'<div class="b"><b>'+tot+'<span style="font-size:var(--t-s);color:var(--low)"> pts</span></b>'
      +'<span>Brecha total</span></div></div>';

    (r.areas||[]).forEach(function(x,i){
      var b=BK[x.n]||{}, hoy=Math.round(x.v*100), obj=Math.round(x.t*100), g=gaps[i];
      var fh='';
      (x.falta||[]).forEach(function(f){
        fh+='<div class="fl '+esc(f.e)+'"><span class="fl-i"></span>'
          +'<div class="fl-q">'+esc(f.q)+'</div>'
          +'<div class="fl-d">'+esc(f.d)+'</div></div>';
      });
      ar+='<details class="arx '+esc(x.e)+'"><summary>'
        +'<div class="arx-i">'+esc(x.i)+'</div>'
        +'<div><div class="arx-n">'+esc(x.n)
          +(i===peor?'<span class="arx-fl">cuello</span>':'')+'</div>'
        +'<div class="arx-s">'+esc(b.sis||'—')+' · <i>'+esc(b.agente||'—')+'</i></div></div>'
        +'<div class="arx-mid"><div class="arx-et">'+esc(x.et)+'</div>'
        +'<div class="gap"><i style="width:'+hoy+'%"></i>'
          +'<u style="left:'+hoy+'%;width:'+Math.max(obj-hoy,0)+'%"></u>'
          +'<s style="left:calc('+obj+'% - 1px)"></s></div>'
        +'<div class="arx-nota">'+esc(x.nota)+'</div></div>'
        +'<div class="arx-sc"><b>'+hoy+'<span> / '+obj+'</span></b>'
        +'<span class="arx-gp">'+(g>0?'faltan '+g:'en objetivo')+'</span></div>'
        +'<div class="arx-cv">›</div></summary>'
        +'<div class="arx-body"><div class="arx-r">'+esc(x.r)
        +(x.ver?' <button class="ar-go" data-go="'+esc(x.ver)+'">ver en '+esc(x.ver)+'</button>':'')
        +'</div>'+fh+'</div></details>';
    });
    var nx=D.next, nh='';
    (nx.items||[]).forEach(function(x,i){
      nh+='<div class="ns"><div class="ns-n">'+(i+1)+'</div>'
        +'<div class="ns-t">'+esc(x.n)+'</div>'
        +'<div class="ns-a">'+esc(x.a)+'</div>'
        +'<div class="k2">'+esc(x.por)+'</div>'
        +'<div class="ns-q">'+esc(x.q)+'</div></div>';
    });
    nh+='<div class="concl"><b>Conclusión</b>'+esc(nx.concl)+'</div>';
    return vhead('Radar','desde dónde parto',r.lectura)
      + '<div class="stack">'
      + card('Fuerza por sistema — hoy contra objetivo',
             '<div class="radar-solo">'+s+'</div>'
             +'<div class="legend ctr"><span><i></i>Hoy</span><span><i class="t"></i>Objetivo</span></div>')
      + card('Los 8 sistemas — abre cada uno para ver qué falta',
             ar + '<div class="concl"><b>Conclusión</b>'+esc(r.areas_lectura||'')+'</div>')
      + card(esc(nx.t), nh)
      + '</div>' + skArea('radar');
  }

  /* ── TENDENCIA ── */
  function vTendencia(){
    var t=D.tendencia;
    /* conteos y dinero van en gráficos distintos: son unidades distintas */
    var gr = barrasV(t.barras, [
      {k:'leads',  n:'Leads',   c:'gold'},
      {k:'calls',  n:'Calls',   c:'blue'},
      {k:'cierres',n:'Cierres', c:'teal'}
    ], {alt:'Leads, calls y cierres por mes'});


    /* qué costó en tiempo */
    var tm=t.tiempo, tr='<div class="tm-h"><span>Proceso</span><span>Minutos</span>'
      +'<span>USD</span><span>USD/hora</span><span>Detalle</span></div>';
    tm.filas.forEach(function(f){
      tr+='<div class="tm"><div class="k1">'+esc(f.n)+'</div>'
        +'<div class="tm-v">'+(f.min?f.min:'—')+'</div>'
        +'<div class="tm-v">'+(f.usd?'$'+money(f.usd):'$0')+'</div>'
        +'<div class="tm-v '+esc(f.w)+'">'+(f.hr?'$'+money(f.hr):'—')+'</div>'
        +'<div class="k2">'+esc(f.d)+'</div></div>';
    });
    tr+='<div class="concl"><b>Conclusión</b>'+esc(tm.concl)+'</div>';

    /* diagnóstico por tramo */
    var dg=t.diag, dh='';
    dg.filas.forEach(function(f){
      var sv='<div class="sev">';
      for(var q=0;q<5;q++) sv+='<i class="'+(q<(f.sev||0)?'on':'')+'"></i>';
      sv+='</div>';
      dh+='<div class="dg '+(f.est==='live'?'live':'')+'">'
        +'<div class="dg-top"><div class="dg-tr">'+esc(f.tr)+'</div>'
        +'<div class="dg-cul">'+esc(f.cul)+'</div>'+sv+'</div>'
        +'<div class="dg-b"><div><b>La evidencia</b><p>'+esc(f.ev)+'</p></div>'
        +'<div><b>Qué significa</b><p>'+esc(f.acc)+'</p></div></div></div>';
    });
    dh+='<div class="concl"><b>Conclusión</b>'+esc(dg.concl)+'</div>';

    return vhead('Tendencia','qué produjo cada mes',t.lectura)
      + '<div class="tiles eight">'+t.kpis.map(tile).join('')+'</div>'

    var lt=b.ltv, lh='<div class="ltv-h"><span>Cliente</span><span>Meses</span>'

  /* ── FUNNEL DE RATIOS ── */
  /* embudo real: el ancho de cada tramo es su volumen, y el trapecio
     entre tramos hace visible dónde se cae la gente */
  function funnelHTML(etapas){
    var e=etapas, N=e.length;
    var base=Math.max.apply(null,e.map(function(x){return x.v||0}))||1;
    var W=560, PAD=8, H_T=52, H_G=22, H=N*H_T+(N-1)*H_G+PAD*2;
    var an=function(v){ return Math.max(v/base,.055)*(W-PAD*2); };
    var COL={live:'var(--good)',mid:'var(--warn)',brk:'var(--danger)'};

    var ratios=e.map(function(x,i){
      return i===0?null:Math.round(x.v/e[i-1].v*100); });
    var worst=null;
    ratios.forEach(function(r,i){ if(r!=null&&(worst===null||r<ratios[worst])) worst=i; });

    var s2='<svg class="fnl" viewBox="0 0 '+W+' '+H+'" role="img" '
      +'aria-label="Embudo comercial de lead a cierre" preserveAspectRatio="xMidYMid meet">';
    e.forEach(function(x,i){
      var w=an(x.v), x0=(W-w)/2, y=PAD+i*(H_T+H_G), c=COL[x.e]||'var(--mid)';
      /* el cuerpo del tramo */
      s2+='<rect x="'+x0.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+H_T+'" '
        +'rx="5" fill="'+c+'" fill-opacity=".17" stroke="'+c+'" stroke-opacity=".55"/>';
      s2+='<text class="fnl-v" x="'+(W/2)+'" y="'+(y+23)+'" text-anchor="middle" fill="'+c+'">'
        +x.v+'</text>';
      s2+='<text class="fnl-n" x="'+(W/2)+'" y="'+(y+39)+'" text-anchor="middle">'
        +esc(x.n.toUpperCase())+'</text>';
      /* el trapecio de caída hacia el siguiente */
      if(i<N-1){
        var w2=an(e[i+1].v), x2=(W-w2)/2, y2=y+H_T, peor=(i+1===worst);
        s2+='<path d="M'+x0.toFixed(1)+' '+y2+' L'+(x0+w).toFixed(1)+' '+y2
          +' L'+(x2+w2).toFixed(1)+' '+(y2+H_G)+' L'+x2.toFixed(1)+' '+(y2+H_G)+' Z" '
          +'fill="'+(peor?'var(--danger)':'var(--border-hi)')+'" fill-opacity="'
          +(peor?'.20':'.12')+'"/>';
        s2+='<text class="fnl-r'+(peor?' worst':'')+'" x="'+(W-PAD)+'" y="'+(y2+15)+'" '
          +'text-anchor="end">'+ratios[i+1]+'%</text>';
        if(peor) s2+='<text class="fnl-w" x="'+PAD+'" y="'+(y2+15)+'">EL CUELLO</text>';
      }
    });
    s2+='</svg>';
    var perd=e[0].v-e[e.length-1].v;
    return '<div class="fnl-w2">'+s2+'</div>'
      +'<div class="fnl-x"><div><b>'+Math.round(e[e.length-1].v/e[0].v*100)+'%</b>'
      +'<span>Conversión total</span></div>'
      +'<div><b>'+perd+'</b><span>Leads perdidos en el camino</span></div>'
      +'<div class="no"><b>'+ratios[worst]+'%</b><span>El peor tramo: '
      +esc(e[worst-1].n)+' → '+esc(e[worst].n)+'</span></div></div>';
  }



  /* ── CONTENIDO · motor, formatos e ikigai ── */
  function vContenido(){
    var c=D.contenido, W=560, H=430, R=96;

    var col=['var(--blue)','var(--gold)','var(--teal)'];

      +'aria-label="Interseccion entre quien eres, que construyes y que paga el mercado">';
    for(var i=0;i<3;i++)
      s+='<circle class="ik-c" cx="'+cx[i]+'" cy="'+cy[i]+'" r="'+R+'" fill="'+col[i]
        +'" stroke="'+col[i]+'"/>';
    /* los pares se rotulan fuera del apilamiento, con línea guía */

    var mx=W/2, my=(cy[0]+cy[1]+cy[2])/3;
    s+='<circle cx="'+mx+'" cy="'+my+'" r="40" fill="var(--bg)" opacity=".82"/>'
      +'<circle cx="'+mx+'" cy="'+my+'" r="40" fill="rgba(216,168,71,.22)" '
      +'stroke="var(--gold)" stroke-width="1.5"/>'
      +'<text class="ik-core" x="'+mx+'" y="'+(my-2)+'" text-anchor="middle">YO SOY</text>'
      +'<text class="ik-core" x="'+mx+'" y="'+(my+14)+'" text-anchor="middle">MI AVATAR</text></svg>';
    var side='<div class="ik-side"><div class="core"><b>'+esc(c.centro.n)+'</b><p>'
      +esc(c.centro.d)+'</p></div>'
      + c.pares.map(function(x){
          return '<div class="ik-p"><b>'+esc(x.n)+'</b><span>'+esc(x.d)+'</span></div>'; }).join('')
      + '</div>';

    /* la cadena como diagrama: fuente → gema → el carril se abre en dos
       cuentas → vuelven a juntarse en producción y terminan en el cierre */
    var cd=c.cadena, CR={};
    (cd.carriles||[]).forEach(function(x){ CR[x.k]=x; });
    var mh='<div class="note" style="margin:0 0 var(--s4)">'+esc(cd.lead)+'</div>';

    var nodo=function(x,cls){
      return '<div class="dg-n '+esc(x.e)+' '+(cls||'')+'" data-go-et="'+esc(x.i)+'">'
        +'<span class="dg-i">'+esc(x.i)+'</span>'
        +'<b>'+esc(x.n)+'</b><em>'+esc(x.k)+'</em>'
        +'<u>'+esc(x.quien)+'</u></div>';
    };
    var ix={}; cd.etapas.forEach(function(x){ ix[x.i]=x; });

    mh+='<div class="dg">';
    /* tramo 1 — la fuente y la gema, una sola vía */
    mh+='<div class="dg-fila"><div class="dg-lbl">Entra</div><div class="dg-row">'
      + nodo(ix['01']) + '<i class="dg-fl"></i>' + nodo(ix['02']) + '<i class="dg-fl"></i>'
      + nodo(ix['03'],'dg-fork') + '</div></div>';

    /* tramo 2 — el carril se parte: una columna por cuenta */
    mh+='<div class="dg-fila split"><div class="dg-lbl">Se parte</div><div class="dg-lanes">';
    (cd.carriles||[]).forEach(function(cl){
      mh+='<div class="dg-lane" style="--c:'+esc(cl.c)+'">'
        +'<div class="dg-lh"><b>'+esc(cl.n)+'</b><span>'+esc(cl.h)+'</span>'
        +'<em>'+esc(cl.voz)+'</em></div>'
        +'<div class="dg-lr">'+esc(cl.rol)+'</div>'
        +'<div class="dg-hk">'+cl.hooks.map(function(h){
            return '<div class="hk"><div class="hk-t">'+esc(h.h)+'</div>'
              +'<div class="hk-g">'+esc(h.g)+'</div></div>'; }).join('')+'</div>'
        +'<div class="dg-pz">'+(cl.piezas||[]).map(function(k){
            return PZ[k]?'<img src="'+PZ[k]+'" alt="'+esc(k)+'" loading="lazy">':''; }).join('')
        +'</div></div>';
    });
    mh+='</div></div>';

    /* tramo 3 — vuelven a juntarse y terminan en el cierre */
    mh+='<div class="dg-fila"><div class="dg-lbl">Se junta</div><div class="dg-row">'
      + ['06','07','08'].map(function(k){ return nodo(ix[k]); }).join('<i class="dg-fl"></i>')
      + '</div></div>';

      + ['09','10','11'].map(function(k){ return nodo(ix[k],'dg-cl'); }).join('<i class="dg-fl"></i>')
      + '</div></div>';
    mh+='</div>';
    mh+='<div class="loop">↻ &nbsp;<b>El ciclo se cierra:</b> '+esc(cd.loop)+'</div>';

  /* ── DAILY · el ritmo ── */
  function vDaily(){
    var D_=D.daily, rt='<div class="rit">';
    D_.ritmos.forEach(function(r){
      rt+='<div class="rit-c '+esc(r.e)+'"><div class="rit-h"><b>'+esc(r.c)+'</b>'
        +'<span>'+r.n+'</span></div>'
        +'<div class="note" style="margin:0 0 var(--s3)">'+esc(r.why||'')+'</div>';
      r.items.forEach(function(i){
        rt+='<div class="rit-i '+esc(i.k||'')+'"><div class="q">'+i.w+'</div>'
          +'<div class="t">'+esc(i.n)
          +'<div class="k3" style="font-weight:400;margin-top:2px">'+esc(i.why||'')+'</div></div>'
          +'<div class="a">'+esc(i.a)+'</div></div>';
      });
      rt+='</div>';
    });
    rt+='</div>';

    /* calendario del mes: se genera desde los días declarados, no a mano */
    var cl=D_.cal;
    var hoy=new Date(D.meta.iso||Date.parse('2026-08-31'));
    if(isNaN(hoy)) hoy=new Date();
    var Y=hoy.getFullYear(), M=hoy.getMonth(), DHOY=hoy.getDate();
    var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
      'septiembre','octubre','noviembre','diciembre'][M];
    var ndias=new Date(Y,M+1,0).getDate();
    var off=(new Date(Y,M,1).getDay()+6)%7;   /* la semana parte el lunes */

    var COLA={}; (D_.areas||[]).forEach(function(a){ COLA[a.k]=a; });
    var leg='<div class="alg">'+(D_.areas||[]).map(function(a){
      return '<span><i style="background:'+esc(a.c)+'"></i>'+esc(a.n)+'</span>'; }).join('')+'</div>';

    var sm='<div class="note" style="margin:0 0 var(--s4)">'+esc(cl.lead)+'</div>'+leg;
    sm+='<div class="cal-t">'+MES+' '+Y+'</div>';
    sm+='<div class="cal">'
      + ['lun','mar','mié','jue','vie','sáb','dom'].map(function(x){
          return '<div class="cal-h">'+x+'</div>'; }).join('');
    for(var i=0;i<off;i++) sm+='<div class="cal-d off"></div>';
    for(var dd=1;dd<=ndias;dd++){
      var wd=(new Date(Y,M,dd).getDay()+6)%7;
      var hoyes=(dd===DHOY);
      var bl=cl.bloques.filter(function(b){ return b.dias.indexOf(wd)>=0; });
      var mins=bl.reduce(function(a,b){ return a+b.min; },0);
      var fin=(wd>=5);
      sm+='<div class="cal-d'+(hoyes?' hoy':'')+(fin?' fin':'')+'">'
        +'<div class="cal-n">'+dd+(hoyes?'<b>hoy</b>':'')
        +'<u>'+(mins>=60?(mins/60).toFixed(1).replace('.0','')+' h':mins+' m')+'</u></div>'
        + bl.map(function(b){
            var c=(COLA[b.k]||{}).c||'var(--mid)';
            return '<div class="cal-b" style="--c:'+esc(c)+'">'
              +'<i></i>'+esc(b.n)+'</div>'; }).join('')
        +'</div>';
    }
    sm+='</div><div class="concl"><b>Conclusión</b>'+esc(cl.concl)+'</div>';

    var br=D_.cumpl, bh='';

      + card(esc(br.t), '<div class="note" style="margin:0 0 var(--s4)">'+esc(br.estado)+'</div>'+bh)
      + '</div>' + skArea('daily');
  }

  /* torta en SVG, sin librerías */
  function torta(datos, titulo){
    var tot=datos.reduce(function(a,b){return a+b.v},0)||1, ang=-Math.PI/2, R=52, C=60;
    var s='<svg class="pie-svg" viewBox="0 0 120 120" role="img" aria-label="'+esc(titulo)+'">';
    datos.forEach(function(d){
      if(!d.v) return;
      var a2=ang+(d.v/tot)*2*Math.PI;
      var x1=C+Math.cos(ang)*R, y1=C+Math.sin(ang)*R;
      var x2=C+Math.cos(a2)*R,  y2=C+Math.sin(a2)*R;
      var big=(a2-ang)>Math.PI?1:0;
      if(d.v===tot)
        s+='<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="'+esc(d.c)+'" opacity=".85"/>';
      else
        s+='<path d="M'+C+' '+C+' L'+x1.toFixed(1)+' '+y1.toFixed(1)
          +' A'+R+' '+R+' 0 '+big+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" fill="'
          +esc(d.c)+'" opacity=".85" stroke="var(--bg)" stroke-width="1.5"/>';
      ang=a2;
    });
    s+='<circle cx="'+C+'" cy="'+C+'" r="26" fill="var(--surface)"/>'
      +'<text x="'+C+'" y="'+(C+5)+'" text-anchor="middle" class="bv-m" '
      +'style="font-size:15px">'+tot+'</text></svg>';
    var leg='<div class="pie-l">'+datos.map(function(d){
      return '<div><i style="background:'+esc(d.c)+'"></i>'+esc(d.n)
        +'<b>'+d.v+'</b></div>'; }).join('')+'</div>';
    return '<div class="pie-w"><div class="pie-t">'+esc(titulo)+'</div>'+s+leg+'</div>';
  }

  /* ── BACKEND ── */
  function vBackend(){
    var B=D.backend;

    /* el árbol: sistema → agente → skill → acción.
       Del dato solo salen hechos; leverage y veredicto se derivan acá. */
    var BK={}; (B.areas||[]).forEach(function(x){ BK[x.a]=x; });
    var T=B.tiempo, AH=0, CO=0, HU=0, NA=0, SM=0, ACC=0, AUTO=0, SINM=0;
    var hrs=function(m){ return m>=60 ? (m/60).toFixed(1).replace('.0','')+' h' : m+' min'; };
    var ver=function(a){
      var u=a.manual-a.min, am=u*a.frec;
      if(a.frec===0) return {v:'humo', am:0, cm:0, u:u};
      if(u<=0)       return {v:'cuesta', am:am, cm:a.min*a.frec, u:u};
      if(am<30)      return {v:'marginal', am:am, cm:a.min*a.frec, u:u};
      return {v:'ahorra', am:am, cm:a.min*a.frec, u:u};
    };
    var lev=function(am){ return am>=180?'alto':am>=60?'medio':am>0?'bajo':'nulo'; };

    T.arbol.forEach(function(x){
      x._ah=0; x._acc=0; x._humo=0;
      x.skills.forEach(function(k){
        k._ah=0;
        k.acciones.forEach(function(a){
          var r=ver(a); a._=r; a._lev=lev(r.am);
          k._ah+=r.am; x._ah+=r.am; x._acc++; ACC++;
          AH+=r.am; CO+=r.cm;
          if(r.v==='humo'){ HU++; x._humo++; }
          if(a.auto==='auto') AUTO++;
          if(a.met==='—') SINM++;
        });
      });
      SM+=x.skills.length;
      if(x.agente==='auto') NA++;
    });

    var th='<div class="note" style="margin:0 0 var(--s4)">'+esc(T.lead)+'</div>';
    th+='<div class="via"><span>Sistema</span><i></i><span>Agente</span><i></i>'
      +'<span>Skill</span><i></i><span>Acción</span>'
      +'<b>tiempo · leverage · métrica · qué falta</b></div>';
    th+='<div class="tsum">'
      +'<div class="ok"><b>'+hrs(AH).replace(' h','<span> h</span>')+'</b>'
      +'<span>Ahorro al mes</span></div>'
      +'<div><b>'+hrs(CO).replace(' h','<span> h</span>')+'</b>'
      +'<span>Lo que cuesta correrlo</span></div>'
      +'<div class="ok"><b>'+(Math.round(AH/(CO||1)*10)/10)+'<span>×</span></b>'
      +'<span>Retorno por hora</span></div>'
      +'<div><b>'+AUTO+'<span> / '+ACC+'</span></b><span>Acciones automáticas</span></div>'
      +'<div class="no"><b>'+HU+'<span> / '+ACC+'</span></b><span>Acciones en humo</span></div>'
      +'<div class="no"><b>'+SINM+'<span> / '+ACC+'</span></b><span>Sin métrica</span></div>'
      +'</div>';

    var maxS=Math.max.apply(null,T.arbol.map(function(x){return x._ah}))||1;
    T.arbol.forEach(function(x,i){
      var ag={auto:'Corre solo',semi:'Asistido',mano:'A pulso'}[x.agente]||x.agente;
      th+='<details class="sy '+esc(x.agente)+'"><summary>'
        +'<span class="sy-i">'+(i<9?'0':'')+(i+1)+'</span>'
        +'<span class="sy-n">'+esc(x.a)+'<em>'+esc(x.sis)+'</em></span>'
        +'<span class="sy-ag '+esc(x.agente)+'">'+esc(ag)+'</span>'
        +'<span class="sy-c">'+x.skills.length+'<i>skills</i></span>'
        +'<span class="sy-c">'+x._acc+'<i>acciones</i></span>'
        +'<span class="sy-b"><i style="width:'+Math.round(x._ah/maxS*100)+'%"></i></span>'
        +'<span class="sy-ah'+(x._ah?'':' nil')+'">'+(x._ah?hrs(x._ah):'nada')+'</span>'
        +'<span class="sy-u '+esc(x.urg)+'">'+esc(x.urg)+'</span>'
        +'<span class="sy-cv">›</span></summary><div class="sy-b2">';

      var fa=BK[x.a]||{};
      var mk=function(l,v){ var c=(v==='Listo'||v==='Auto'||v==='Escrito')?'ok'
        :(v==='Parcial'||v==='Semi')?'mid':'no';
        return '<span><i>'+l+'</i><b class="'+c+'">'+esc(v||'—')+'</b></span>'; };
      th+='<div class="sy-fa">'
        + mk('SOP escrito', fa.sop) + mk('Transferible a cliente', fa.transf)
        + '<span class="con"><i>Corre con</i><div>'
        + (fa.con||[]).map(chip).join('')+'</div></span></div>';

      x.skills.forEach(function(k){
        th+='<details class="sk2"><summary>'
          +'<span class="sk2-n">'+esc(k.id)+'</span>'
          +'<span class="sk2-r">'+esc(k.rol)+'</span>'
          +'<span class="sk2-c">'+k.acciones.length+'<i>acc</i></span>'
          +'<span class="sk2-ah'+(k._ah?'':' nil')+'">'+(k._ah?hrs(k._ah):'—')+'</span>'
          +'<span class="sk2-cv">›</span></summary><div class="ac-w">';
        k.acciones.forEach(function(a){
          th+='<div class="ac '+esc(a._.v)+'">'
            +'<div class="ac-n">'+esc(a.n)+'</div>'
            +'<div class="ac-t"><b>'+a.min+'</b><span>min</span>'
              +'<u>'+(a.frec?'× '+a.frec+' al mes':'nunca')+'</u></div>'
            +'<div class="ac-t dim"><b>'+a.manual+'</b><span>min a mano</span></div>'
            +'<div class="ac-l lv-'+esc(a._lev)+'">'+esc(a._lev)
              +'<u>'+(a._.v==='humo'?'humo':hrs(a._.am))+'</u></div>'
            +'<div class="ac-im '+esc(a.imp)+'">'+esc(a.imp)+'</div>'
            +'<div class="ac-au '+esc(a.auto)+'">'
              +({auto:'automático',semi:'asistido',mano:'a mano'}[a.auto]||a.auto)+'</div>'
            +'<div class="ac-m'+(a.met==='—'?' nil':'')+'">'
              +(a.met==='—'?'sin métrica':esc(a.met))+'</div>'
            +'<div class="ac-f"><b>Para automatizar</b>'+esc(a.falta)+'</div>'
            +'</div>';
        });
        th+='</div></details>';
      });
      th+='</div></details>';
    });

    th+='<div class="note">'+esc(T.aviso)+'</div>'
      +'<div class="concl"><b>Conclusión</b>'+esc(T.concl)+'</div>'
      +'<div class="tm-src">Fuente: '+esc(T.fuente)+'</div>';

    return vhead('Backend','área, sistema y tiempo',B.lectura)
      + tiles(B.stats)
      + '<div class="stack">'
      + card(esc(B.tiempo.t), th)
      + card('El arsenal completo','<div class="lk"><a class="lk-c" href="https://pvt-build.github.io/arsenal/" '
          +'target="_blank" rel="noopener"><div class="lk-n">El arsenal ↗</div>'
          +'<div class="lk-d">Para explicar el sistema, no para copiarlo</div></a></div>')
      + '</div>' + skArea('backend');
  }

  /* ── CONSULTORÍA ── */
  function vConsultoria(){
    var C=D.consultoria, fi='<div class="cfg">';
    (C.fichas||[]).forEach(function(x){
      var pc=Math.round(x.ses/x.tot*100);
      fi+='<div class="cf '+esc(x.e)+'">'
        +'<div class="cf-hd"><span class="dot '+esc(x.e)+'"></span>'
        +'<div><div class="cf-n">'+esc(x.n)+'</div>'
        +'<div class="cf-meta">'+esc(x.nicho)+'</div></div></div>'

        +'<div class="cf-pg"><div class="cf-ses">'+x.ses
        +'<span> / '+x.tot+' sesiones</span></div>'
        +'<div class="cf-est">'+esc(x.est)+'</div>'
        +'<div class="cf-bar"><i style="width:'+pc+'%"></i></div>'
        +'<div class="cf-rit">'+esc(x.dia)+' · '+esc(x.ritmo)+'</div></div>'

        + radarMini(x.radar, C.ejes)
        +'<div class="cf-rl">sus 8 sistemas · qué tan armado está cada uno</div>'

        +'<div class="cf-key"><b>Dónde apretar ahora</b><p>'+esc(x.apretar)+'</p></div>'
        + (x.bloqueo?'<div class="cf-bl"><b>Bloqueo</b>'+esc(x.bloqueo)+'</div>':'')

        +'<details class="cf-mas"><summary>El detalle de este cliente<span>›</span></summary>'
        +'<div class="cf-f"><b>Crecimiento acumulado</b><p>'+esc(x.crec)+'</p></div>'
        +'<div class="cf-f"><b>Qué logró</b><p>'+esc(x.logro)+'</p></div>'
        +'<div class="cf-f"><b>Qué mejorar de mi lado</b><p>'+esc(x.mejorar)+'</p></div>'
        +'</details>'
        +'<a class="cf-go" href="'+esc(x.url)+'" target="_blank" rel="noopener">Ver su panel ↗</a>'
        +'</div>';
    });
    fi+='</div>';

    var cu=C.cuello, ch='';
    cu.filas.forEach(function(f){
      ch+='<div class="rw rw-sy"><span class="dot '+esc(f.e)+'"></span>'
        +'<div class="k1">'+esc(f.n)+'</div><div class="k3">'+esc(f.c)+'</div>'
        +'<div class="k2">'+esc(f.d)+'</div></div>';
    });
    var rp='<div class="card-t" style="margin-top:var(--s5)">Lo que se repite en los tres</div>';
    cu.repite.forEach(function(f){
      rp+='<div class="og"><div><div class="k1">'+esc(f.n)+'</div>'
        +'<div class="og-bar"><i class="'+(f.v>=3?'brk':'')+'" style="width:'
        +Math.round(f.v/3*100)+'%"></i></div></div>'
        +'<div class="og-v '+(f.v>=3?'brk':'')+'">'+f.v+'/3</div>'
        +'<div class="k2">'+esc(f.d)+'</div></div>';
    });
    var pr='<div class="card-t" style="margin-top:var(--s5)">Pendientes míos, no del cliente</div>';
    cu.propios.forEach(function(f,i){
      pr+='<div class="gp '+esc(f.e)+'"><div class="gp-p">'+(i+1)+'</div>'
        +'<div class="k1">'+esc(f.n)+'</div><div class="k2"></div><div class="gp-d"></div></div>';
    });
    ch+=rp+pr+'<div class="concl"><b>Conclusión</b>'+esc(cu.concl)+'</div>';

    var t=C.tesis;
    return vhead('Consultoría','entrega y producto',C.lectura)
      + tiles(C.stats)
      + '<div class="stack">'
      + card('Los tres — sus 8 sistemas, dónde apretar y qué mejorar', fi)
      + card(esc(cu.t), ch)
      + card('La tesis de la entrega','<div class="tesis"><b>'+esc(t.t)+'</b><p>'+esc(t.d)+'</p>'
          +'<div class="cs2">'+esc(t.d2)+'</div>'
          +'<div class="cns">'+esc(t.conse)+'</div></div>')
      + '</div>' + skArea('consultoria');
  }

  /* ── PUNTO CERO — dónde estoy, cómo vengo, a dónde puedo llegar ── */
  /* resumen de cada pestaña, para leer el negocio sin entrar a ninguna */
  function resumenGlobal(){
    var R=[
     {v:'daily',n:'Daily',k:[
       {l:'Acciones diarias',v:'6',e:'live'},{l:'Domingo construye',v:'6 bloques',e:'mid'},
       {l:'Cumplimiento',v:'sin registro',e:'blind'}]},
     {v:'contenido',n:'Contenido',k:[
       {l:'Piezas del mes',v:'5 / 90',e:'brk'},{l:'Formatos activos',v:'1 / 5',e:'brk'},
       {l:'Carrusel',v:'10 min',e:'live'}]},
     {v:'canales',n:'Canales',k:[
       {l:'Leads',v:'27',e:'mid'},{l:'Clientes',v:'11',e:'live'},
       {l:'Canales activos',v:'1 / 4',e:'brk'}]},
     {v:'comercial',n:'Comercial',k:[
       {l:'MRR vigente',v:'$1.300',e:'mid'},{l:'En pipeline',v:'12',e:'mid'},
       {l:'Cierre en propuesta',v:'100%',e:'live'}]},
     {v:'consultoria',n:'Consultoría',k:[
       {l:'En programa',v:'3',e:'live'},{l:'Con resultado',v:'1 / 3',e:'brk'},
       {l:'Día fijo de call',v:'1 / 3',e:'brk'}]},
     {v:'backend',n:'Backend',k:[
       {l:'Sistemas activos',v:'2 / 8',e:'brk'},{l:'A medias',v:'3 / 8',e:'mid'},
       {l:'Replicables',v:'6 / 8',e:'live'}]}
    ];
    return '<div class="res">'+R.map(function(r){
      return '<div class="res-c" data-go="'+r.v+'">'
        +'<div class="res-t"><b>'+esc(r.n)+'</b><span class="go">ver ›</span></div>'
        + r.k.map(function(x){
            return '<div class="res-k"><span>'+esc(x.l)+'</span>'
              +'<b class="'+x.e+'">'+esc(x.v)+'</b></div>'; }).join('')
        +'</div>'; }).join('')+'</div>';
  }

  function vOS(){
    return '<div class="oz">'
      + '<div class="oz-s"><span>00</span>El negocio de un vistazo</div>'
      + card('El negocio en una pantalla', resumenGlobal())
      + '<div class="oz-s"><span>01</span>Dónde estoy</div>' + vRadar()
      + '<div class="oz-s"><span>02</span>Cómo vengo</div>'  + vTendencia()
      + '<div class="oz-s"><span>03</span>A dónde puedo llegar</div>' + vProyecciones()
      + '</div>';
  }

  /* ── PROYECCIONES ── */
  function vProyecciones(){
    var P=D.proyecciones;
    var max=Math.max.apply(null,P.escalones.map(function(e){return e.rev}))||1, el='';
    P.escalones.forEach(function(e){
      el+='<div class="esl"><div class="esl-n">'+esc(e.n)
        +'<span>'+e.calls+' calls · '+e.cp+'% · $'+money(e.tk)+'</span></div>'
        +'<div class="esl-t '+esc(e.e)+'"><i style="width:'+Math.round(e.rev/max*100)+'%"></i></div>'
        +'<div class="esl-r">$'+money(e.rev)+'</div>'
        +'<div class="esl-d">'+(e.delta?'+$'+money(e.delta)+'<span>suma</span>':'<span>base</span>')+'</div></div>';
    });
    var ph='<div class="pal-h"><span>Palanca</span><span>Tipo</span><span>Esfuerzo</span>'
      +'<span>Impacto/mes</span><span>Qué es</span></div>';
    P.palancas.forEach(function(x){
      ph+='<div class="pal"><div class="k1">'+esc(x.n)+'</div>'
        +'<div class="pal-b">'+esc(x.t)+'</div>'
        +'<div class="pal-b">'+esc(x.esf)+'</div>'
        +'<div class="pal-i'+(x.imp?'':' zero')+'">'+(x.imp?'+$'+money(x.imp):'—')+'</div>'
        +'<div class="k2">'+esc(x.d)+'</div></div>';
    });
    return vhead('Proyecciones','qué pasa si mueves palancas',P.lectura)
      + tiles(P.stats)
      + '<div class="stack">'
      + card('Los escalones, acumulados de arriba hacia abajo',
             el + '<div class="note">'+esc(P.nota)+'</div>')
      + card('Cada palanca por separado', ph
             + '<div class="note">El modelo es uno solo: '+esc(P.modelo)+'.</div>')
      + '</div>' + skArea('proyecciones');
  }

  /* El punto cero: dónde estoy, cómo vengo y a dónde puedo llegar.
     Las demás pestañas siguen el orden del embudo. */
  var VIEWS=[
    {id:'os',          l:'Dashboard',   cero:true,  r:vOS},
    {id:'daily',       l:'Daily',       cero:false, r:vDaily},
    {id:'contenido',   l:'Contenido',   r:vContenido},
    {id:'canales',     l:'Canales',     r:vCanales},
    {id:'comercial',   l:'Comercial',   r:vComercial},
    {id:'consultoria', l:'Consultoría', r:vConsultoria},
    {id:'backend',     l:'Backend',     r:vBackend}
  ];

  document.getElementById('navdate').textContent = D.meta.fecha;
  var nv=document.getElementById('navver');
  if(nv) nv.textContent = 'v' + (D.meta.build || D.meta.fecha);
  document.getElementById('footL').textContent = D.meta.os+' — '+D.meta.operador;
  document.getElementById('fresh').innerHTML = D.meta.frescura.map(function(f){
    var cls=f.al===null?'none':(f.lag>5?'lag':'');
    var txt=f.al===null?'sin dato':(f.lag===0?'al día':f.lag+'d');
    return '<span><i class="'+cls+'"></i>'+esc(f.n)+' — '+txt+'</span>'; }).join('');

  var stage=document.getElementById('stage'), tabs=document.getElementById('tabs');
  stage.innerHTML=VIEWS.map(function(v){
    NB=0; return '<section class="view" id="v-'+v.id+'">'+v.r()+'</section>'; }).join('');
  tabs.innerHTML = '<span class="slider" id="slider"></span>' + VIEWS.map(function(v,i){
    return (v.cero===false && VIEWS[i-1] && VIEWS[i-1].cero ? '<span class="sep"></span>' : '')
      + '<button class="'+(v.cero?'cero':'')+'" data-i="'+i+'">'+esc(v.l)+'</button>';
  }).join('');

  var cur=0, views=stage.querySelectorAll('.view'), btns=tabs.querySelectorAll('button');
  var slider=tabs.querySelector('#slider');
  function moverSlider(){
    var b=btns[cur]; if(!b) return;
    slider.style.left=b.offsetLeft+'px';
    slider.style.width=b.offsetWidth+'px';
  }
  window.addEventListener('resize',moverSlider);
  function go(i){
    cur=(i+VIEWS.length)%VIEWS.length;
    for(var k=0;k<views.length;k++){
      views[k].classList.toggle('on',k===cur);
      btns[k].classList.toggle('on',k===cur);
    }
    moverSlider();
    if(btns[cur].scrollIntoView) btns[cur].scrollIntoView({block:'nearest',inline:'center'});
    window.scrollTo({top:0,behavior:'smooth'});
  }
  for(var k=0;k<btns.length;k++)
    btns[k].addEventListener('click',function(e){
      go(parseInt(e.currentTarget.getAttribute('data-i'),10)); });
  stage.addEventListener('click',function(e){
    var b=e.target.closest('.ar-go,.res-c'); if(!b) return;
    if(b.tagName==='A') return;
    e.preventDefault(); e.stopPropagation();
    var i=VIEWS.findIndex(function(v){return v.id===b.getAttribute('data-go')});
    if(i>=0) go(i);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){ e.preventDefault(); go(cur+1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); go(cur-1); }
    if(e.key>='1'&&e.key<='7') go(parseInt(e.key,10)-1);
  });
  go(0);
})();
</script>
