<style>
:root{
  /* paleta heredada de Athlete OS — mismo OS, mismo lenguaje */
  --bg:#0D0F13;
  --surface:#171A20; --surface2:#1D2128; --surface3:#252A33;
  --border:#2A2F39; --border-hi:#3C424E;
  --gold:#D8A847; --gold-dim:#8C7438; --gold-glow:rgba(216,168,71,.12);
  --hi:#F4F1E8; --mid:#B4B8BF; --low:#767B84;
  --good:#4ADE80; --danger:#E5484D; --warn:#E8B339;
  --blue:#5B9BD5; --teal:#4EC3A8; --purple:#A78BFA; --pink:#E879A6;
  /* un color por área del negocio: el mismo en toda la app */
  --a-mkt:#5B9BD5; --a-cml:#4ADE80; --a-cmn:#4EC3A8; --a-ent:#D8A847;
  --a-prd:#A78BFA; --a-bkd:#8B93A1; --a-fnd:#E8B339; --a-idd:#E879A6;

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  /* ESCALA TIPOGRÁFICA — rangos fijos, nada fuera de esta lista */
  --t-micro:10px;  /* labels de campo, códigos */
  --t-xs:11.5px;   /* metadata secundaria */
  --t-s:12.5px;    /* descripciones de fila */
  --t-m:13.5px;    /* nombres, cuerpo compacto */
  --t-l:15px;      /* lectura */
  --t-xl:17px;     /* subtítulo de bloque */
  --n-s:24px; --n-m:32px;   /* números */

  /* ESPACIADO — múltiplos de 4, nada suelto */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;

  --r-s:10px; --r-m:14px; --r-l:20px; --r-pill:999px;
  --gut:clamp(20px,4vw,56px);
  --maxw:1280px;
  --navh:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--hi);font-family:var(--sans);
  font-variant-numeric:tabular-nums;min-height:100vh;position:relative;
  font-size:var(--t-m);line-height:1.5}

/* ── ATMÓSFERA ── */
.atm{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.atm i{position:absolute;display:block;border-radius:50%;will-change:transform}
.p1{width:70vw;height:60vh;right:-18vw;top:-20vh;background:rgba(91,155,213,.07);
  filter:blur(70px);animation:d1 48s ease-in-out infinite alternate}
.p2{width:30vw;height:26vh;left:-8vw;bottom:-10vh;background:rgba(216,168,71,.12);
  filter:blur(52px);animation:d2 39s ease-in-out infinite alternate}
.p3{width:60vw;height:40vh;left:-10vw;bottom:-18vh;background:rgba(216,168,71,.05);
  filter:blur(64px);animation:d3 55s ease-in-out infinite alternate}
/* el rojo da la temperatura de fondo: sube el contraste del verde y del dorado */
.p4{width:64vw;height:52vh;right:-16vw;bottom:-22vh;background:rgba(229,72,77,.17);
  filter:blur(78px);animation:d4 44s ease-in-out infinite alternate}
.p5{width:44vw;height:34vh;left:6vw;top:-16vh;background:rgba(229,72,77,.10);
  filter:blur(88px);animation:d5 61s ease-in-out infinite alternate}
@keyframes d1{from{transform:translate3d(0,0,0)}to{transform:translate3d(-4vw,3vh,0) scale(1.1)}}
@keyframes d2{from{transform:translate3d(0,0,0)}to{transform:translate3d(5vw,-2vh,0) scale(1.12)}}
@keyframes d3{from{transform:translate3d(0,0,0)}to{transform:translate3d(3vw,-4vh,0) scale(1.07)}}
@keyframes d4{from{transform:translate3d(0,0,0)}to{transform:translate3d(-6vw,-4vh,0) scale(1.14)}}
@keyframes d5{from{transform:translate3d(0,0,0)}to{transform:translate3d(4vw,4vh,0) scale(1.09)}}
@media(prefers-reduced-motion:reduce){.atm i{animation:none}}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.03;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* ── SUPERFICIE PLANA ── el glass teñía el borde y lo rompía visualmente ── */
.glass{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-m);transition:border-color .15s;min-width:0}
.glass:hover{border-color:var(--border-hi)}

/* ── NAV FIJA ── */
.topnav{position:fixed;top:0;left:0;right:0;z-index:20;
  background:rgba(14,16,20,.86);backdrop-filter:blur(22px) saturate(130%);
  -webkit-backdrop-filter:blur(22px) saturate(130%);
  border-bottom:1px solid var(--border)}
.topnav-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);
  padding-top:env(safe-area-inset-top);
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  gap:var(--s4);min-height:var(--navh)}
.topnav-in > .navdate{grid-row:1;grid-column:2}
.topnav-in > .navver{grid-row:1;grid-column:2;align-self:end;margin-top:26px}
.navdate{font-size:var(--t-micro);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--low);white-space:nowrap;text-align:right}
.navver{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--gold);
  white-space:nowrap;text-align:right;opacity:.75}
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;position:relative;
  padding:5px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.tabs::-webkit-scrollbar{display:none}
/* el activo se hunde: sombra interior, no relleno de color */
.slider{position:absolute;top:5px;bottom:5px;border-radius:11px;
  background:var(--surface3);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.55),inset 0 -1px 0 rgba(255,255,255,.05),
    0 0 0 1px var(--border-hi);
  transition:left .3s cubic-bezier(.2,.8,.25,1),width .3s cubic-bezier(.2,.8,.25,1);
  z-index:0;pointer-events:none}
.tabs button{appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:inherit;color:var(--low);white-space:nowrap;position:relative;z-index:1;
  padding:10px var(--s4);border-radius:11px;
  font-size:var(--t-l);font-weight:600;letter-spacing:-.005em;
  transition:color .2s,transform .12s;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--mid)}
.tabs button:active{transform:translateY(1px)}
.tabs button.on{color:var(--hi);font-weight:700}
/* el punto cero es el ancla del panel, no una pestaña más */
.tabs button.cero{font-weight:700;letter-spacing:.06em;color:var(--mid)}
.tabs button.cero.on{color:var(--hi)}
.tabs .sep{width:1px;align-self:stretch;margin:6px 5px;background:var(--border);flex:0 0 auto}

.wrap{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;
  padding:calc(var(--navh) + var(--s7)) var(--gut) var(--s6)}

/* ── CABECERA DE VISTA ── */
.vhead{margin-bottom:var(--s5);padding-bottom:var(--s4);
  border-bottom:1px solid var(--border)}
.vkick{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.vkick i{width:16px;height:2px;background:var(--gold);flex:0 0 auto}
.vkick span{font-size:var(--t-micro);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold)}
.vtitle{font-size:clamp(22px,2.6vw,30px);line-height:1.1;font-weight:700;
  letter-spacing:-.025em;margin-bottom:var(--s2)}
.vtitle em{font-style:normal;color:var(--low);font-weight:500}
.vread{font-size:var(--t-l);font-weight:400;line-height:1.55;color:var(--mid);
  max-width:82ch}

/* ── BLOQUES ── */
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.card{padding:0}
.card-h{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:30px 1fr 20px;gap:var(--s3);align-items:center;
  padding:var(--s4) var(--s5)}
.card-h::-webkit-details-marker{display:none}
.card-h:hover .card-t{color:var(--mid)}
.card-nb{font-size:var(--t-xs);font-weight:700;letter-spacing:.05em;color:var(--low);
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);
  text-align:center;padding:2px 0;line-height:1.2}
.card-t{font-size:var(--t-micro);font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--low);min-width:0}
.card-cv{font-size:16px;color:var(--low);justify-self:end;transition:transform .2s}
.card[open] .card-cv{transform:rotate(90deg)}
.card-in{padding:0 var(--s5) var(--s5)}
/* los sub-titulos que se escribian dentro del cuerpo siguen sirviendo */
.card-in > .card-t{margin-bottom:var(--s3)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s3)}
.tiles.eight{margin-bottom:0;row-gap:var(--s3)}
.tile{padding:var(--s4)}
.tile .k{font-size:var(--t-micro);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s2);line-height:1.4}
.tile .n{font-size:var(--n-m);font-weight:700;letter-spacing:-.03em;line-height:1}
.tile.live .n{color:var(--good)}
.tile.mid .n{color:var(--hi)}
.tile.brk .n{color:var(--danger)}
.tile.blind .n{color:var(--low)}
.tile .n em{font-style:normal;font-size:.44em;font-weight:500;letter-spacing:.01em;
  margin-left:3px;color:var(--mid)}
.tile .f{margin-top:var(--s2);font-size:var(--t-xs);color:var(--mid);line-height:1.45}
.tile .st{margin-top:var(--s2);font-size:var(--t-micro);font-weight:600;
  letter-spacing:.10em;text-transform:uppercase}
.legend.ctr{justify-content:center;margin-top:var(--s3)}
.rx-grid{fill:none;stroke:var(--border-hi);stroke-width:1;opacity:.6}
.rx-spoke{stroke:var(--border);stroke-width:1}
.rx-target{fill:none;stroke:var(--gold-dim);stroke-width:1;stroke-dasharray:3 4}
.rx-now{fill:var(--gold-glow);stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round}
.rx-dot{fill:var(--gold)}.rx-dot.brk{fill:var(--danger)}
.rx-val.live{fill:var(--good)} .rx-val.mid{fill:var(--warn)} .rx-val.brk{fill:var(--danger)}
.legend{display:flex;gap:var(--s4);margin-bottom:var(--s3);
  font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low)}
.legend i{display:inline-block;width:14px;height:2px;margin-right:6px;
  vertical-align:middle;background:var(--gold);border-radius:2px}
.legend i.t{background:none;border-top:1px dashed var(--gold-dim);height:0}

/* ── FILAS ── */
.rw{display:grid;align-items:center;gap:var(--s4);
  padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.rw:last-child{border-bottom:0}
.rw-sy{grid-template-columns:18px 1.05fr 1fr 1.7fr}
.k1{font-size:var(--t-m);font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.k2{font-size:var(--t-s);color:var(--mid);line-height:1.45}
.k3{font-size:var(--t-xs);color:var(--low)}
.rw.brk .idx{color:var(--danger)}
.rw.brk{box-shadow:inset 2px 0 0 var(--danger);padding-left:var(--s3);margin-left:-14px}

.meter{display:flex;gap:3px}
.meter i{flex:1;height:7px;border-radius:2px;background:var(--surface3);display:block}
.meter i.on{background:var(--mid)}
.meter.live i.on{background:var(--good)}
.meter.brk i.on{background:var(--danger)}
.meter.blind i{background:var(--surface2);
  background-image:repeating-linear-gradient(115deg,transparent 0 3px,rgba(255,255,255,.13) 3px 6px)}

.dot{width:7px;height:7px;border-radius:50%;background:var(--low)}
.dot.live{background:var(--good);box-shadow:0 0 8px rgba(74,222,128,.55)}
.dot.mid{background:var(--mid)}
.dot.brk{background:var(--danger);box-shadow:0 0 8px rgba(229,72,77,.55)}
.dot.blind{background:var(--low)}

.bar{height:9px;border-radius:var(--r-pill);background:var(--surface3);
  position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-pill);
  background:var(--mid);display:block}
.bar i.gold{background:var(--gold)}
.bar i.dgr{background:var(--danger)}

.note{margin-top:var(--s3);font-size:var(--t-xs);color:var(--low);line-height:1.55}
.rev .m{font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s1)}
.rev .v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em}
.rev .v.zero{color:var(--low)}
.rev .v.gold{color:var(--gold)}

/* ── CONTRATOS ── */
.ct{display:grid;grid-template-columns:1.3fr 92px 1fr 80px;gap:var(--s4);
  align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.ct:last-child{border-bottom:0}
.ike .n{font-size:var(--t-m);font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;margin-bottom:var(--s2)}
.ike.core .n{color:var(--gold)}
.ike .d{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.ike .r{margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--border);
  font-size:var(--t-xs);color:var(--low);line-height:1.45}
.chip{font-size:var(--t-xs);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:5px 12px;color:var(--mid);white-space:nowrap;background:var(--surface2)}
.chip.off{color:var(--low);border-style:dashed}
.chain-i .n{font-size:var(--t-s);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.chain-i .d{margin-top:var(--s1);font-size:var(--t-xs);color:var(--mid);line-height:1.45}
.skillrow .m{font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}
.skillrow .m b{display:block;margin-top:2px;font-size:var(--t-xl);color:var(--hi)}

.foot{max-width:var(--maxw);margin:0 auto;
  padding:var(--s5) var(--gut) calc(var(--s6) + env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;
  font-size:var(--t-micro);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--low);position:relative;z-index:2}
.fresh{display:flex;gap:var(--s4);flex-wrap:wrap}
.fresh i{display:inline-block;width:4px;height:4px;border-radius:50%;
  margin-right:5px;vertical-align:middle;background:var(--good)}
.fresh i.lag{background:var(--warn)}.fresh i.none{background:var(--low)}

.view{display:none}.view.on{display:block;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fn-bar.nil{background-image:repeating-linear-gradient(115deg,
  transparent 0 5px,rgba(255,255,255,.06) 5px 10px)}
.fn-bar.nil b{color:var(--low)}
.fn-rt.worst{color:var(--danger)}
.cli.brk{border-color:rgba(229,72,77,.3)}
.cli.live{border-color:rgba(74,222,128,.28)}
.cli-h .k1{font-size:var(--t-l)}
.ccb .v{font-size:var(--t-l);font-weight:700;margin-bottom:var(--s1);text-align:center}
.ccb .m{font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--low);text-align:center;margin-top:var(--s2)}

/* ── CANALES ── */
.cn{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.cn + .cn{margin-top:var(--s2)}
.cn.hot{border-color:var(--gold-dim);background:linear-gradient(160deg,var(--gold-glow),var(--surface))}
.cn-m.gold b{color:var(--gold)}
.gp.brk .gp-p{color:var(--danger)}
.og-v.brk{color:var(--danger)}
.og-bar i.brk{background:var(--danger)}

.tm{display:grid;grid-template-columns:150px 78px 84px 78px 1fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.tm:last-child{border-bottom:0}
.tm-v.live{color:var(--good)}.tm-v.brk{color:var(--danger)}
.dg.live{border-left-color:var(--good)}
.sev i.on{background:var(--danger)}
.dg.live .sev i.on{background:var(--good)}
.dg.live .dg-cul{color:var(--good);border-color:rgba(74,222,128,.35)}
.concl{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--border);
  font-size:var(--t-xl);color:var(--hi);line-height:1.6}
.concl b{color:var(--gold);font-weight:600;display:block;font-size:var(--t-micro);
  letter-spacing:.10em;text-transform:uppercase;margin-bottom:var(--s2)}

/* ── SKILLS POR PESTAÑA ── */
.sk-area{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border)}
.sk-area b{font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low);white-space:nowrap}

/* ── ESCALERA SOP → AGENTE ── */
.esc{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.esc-s.brk{border-color:rgba(229,72,77,.35)}
.esc-s.live{border-color:rgba(74,222,128,.3)}
.esc-s.live .esc-v{color:var(--good)}
.esc-s.brk .esc-v{color:var(--danger)}

/* ── OBJECIONES ── */
.ob{display:grid;grid-template-columns:150px 56px 1fr;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.ob:last-child{border-bottom:0}
.ob-v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;text-align:right}
.gd-v.live{color:var(--good);border-color:rgba(74,222,128,.35)}
.gd-v.brk{color:var(--danger);border-color:rgba(229,72,77,.35)}
.gd-v.blind{color:var(--low)}
.mo .n{font-size:var(--t-m);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  margin-bottom:var(--s2)}
.mo:first-child .n{color:var(--gold)}
.mo .d{font-size:var(--t-xs);color:var(--mid);line-height:1.45}
.fmt-v.brk{color:var(--danger)}
.fmt-b.brk i{background:var(--danger)}
/* verde suave = proyectado, no cerrado */
.pj-c i.proy{background:rgba(74,222,128,.28);border:1px dashed rgba(74,222,128,.55);
  border-bottom:0}
.pj-c .v{font-size:var(--t-l);font-weight:700;text-align:center;margin-bottom:var(--s1)}
.pj-c .v.proy{color:var(--good)}
.pj-key i.proy{background:rgba(74,222,128,.28);border:1px dashed rgba(74,222,128,.55)}

/* ── BARRAS VERTICALES AGRUPADAS ── */
.bv{width:100%;height:auto;display:block;max-height:min(42vh,320px)}
.bv-m{font-family:var(--sans);font-size:var(--t-m);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;fill:var(--hi)}
.bg-t i.c2{background:var(--teal)}
.bg-key i.c2{background:var(--teal)}
.sal-c.brk{border-color:rgba(229,72,77,.3)}
.sal-c.brk .sal-v{color:var(--danger)}

/* ── ÁREA DESPLEGABLE ── */
details.ar{border-bottom:1px solid var(--border)}
details.ar:last-child{border-bottom:0}
details.ar > summary{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:26px 1.05fr 168px 92px 1.6fr 20px;gap:var(--s4);
  align-items:center;padding:var(--s3) 0}
details.ar > summary::-webkit-details-marker{display:none}
details.ar > summary:hover{background:rgba(255,255,255,.02)}
details.ar[open] .ar-cv{transform:rotate(90deg)}
details.ar.brk > summary{box-shadow:inset 2px 0 0 var(--danger);padding-left:var(--s3);margin-left:-14px}
.fl.brk{border-color:rgba(229,72,77,.28)}
.fl.live{border-color:rgba(74,222,128,.28)}
.fl.brk .fl-i{background:var(--danger)}
.fl.live .fl-i{background:var(--good)}
.esl-t.brk i{background:var(--danger)}
.esl-t.live i{background:var(--good)}
.bnd-t.blind i{background:repeating-linear-gradient(115deg,
  rgba(255,255,255,.22) 0 4px,transparent 4px 8px)}

/* ── SECCIONES DEL PUNTO CERO ── */
.oz-s{display:flex;align-items:center;gap:var(--s3);margin:var(--s7) 0 var(--s4);
  font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em;color:var(--hi)}
.oz-s:first-child{margin-top:0}
.oz-s span{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;color:var(--low);
  border:1px solid var(--border);border-radius:var(--r-pill);padding:4px 9px}
.oz-s::after{content:"";flex:1;height:1px;background:var(--border)}
.oz .vhead{margin-bottom:var(--s4)}
.oz .vtitle{font-size:clamp(19px,2.4vh,26px)}
.oz .vread{font-size:var(--t-l)}
.oz .sk-area{display:none}
.sil.ok{color:var(--good);border-color:rgba(74,222,128,.35)}
.sil.brk{color:var(--danger);border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.08)}

/* ── LÍNEA DE CONTRATOS ── */
.ct-h{display:grid;grid-template-columns:150px 1fr;gap:var(--s4);margin-bottom:var(--s2)}
.ct-m{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.ct-m span{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--low);text-align:center}
.ct-r{display:grid;grid-template-columns:150px 1fr 96px;gap:var(--s4);align-items:center;
  padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.ct-r:last-child{border-bottom:0}
.ct-g{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;height:26px}
.ct-g i{border-radius:3px;background:var(--surface3);display:block}
.ct-g i.on{background:var(--gold)}
.ct-g i.on.live{background:var(--good)}
.ct-g i.on.brk{background:var(--danger)}
.ct-n{font-size:var(--t-m);font-weight:700}
.ct-n span{display:block;margin-top:2px;font-size:var(--t-micro);font-weight:500;color:var(--low)}
.ct-v{text-align:right}
.ct-v b{display:block;font-size:var(--t-l);font-weight:700;letter-spacing:-.02em}
.ct-v span{display:block;font-size:var(--t-micro);color:var(--low);margin-top:2px}

/* ── LAS TRES LECTURAS ── */
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.tres-c.live{border-color:rgba(74,222,128,.3)}
.tres-c.live .tres-v{color:var(--good)}

/* ── PIPELINE ── */
.pp{display:grid;grid-template-columns:1.3fr 116px 108px 1fr 1.5fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.pp:last-child{border-bottom:0}
.pp-t{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mid);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:4px 10px;text-align:center}
.pp-c{font-size:var(--t-m);font-weight:700;text-align:center;color:var(--hi)}
.pp-p{display:flex;align-items:center;gap:var(--s2)}
.pp-p b{font-size:var(--t-l);font-weight:700;min-width:38px;text-align:right}
.pp.live .pp-p b{color:var(--good)}
.pp.brk .pp-p b{color:var(--danger)}
.foco{display:flex;gap:var(--s1);flex-wrap:wrap;margin-top:var(--s2)}
.foco span{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:var(--r-pill);background:rgba(216,168,71,.14);
  color:var(--gold);border:1px solid var(--gold-dim)}
.rit-c.live{border-color:rgba(74,222,128,.32)}
.rit-i .q{width:26px;height:26px;border-radius:7px;background:var(--surface3);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:var(--t-micro);font-weight:700;color:var(--hi)}
.rit-i .t{flex:1;font-size:var(--t-m);font-weight:600}
.rit-i .a{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--low);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 8px}
.sem-d.on{background:var(--gold)}
.sem-d.on.mkt{background:var(--a-mkt)}.sem-d.on.cml{background:var(--a-cml)}
.sem-d.on.cmn{background:var(--a-cmn)}.sem-d.on.ent{background:var(--a-ent)}
.sem-d.on.prd{background:var(--a-prd)}.sem-d.on.bkd{background:var(--a-bkd)}
.sem-d.on.fnd{background:var(--a-fnd)}.sem-d.on.idd{background:var(--a-idd)}

/* la tarjeta de ritmo se tiñe con el área de cada ítem */
.rit-i .a{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 8px;border-radius:var(--r-pill);border:1px solid currentColor;
  opacity:.9;white-space:nowrap}
.rit-i.mkt .a{color:var(--a-mkt)}.rit-i.cml .a{color:var(--a-cml)}
.rit-i.cmn .a{color:var(--a-cmn)}.rit-i.ent .a{color:var(--a-ent)}
.rit-i.prd .a{color:var(--a-prd)}.rit-i.bkd .a{color:var(--a-bkd)}
.rit-i.fnd .a{color:var(--a-fnd)}.rit-i.idd .a{color:var(--a-idd)}
.pie-w{text-align:center}
.pie-t{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--low);margin-bottom:var(--s3)}
.pie-svg{width:100%;max-width:220px;height:auto;margin:0 auto var(--s3);display:block}
.pie-l{display:flex;flex-direction:column;gap:var(--s1)}
.pie-l div{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-s);color:var(--mid)}
.pie-l i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.pie-l b{margin-left:auto;color:var(--hi);font-weight:700}

/* ── LEVERAGE ── */
.lv{display:grid;grid-template-columns:130px 80px 84px 84px 96px 1fr;gap:var(--s3);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.lv:last-child{border-bottom:0}
.lv-v{font-size:var(--t-l);font-weight:700;text-align:right}
.lv.live .lv-b{color:var(--good);border-color:rgba(74,222,128,.35)}
.lv.brk .lv-b{color:var(--danger);border-color:rgba(229,72,77,.35)}
.lv.mid .lv-b{color:var(--warn);border-color:rgba(232,179,57,.35)}
.bk-d.live{background:var(--good)}.bk-d.mid{background:var(--warn)}.bk-d.brk{background:var(--danger)}
.app{font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;
  background:var(--surface3);color:var(--mid)}

/* ── RESUMEN GLOBAL ── */
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.res-t .go{font-size:var(--t-micro);color:var(--low)}
.res-k b.live{color:var(--good)}.res-k b.brk{color:var(--danger)}
.res-k b.mid{color:var(--hi)}.res-k b.blind{color:var(--low)}

/* ── BADGE DE VARIACIÓN ── */
.dt{font-size:var(--t-micro);font-weight:700;letter-spacing:.04em;padding:2px 7px;
  border-radius:var(--r-pill);display:inline-block}
.dt.up{color:var(--good);background:rgba(74,222,128,.14)}
.dt.dn{color:var(--danger);background:rgba(229,72,77,.14)}
.dt.eq{color:var(--low);background:var(--surface3)}
.lg.img{background:var(--surface3);display:flex;align-items:center;justify-content:center}
.cta-c.live{border-color:var(--gold-dim)}
.cta-i .q{font-size:var(--t-s);color:var(--mid);margin-top:2px}
.cta-i .w{font-size:var(--t-xs);color:var(--low);margin-top:3px;font-style:italic}
.mini polygon.g{fill:none;stroke:var(--border);stroke-width:1}
.mini polygon.v{fill:rgba(216,168,71,.2);stroke:var(--gold);stroke-width:1.5}
.ba-e.live{background:var(--good)}.ba-e.mid{background:var(--warn)}.ba-e.brk{background:var(--danger)}
.ba-cl.si{color:var(--blue);border-color:rgba(91,155,213,.35)}

/* ── LTV ── */
.ltv{display:grid;grid-template-columns:1.2fr 70px 90px 100px 96px 1.6fr;gap:var(--s3);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.ltv:last-child{border-bottom:0}
.ltv-h{display:grid;grid-template-columns:1.2fr 70px 90px 100px 96px 1.6fr;gap:var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--border-hi);
  font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--low)}
.ltv-v{font-size:var(--t-l);font-weight:700;text-align:right}
.ltv-v.big{color:var(--good)}
.ltv-r{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;border-radius:var(--r-pill);padding:4px 8px;border:1px solid var(--border);color:var(--mid)}
.ltv.live .ltv-r{color:var(--good);border-color:rgba(74,222,128,.35)}
.ltv.brk .ltv-r{color:var(--danger);border-color:rgba(229,72,77,.35)}
.ltv-tot{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.ltv-tot div{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);text-align:center}
.ltv-tot div.pot{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.07)}
.ltv-tot b{display:block;font-size:var(--n-m);font-weight:700;letter-spacing:-.03em}
.ltv-tot div.pot b{color:var(--good)}
.ltv-tot span{font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}

/* ── WINS ── */
.win{display:grid;grid-template-columns:1.2fr 96px 84px 2fr;gap:var(--s3);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.win:last-child{border-bottom:0}
.win-t{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;border-radius:var(--r-pill);padding:4px 8px;
  color:var(--good);border:1px solid rgba(74,222,128,.3)}
.win-q{font-size:var(--t-s);color:var(--low);text-align:center}

/* ══ CRITERIO VISUAL ÚNICO ══
   Todo lo que se repite en el panel se define acá una sola vez.
   Los bloques particulares heredan de esto en vez de re-declararlo. */

/* 1 · ETIQUETA — todo rótulo en mayúscula usa exactamente estas medidas */
.card-t,.arh span,.mt-k,.pg-h span,.ld-h span,.tm-h span,.gp3-m,
.sy-fa i,.ce-f b,.cf-r div b,.cf-key b,.cf-bl b,.bal b,.alg span,
.tsum > div > span,.via b,.pgm span,.cal-h,.win-t,.ltv-r{
  font-size:var(--t-micro);font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;line-height:1.3}

/* 2 · CIFRA — un solo tamaño por jerarquía, nunca un valor suelto */
.tile .n,.mt-v,.gp3-v,.tsum b,.arh b{letter-spacing:-.03em;line-height:1.05;font-weight:700}
.mt-v,.gp3-v{font-size:var(--n-m)}

/* 3 · SEMÁFORO — el estado se dice con el mismo color en todo el panel */
.s-live,.dot.live,.mt-c.live .mt-v,.pal.live .pal-v{color:var(--good)}
.s-brk,.dot.brk,.mt-c.brk .mt-v{color:var(--danger)}
.s-mid,.dot.mid{color:var(--warn)}

/* 4 · CAJA INTERNA — toda tarjeta dentro de un bloque comparte fondo y borde */
.mt-c,.gp3 > div,.arh div,.tsum div,.ce-f,.cf-f,.bal > div,.pgm > div,.cal-d{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s)}

/* 5 · FILA DE TABLA — mismo aire y misma línea en todas las listas */
.pg,.ld,.pal,.ltv,.win,.ac,.tm{border-bottom:1px solid var(--border)}
.pg:last-of-type,.ld:last-of-type,.pal:last-of-type,
.ltv:last-child,.win:last-child{border-bottom:0}

/* 6 · CABECERA DE TABLA — siempre con línea abajo, nunca sin ella */
.pg-h,.ld-h,.tm-h,.ltv-h{padding-bottom:var(--s2);border-bottom:1px solid var(--border)}

/* 7 · CONTRASTE — el texto secundario nunca baja de este gris sobre superficie */
.k2,.note,.ac-f,.cf-r div p,.ce-f p,.mt-d,.gp3-d{color:var(--mid)}
.note{opacity:.92}

/* ── EMBUDO COMERCIAL ── */
.fnl-w2{max-width:600px;margin:0 auto}
.fnl{width:100%;height:auto;display:block}
.fnl-v{font-family:var(--sans);font-size:19px;font-weight:700;letter-spacing:-.02em}
.fnl-n{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.1em;
  fill:var(--mid)}
.fnl-r{font-family:var(--sans);font-size:11px;font-weight:700;fill:var(--low)}
.fnl-r.worst{fill:var(--danger)}
.fnl-w{font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.12em;
  fill:var(--danger)}
.fnl-x{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);
  margin-top:var(--s4)}
.fnl-x > div{padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border)}
.fnl-x b{display:block;font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;
  line-height:1}
.fnl-x .no b{color:var(--danger)}
.fnl-x span{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);margin-top:4px;line-height:1.3}
.fnl-x .no{border-color:rgba(229,72,77,.3)}
.fnl-c{margin-top:var(--s4);padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:rgba(229,72,77,.06);border:1px solid rgba(229,72,77,.25);
  font-size:var(--t-s);color:var(--hi);line-height:1.5}

/* ── LAS TRES LECTURAS DE LA MISMA PLATA ── */
.lec{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.lec > div{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.lec > div.live{border-color:rgba(74,222,128,.28)}
.lec b{display:block;font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;line-height:1}
.lec > div.live b{color:var(--good)}
.lec span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin:5px 0 var(--s2)}
.lec p{font-size:var(--t-xs);color:var(--mid);line-height:1.45}

/* la barra de pagos compara cobrado contra firmado */
.pgm-b{display:flex;align-items:flex-end;justify-content:center;gap:4px;
  height:52px;margin:var(--s2) 0 0}
.pgm-b i{width:16px;border-radius:2px 2px 0 0;display:block}
.pgm-b i.cob{background:var(--good)}
.pgm-b i.cer{background:var(--blue)}
.pgm > div.nil .pgm-b i{background:var(--danger);opacity:.35}
.pgm-l{display:flex;gap:var(--s5);justify-content:center;margin:var(--s2) 0 var(--s3)}
.pgm-l span{display:inline-flex;align-items:center;gap:5px;font-size:9px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--low)}
.pgm-l i{width:10px;height:10px;border-radius:2px}
.pgm-l i.cob{background:var(--good)} .pgm-l i.cer{background:var(--blue)}

/* ── LA META DEL MES ── */
.mta{display:grid;grid-template-columns:auto 1fr auto auto;gap:var(--s5);
  align-items:center;padding:var(--s4) var(--s5);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border);margin-bottom:var(--s3)}
.mta-p{font-size:var(--t-l);font-weight:700;text-transform:capitalize}
.mta-d{display:flex;gap:var(--s3)}
.mta-d i{width:38px;height:38px;border-radius:50%;
  border:2px dashed var(--border-hi);flex:0 0 auto}
.mta-d i.on{border:2px solid var(--good);background:rgba(74,222,128,.16)}
.mta-n,.mta-t{text-align:right;white-space:nowrap}
.mta-n b{font-size:var(--n-m);font-weight:700;letter-spacing:-.03em;
  line-height:1;color:var(--danger)}
.mta-t{font-size:var(--t-l);font-weight:700;color:var(--gold)}
.mta-n span,.mta-t span{display:block;font-size:var(--t-micro);font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--low);margin-top:3px}
.mta-x{padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:rgba(216,168,71,.07);border:1px solid rgba(216,168,71,.3);
  font-size:var(--t-s);color:var(--hi);line-height:1.5;margin-bottom:var(--s3)}
.cal-d.hoy{border-color:var(--gold);box-shadow:0 0 0 1px rgba(216,168,71,.35)}
.cal-d.hoy .cal-n{color:var(--gold)}

/* ── PAGOS DE CONSULTORÍA ── */
.pgm{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);
  margin-bottom:var(--s4);align-items:end}
.pgm > div{padding:var(--s3);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);text-align:center}
.pgm > div.nil{border-color:rgba(229,72,77,.3)}
.pgm b{display:block;font-size:var(--t-l);font-weight:700;color:var(--good)}
.pgm > div.nil b{color:var(--danger)}
.pgm span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);margin-top:5px}
.pg-h,.pg{display:grid;grid-template-columns:1fr 116px 54px 78px 2fr;gap:var(--s3);
  align-items:center}
.pg-h{padding-bottom:var(--s2);border-bottom:1px solid var(--border)}
.pg-h span{font-size:9px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low)}
.pg-h span:nth-child(3),.pg-h span:nth-child(4){text-align:right}
.pg{padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.pg:last-of-type{border-bottom:0}
.pg-c{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;padding:2px 8px;border-radius:var(--r-pill);
  border:1px solid var(--border);color:var(--low)}
.pg-c.ren{color:var(--gold);border-color:rgba(216,168,71,.4)}
.pg-m{font-size:var(--t-xs);color:var(--low);text-align:right;font-weight:600}
.pg-v{font-size:var(--t-l);font-weight:700;text-align:right;color:var(--good)}

/* ── MÉTRICAS EN TARJETA ── */
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.mt-c{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.mt-c.live{border-color:rgba(74,222,128,.28)}
.mt-c.brk{border-color:rgba(229,72,77,.28)}
.mt-k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--low);margin-bottom:var(--s2)}
.mt-v{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.mt-c.live .mt-v{color:var(--good)}
.mt-c.brk .mt-v{color:var(--danger)}
.mt-c.mid .mt-v{color:var(--hi)}
.mt-d{font-size:var(--t-xs);color:var(--low);line-height:1.45;margin-top:var(--s2)}

/* ── BALANZA DE DOLOR ── */
.bal{display:flex;gap:4px;margin-bottom:var(--s2)}
.bal > div{padding:var(--s3) var(--s2);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border);text-align:center;min-width:0}
.bal > div.nil{opacity:.4}
.bal i{display:block;width:18px;height:4px;border-radius:2px;margin:0 auto var(--s2)}
.bal b{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--low);line-height:1.2}
.bal u{display:block;text-decoration:none;font-size:var(--t-l);font-weight:700;margin-top:3px}
.bal-b{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:2px;
  margin-bottom:var(--s4)}
.bal-b span{display:block}
.ld-h,.ld{display:grid;grid-template-columns:118px 128px 1.2fr 1.2fr 168px 92px;
  gap:var(--s3);align-items:center}
.ld-h{padding-bottom:var(--s2);border-bottom:1px solid var(--border)}
.ld-h span{font-size:9px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low)}
.ld{padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.ld:last-of-type{border-bottom:0}
.ld-n{font-size:var(--t-s);font-weight:700;line-height:1.2}
.ld-n em{display:block;font-style:normal;font-size:9px;color:var(--low);
  font-weight:500;margin-top:2px}
.ld-p{font-size:9.5px;font-weight:600;color:var(--mid);line-height:1.3}
.ld-p.tec{color:var(--gold)}
.ld-d{font-size:var(--t-xs);color:var(--hi);line-height:1.4}
.ld-x{display:flex;gap:3px;flex-wrap:wrap}
.ld-x span{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 6px;border-radius:var(--r-pill);border:1px solid;white-space:nowrap}
.ld-pr{display:grid;grid-template-columns:1fr 32px;gap:var(--s2);align-items:center}
.ld-pr i{display:block;height:6px;border-radius:3px;background:var(--gold)}
.ld-pr b{font-size:var(--t-xs);font-weight:700;text-align:right;color:var(--low)}
.tsum .ok b{color:var(--good)} .tsum .no b{color:var(--danger)}
.tsum .ok{border-color:rgba(74,222,128,.3)} .tsum .no{border-color:rgba(229,72,77,.3)}

/* nivel 1 — el sistema */
.sy{border:1px solid var(--border);border-radius:var(--r-m);
  background:var(--surface2);margin-bottom:var(--s2);overflow:hidden}
.sy.auto{border-color:rgba(74,222,128,.3)}
.sy.semi{border-color:rgba(232,179,57,.28)}
.sy > summary{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:30px 1fr 92px 62px 74px 1fr 68px 60px 18px;
  gap:var(--s3);align-items:center;padding:var(--s3) var(--s4)}
.sy > summary::-webkit-details-marker{display:none}
.sy > summary:hover{background:rgba(255,255,255,.02)}
.sy-ag.mano{color:var(--danger);border-color:rgba(229,72,77,.35)}
.sy-ah.nil{color:var(--danger);font-size:var(--t-xs)}
.sy[open] > summary .sy-cv{transform:rotate(90deg)}
.sk2-ah.nil{color:var(--low)}
.ac-au.mano{color:var(--danger);background:rgba(229,72,77,.1)}
.ac-m.nil{color:var(--danger);opacity:.75}
.sy-fa b.ok{color:var(--good)}.sy-fa b.mid{color:var(--warn)}.sy-fa b.no{color:var(--danger)}
.sy-fa .con{margin-left:auto}
.sy-fa .con div{display:flex;gap:4px;flex-wrap:wrap}
.tm-src{margin-top:var(--s3);font-size:9.5px;color:var(--low);
  letter-spacing:.04em;text-align:right}
.fmx-c.live{border-color:rgba(74,222,128,.3)}
.fmx-c.brk{border-color:rgba(229,72,77,.28)}
.fmx-h .lgo{width:15px;height:15px;flex:0 0 auto}
.fmx-c.live .fmx-e{color:var(--good)}
.fmx-c.brk .fmx-e{color:var(--danger)}
.dg-n.live{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.06)}
.dg-n.mid{border-color:rgba(232,179,57,.35);background:rgba(232,179,57,.05)}
.dg-n.brk{border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.06)}
.dg-n.live .dg-i{color:var(--good)}
.dg-n.mid .dg-i{color:var(--warn)}
.dg-n.brk .dg-i{color:var(--danger)}
.ce.live .ce-i{color:var(--good)}.ce.mid .ce-i{color:var(--warn)}.ce.brk .ce-i{color:var(--danger)}
.ce.live .ce-s{color:var(--good)}.ce.mid .ce-s{color:var(--warn)}.ce.brk .ce-s{color:var(--danger)}
.ce-f.sk b{color:var(--gold)}
.ce-f.sk p{font-family:var(--sans);font-weight:600;color:var(--hi)}
.ce-f.dn{background:rgba(78,195,168,.06);border-color:rgba(78,195,168,.28)}
.ce-f.dn b{color:var(--teal)}
.ce-f.dn p{color:var(--hi)}

.lgo{width:16px;height:16px;border-radius:4px;object-fit:contain;flex:0 0 auto;
  vertical-align:-3px}
.lgo.big{width:26px;height:26px;border-radius:7px}
.chp{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;
  padding:3px 8px 3px 5px;border-radius:var(--r-pill);
  background:var(--surface3);color:var(--mid);white-space:nowrap}
.chp .lgo{width:13px;height:13px;border-radius:3px}
.chp-d{width:6px;height:6px;border-radius:2px;background:var(--border-hi);
  margin-left:2px;flex:0 0 auto}
.arh .g b{color:var(--good)} .arh .m b{color:var(--warn)} .arh .b b{color:var(--danger)}
.arx.brk .arx-i{color:var(--danger)}
.arx.live .gap i{background:var(--good)}
.arx.mid  .gap i{background:var(--warn)}
.arx.brk  .gap i{background:var(--danger)}
.arx.live .arx-sc b{color:var(--good)}
.arx.mid  .arx-sc b{color:var(--warn)}
.arx.brk  .arx-sc b{color:var(--danger)}
.cf.live{border-color:rgba(74,222,128,.3)}
.cf.mid{border-color:rgba(232,179,57,.28)}
.cf.brk{border-color:rgba(229,72,77,.3)}
.cf-hd .dot{margin-top:5px}
.cf.live .cf-bar i{background:var(--good)}
.cf.mid  .cf-bar i{background:var(--warn)}
.cf.brk  .cf-bar i{background:var(--danger)}

/* ── RESPONSIVE ── */
@media(max-width:1100px){
  .rw-ar .k2{grid-column:2/-1}
  .rw-sy{grid-template-columns:18px 1fr 1fr}
  .rw-sy .k2{grid-column:2/-1}
}
@media(max-width:860px){
  .topnav-in{min-height:auto;padding-top:var(--s2);padding-bottom:var(--s2);
    grid-template-columns:1fr;gap:var(--s2)}
  .navdate{display:none}
  .tabs{grid-column:1/-1;width:100%}
  .tabs button{font-size:var(--t-m);padding:var(--s2) var(--s3)}
  .wrap{padding-top:calc(62px + var(--s4))}
  .vhead{grid-template-columns:1fr;gap:var(--s2);align-items:start}
  .vtitle{white-space:normal}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .rw-tr .meter{grid-column:2/-1}
  .ct{grid-template-columns:1fr 84px;row-gap:var(--s1)}
  .ct .bar{grid-column:1/-1}
  .gp .k2,.gp-d{grid-column:2}
  .og .k2{grid-column:1/-1}
  .tm,.tm-h{grid-template-columns:1fr 70px 76px;row-gap:var(--s1)}
  .tm .k2{grid-column:1/-1}
  .esc{grid-template-columns:repeat(2,1fr)}
  .ob{grid-template-columns:1fr 56px;row-gap:var(--s1)}
  .ob .k2{grid-column:1/-1}
  .gd .k2{grid-column:2/-1}
  .wk .k2,.wk-q{grid-column:2}
  .fmt-b,.fmt .k2{grid-column:1/-1}
  .rn .k2{grid-column:1/-1}
  .pal .k2{grid-column:1/-1}
  .bnd-t,.bnd .k2{grid-column:1/-1}
  .tres{grid-template-columns:1fr}
  .pp{grid-template-columns:1fr 108px;row-gap:var(--s1)}
  .pp-c,.pp-p,.pp .k2{grid-column:1/-1}
  .ct-r,.ct-h{grid-template-columns:1fr;row-gap:var(--s1)}
  .lv,.lv-h{grid-template-columns:1fr 70px 76px;row-gap:var(--s1)}
  .lv .k2,.lv-v:nth-of-type(n+3){grid-column:1/-1}
  .res{grid-template-columns:1fr}
  .ba .k2,.ba-cl,.gr-sk{grid-column:2}
  .ltv,.ltv-h{grid-template-columns:1fr 76px 96px;row-gap:var(--s1)}
  .ltv .k2,.ltv-r{grid-column:1/-1}
  .ltv-h span:nth-child(n+4){display:none}
  .win{grid-template-columns:1fr 92px;row-gap:var(--s1)}
  .win .k2,.win-q{grid-column:1/-1}
  .pgm{grid-template-columns:1fr 1fr}
  .lec,.fnl-x{grid-template-columns:1fr}
  .fnl-w2{max-width:100%}
  .pg-h{display:none}
  .pg{grid-template-columns:1fr 78px;row-gap:var(--s1)}
  .pg-c,.pg-m{grid-row:2;text-align:left;justify-self:start}
  .pg .k2{grid-column:1/-1}
  .mt{grid-template-columns:1fr}
  .mta{grid-template-columns:1fr auto;row-gap:var(--s3)}
  .mta-d{grid-column:1/-1}
  .bal{flex-wrap:wrap}
  .bal > div{flex:1 1 22%!important}
  .ld-h{display:none}
  .ld{grid-template-columns:1fr 84px;row-gap:var(--s2)}
  .ld .ld-p,.ld .k2,.ld-d,.ld-x{grid-column:1/-1}
  .sy > summary{grid-template-columns:26px 1fr 76px 18px;row-gap:var(--s2)}
  .sy-fa .con{margin-left:0;width:100%}
  .gr .k2,.gr-r,.gr-sk{grid-column:1/-1}
  details.ar > summary{grid-template-columns:26px 1fr 20px;row-gap:var(--s1)}
  details.ar > summary .k3,details.ar > summary .meter,details.ar > summary .k2{grid-column:2}
  .ns-a,.ns .k2,.ns-q{grid-column:2}
}
@media(max-width:520px){
  .tiles{grid-template-columns:1fr 1fr}
  .tile{padding:var(--s3)}
  .tile .n{font-size:26px}
  .tile .k{font-size:9px;letter-spacing:.08em}
  .card-h{grid-template-columns:26px 1fr 18px;gap:var(--s2);
    padding:var(--s3) var(--s4)}
  .card-in{padding:0 var(--s4) var(--s4)}

}

/* ══ SUPERFICIE · glass del Content OS ══
   Tokens tomados de CONTENIDO/00_METRICAS/content-os: la misma piel en los
   dos paneles. Translúcido con blur en vez de bloques opacos. */
:root{
  --card:rgba(21,22,29,.86); --card2:rgba(30,32,41,.72);
  --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.22);
  --ink:#FFFFFF; --ink2:#DADCE6; --ink3:#A3A7BA;
  --red:#E5322D; --redbd:rgba(229,50,45,.55);
  --grn:#2ED08A; --grnbd:rgba(46,208,138,.5);
  --gold:#D8A847; --goldbd:rgba(216,168,71,.5);
  --surface:rgba(21,22,29,.86); --surface2:rgba(30,32,41,.66);
  --surface3:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.13); --border-hi:rgba(255,255,255,.22);
  --hi:#FFFFFF; --mid:#DADCE6; --low:#A3A7BA;
  --good:#2ED08A; --danger:#E5322D;
}
.glass,.card{backdrop-filter:blur(16px) saturate(1.1);
  -webkit-backdrop-filter:blur(16px) saturate(1.1)}
/* el peso lo lleva el dato, no la caja */
.tile,.mt-c,.k8-c,.lec > div,.fnl-x > div,.gp3 > div,.arh div,.tsum div,
.etp-c,.fmt2-c,.avt-c,.cap3-c,.cso,.frw-c,.dos-c,.ce-f,.cf-f,.cf,.dg-lane,
.pgm > div,.bal > div,.cal-d,.bx-c,.s8-c,.ang-c,.fmx-c,.gen-c{
  background:var(--card2);border-color:var(--line)}
.bq{background:rgba(255,255,255,.08);border-color:transparent}
hr,.rw,.pg,.ld,.pal,.ltv,.win,.tm,.cnl,.blq,.prg,.sig,.gpr,.acc,.tp,.ce,.arx{
  border-color:var(--line)}

/* ══ PIEZAS COMPARTIDAS · el patrón del Content OS ══
   Cajas de alto fijo y grillas que se rellenan solas: donde cabía una fila
   horizontal ahora caben tres o cuatro chips. */
:root{--fig:214px}

/* chips: la unidad mínima. Nunca una fila a todo el ancho. */
.chps{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
.chps.ancho{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.chp2{padding:11px 13px;border-radius:11px;background:var(--card2);
  border:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.chp2.live{border-color:var(--grnbd)} .chp2.brk{border-color:var(--redbd)}
.chp2.mid{border-color:var(--goldbd)}
.chp2-h{display:flex;align-items:center;gap:7px;min-width:0}
.chp2-h .dot{flex:0 0 auto}
.chp2-h b{font:600 9.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chp2-v{font-size:19px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-top:7px}
.chp2.live .chp2-v{color:var(--grn)} .chp2.brk .chp2-v{color:var(--red)}
.chp2 p{font-size:11px;color:var(--ink2);line-height:1.4;margin-top:6px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}

/* caja de gráfico: alto fijo, el SVG se adapta dentro */
.ch{background:var(--card2);border:1px solid var(--line);border-radius:14px;
  padding:16px;display:flex;flex-direction:column;min-width:0;margin-top:12px}
.ch .cap{font:600 9.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3)}
.ch .fig{height:var(--fig);margin-top:10px;position:relative}
.ch .fig svg{width:100%;height:100%;display:block}
.ch-p{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink2);line-height:1.45}
.gr2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gr2 > .ch{margin-top:12px}

/* serie histórica */
.sr-g{stroke:rgba(255,255,255,.08);stroke-width:1}
.sr-a{font-family:var(--mono);font-size:9px;fill:var(--ink3)}
.sr-m{font-family:var(--mono);font-size:9.5px;fill:var(--ink3);letter-spacing:.08em}
.sr-v{font-family:var(--sans);font-size:10.5px;font-weight:700;fill:var(--ink2)}
.sr-v.hoy{fill:var(--grn)}
.sr-b{fill:rgba(216,168,71,.55)}
.sr-b.hoy{fill:var(--grn)}
.sr-b.proy{fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.28);
  stroke-width:1;stroke-dasharray:3 3}

/* el radar llena su caja */
.r8-w{margin-top:0;padding:18px}
.r8-w .fig{height:clamp(300px,44vh,440px);margin-top:0}
.r8{width:100%;height:100%;display:block}
.r8-w .legend{margin-top:12px}

@media(max-width:860px){
  :root{--fig:190px}
  .gr2{grid-template-columns:1fr}
  .chps{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
  .chp2-v{font-size:17px}
}

/* la decisión del día: va antes de los bloques, no es un bloque más */
.dec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) auto;
  gap:20px;align-items:center;padding:16px 18px;margin-bottom:14px;
  border-radius:14px;background:rgba(229,50,45,.07);
  border:1px solid var(--redbd);
  backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px)}
.dec span{display:block;font:600 9px/1 var(--mono);letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.dec-l{display:grid;grid-template-columns:auto 1fr;grid-template-areas:'s s' 'i n' 'u u';
  gap:0 9px;align-items:center}
.dec-l span{grid-area:s} .dec-l .ico{grid-area:i;width:22px;height:22px;color:var(--red)}
.dec-l b{grid-area:n;font-size:19px;font-weight:700;letter-spacing:-.025em}
.dec-l u{grid-area:u;text-decoration:none;font-size:10.5px;color:var(--ink3);margin-top:3px}
.dec p{font-size:13.5px;line-height:1.4;color:var(--ink)}
.dec-p p{color:var(--ink2);font-size:12px}
.dec-go{font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--red);background:transparent;border:1px solid var(--redbd);
  border-radius:999px;padding:10px 15px;cursor:pointer;white-space:nowrap}
.dec-go:hover{background:rgba(229,50,45,.14)}
@media(max-width:860px){
  .dec{grid-template-columns:1fr;gap:14px;padding:14px}
  .dec-go{width:100%}
}

/* ══ DASHBOARD · los 8 sistemas ══ */
.s8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.s8-c{padding:15px;border-radius:14px;background:var(--card2);
  text-align:left;font:inherit;color:inherit;width:100%;appearance:none;
  border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;
  min-height:214px;transition:border-color .15s,transform .15s,box-shadow .25s}
.s8-c:hover{border-color:var(--line2);transform:translateY(-2px)}
.s8-c.live{border-color:var(--grnbd)}
.s8-c.mid{border-color:var(--goldbd)}
.s8-c.brk{border-color:var(--redbd)}
.s8-c.pulse{animation:lat 2.2s ease-in-out infinite}
@keyframes lat{
  0%,100%{box-shadow:0 0 22px rgba(229,50,45,.12)}
  50%{box-shadow:0 0 34px rgba(229,50,45,.42)}}
@media(prefers-reduced-motion:reduce){.s8-c.pulse{animation:none;box-shadow:0 0 26px rgba(229,50,45,.3)}}

.s8-t{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ico{width:20px;height:20px;flex:0 0 auto;opacity:.95;stroke-width:2.4}
.s8-c.live .ico{color:var(--grn)} .s8-c.mid .ico{color:var(--gold)}
.s8-c.brk .ico{color:var(--red)}
.s8-t b{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);flex:1}
.s8-t em{font-style:normal;font:700 8.5px/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--bg);background:var(--red);
  border-radius:4px;padding:3px 6px}
.s8-m1{font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1}
.s8-m1.live{color:var(--grn)} .s8-m1.brk{color:var(--red)} .s8-m1.mid{color:var(--gold)}
.s8-k{font-size:11.5px;color:var(--ink2);line-height:1.35;margin-top:5px}
.s8-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0 0;
  padding-top:12px;border-top:1px solid var(--line)}
.s8-2 span{display:block;font:600 8.5px/1.25 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.s8-2 b{font-size:13px;font-weight:700;color:var(--ink)}
.s8-sc{margin-top:auto;padding-top:13px;display:grid;grid-template-columns:60px 1fr;
  gap:9px;align-items:center}
.s8-sc > span{font-size:17px;font-weight:700;letter-spacing:-.02em}
.s8-sc u{text-decoration:none;font-size:10px;color:var(--ink3);font-weight:600}
.s8-c.live .s8-sc > span{color:var(--grn)} .s8-c.mid .s8-sc > span{color:var(--gold)}
.s8-c.brk .s8-sc > span{color:var(--red)}
.s8-mv{margin-top:9px;font-size:11px;color:var(--ink3);line-height:1.4;
  padding-left:11px;border-left:2px solid var(--line2)}

/* radar grande */
.r8-w{display:flex;justify-content:center}
.r8{width:100%;max-width:620px;height:auto;display:block}
.r8-l{font-family:var(--sans);font-size:15px;font-weight:700;fill:var(--hi);
  letter-spacing:-.01em}
.r8-v{font-family:var(--sans);font-size:17px;font-weight:700;fill:var(--mid)}
.r8-v.live{fill:var(--good)} .r8-v.mid{fill:var(--warn)} .r8-v.brk{fill:var(--danger)}
.r8-t{font-size:12px;fill:var(--low);font-weight:600}
.rx-dot.live{fill:var(--good)} .rx-dot.mid{fill:var(--warn)} .rx-dot.brk{fill:var(--danger)}

/* KPIs de sistema */
.k8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.k8-c{padding:12px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-in)}
.k8-c.brk{border-color:rgba(229,50,45,.28)}
.k8-k{font:600 9px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--low);margin-bottom:8px}
.k8-v{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1}
.k8-c.live .k8-v{color:var(--good)} .k8-c.brk .k8-v{color:var(--danger)}
.k8-c.mid .k8-v{color:var(--hi)} .k8-c.blind .k8-v{color:var(--low)}
.k8-d{font-size:10px;color:var(--low);margin-top:5px}
.mv8{margin-top:var(--s4);padding:12px 14px;border-radius:var(--r-in);
  background:rgba(216,168,71,.07);border:1px solid rgba(216,168,71,.32);
  font-size:var(--t-m);font-weight:600;color:var(--hi)}
.mv8 span{display:block;font:600 9px/1 var(--mono);letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);margin-bottom:5px}

/* barras genéricas de sistema */
.b8{display:flex;flex-direction:column;gap:7px;margin-top:var(--s3)}
.b8-r{display:grid;grid-template-columns:190px 1fr 88px;gap:var(--s3);align-items:center}
.b8-r span{font-size:var(--t-s);color:var(--mid)}
.b8-r b{font-size:var(--t-m);font-weight:700;text-align:right}

/* avatar */
.avt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.avt-c{padding:14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-in);display:flex;flex-direction:column}
.avt-c.live{border-color:rgba(46,208,138,.3)} .avt-c.brk{border-color:rgba(229,50,45,.3)}
.avt-n{font-size:var(--t-m);font-weight:700}
.avt-v{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px}
.avt-v u{text-decoration:none;font-size:10px;color:var(--low);margin-left:4px;font-weight:600}
.avt-p{font-size:10px;color:var(--low);margin-bottom:8px}
.avt-c .k2{margin-top:10px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.dos-c{padding:14px;border-radius:var(--r-in);border:1px solid var(--border);
  background:var(--surface2)}
.dos-c.ok{border-color:rgba(46,208,138,.3)} .dos-c.no{border-color:rgba(229,50,45,.28)}
.dos-c b{display:block;font:600 9px/1 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:8px}
.dos-c.ok b{color:var(--good)} .dos-c.no b{color:var(--danger)}
.dos-c span{display:block;font-size:var(--t-s);color:var(--mid);line-height:1.45;
  padding:3px 0 3px 12px;position:relative}
.dos-c span::before{content:'';position:absolute;left:0;top:11px;width:4px;height:4px;
  border-radius:50%;background:var(--border-hi)}

/* oferta */
.cap3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.cap3-c{padding:14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-in);border-top:2px solid var(--border-hi)}
.cap3-c.live{border-top-color:var(--good)} .cap3-c.brk{border-top-color:var(--danger)}
.cap3-c.mid{border-top-color:var(--warn)}
.cap3-n{font:600 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--low);margin-bottom:8px}
.cap3-p{font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
  background:linear-gradient(180deg,var(--good),rgba(46,208,138,.25))}

@media(max-width:1240px){
  .s8,.k8,.avt{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cap3{grid-template-columns:1fr}
  .b8-r{grid-template-columns:150px 1fr 76px}
}
@media(max-width:860px){
  .s8{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .s8-c{min-height:0;padding:12px}
  .s8-m1{font-size:23px}
  .s8-2{grid-template-columns:1fr;gap:6px}
  .s8-mv{display:none}
  .k8,.avt,.dos{grid-template-columns:1fr}
  .b8-r{grid-template-columns:1fr 70px;row-gap:4px}
  .b8-r .bq{grid-column:1/-1}
  .r8-l{font-size:19px} .r8-v{font-size:21px}
}

/* ══ BUSINESS OS · vistas del embudo ══ */
.bq{height:8px;border-radius:3px;background:var(--surface3);overflow:hidden;
  border:1px solid var(--border)}
.bq i{display:block;height:100%;border-radius:3px;background:var(--mid)}
.bq i.live{background:var(--good)} .bq i.mid{background:var(--warn)}
.bq i.brk{background:var(--danger)} .bq i.blind{background:var(--border-hi)}

/* CRM · canales */
.cnl-h,.cnl{display:grid;grid-template-columns:120px 62px 68px 56px 1fr 1.5fr;
  gap:var(--s3);align-items:center}
.cnl{padding:var(--s3) 0;min-height:48px}
.cnl-h span{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--low);font-family:var(--mono)}
.cnl-h span:nth-child(n+2):nth-child(-n+4){text-align:right}
.cnl-v{font-size:var(--t-l);font-weight:700;text-align:right}
.cnl-t{font-size:var(--t-m);font-weight:700;text-align:right;color:var(--low)}
.cnl.live .cnl-t{color:var(--good)} .cnl.brk .cnl-t{color:var(--danger)}

/* CRM · etapas */
.etp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.etp-c{padding:14px 16px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-in);display:flex;flex-direction:column}
.etp-c.live{border-color:rgba(46,208,138,.3)} .etp-c.brk{border-color:rgba(229,50,45,.3)}
.etp-v{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.etp-c.live .etp-v{color:var(--good)} .etp-c.brk .etp-v{color:var(--danger)}
.etp-c.mid .etp-v{color:var(--warn)}
.etp-n{font-size:var(--t-m);font-weight:700;margin:4px 0 10px}
.etp-c .k2{margin-top:10px}

/* CRM · mercado */
.mrk{display:flex;flex-direction:column;gap:7px}
.mrk-r{display:grid;grid-template-columns:200px 1fr 36px;gap:var(--s3);align-items:center}
.mrk-r span{font-size:var(--t-s);color:var(--mid)}
.mrk-r b{font-size:var(--t-m);font-weight:700;text-align:right}

/* CRM · gaps y acción */
.gpr{display:grid;grid-template-columns:40px 190px 1fr;gap:var(--s3);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border);min-height:46px}
.gpr:last-of-type{border-bottom:0}
.gpr-v{font-size:var(--t-l);font-weight:700;color:var(--gold);text-align:center}
.acc{display:grid;grid-template-columns:180px 240px 1fr;gap:var(--s3);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border);min-height:46px}
.acc:last-of-type{border-bottom:0}
.acc-q{font-size:var(--t-s);font-weight:600;color:var(--hi)}
.acc.live .acc-q{color:var(--good)}

/* MARKETING */
.fmt2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.fmt2-c{padding:16px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-in)}
.fmt2-c.live{border-color:rgba(46,208,138,.3)} .fmt2-c.brk{border-color:rgba(229,50,45,.3)}
.fmt2-h{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:10px}
.fmt2-h b{font-size:var(--t-l);font-weight:700;flex:1}
.fmt2-h span{font-size:9.5px;color:var(--low);font-family:var(--mono);letter-spacing:.12em}
.fmt2-v{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:8px}
.fmt2-v u{display:block;text-decoration:none;font-size:9px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--low);margin-top:4px;
  font-family:var(--mono)}
.fmt2-g{font-size:var(--t-xs);color:var(--mid);margin:8px 0}
.tp-h,.tp{display:grid;grid-template-columns:90px 80px 100px 1fr 100px;gap:var(--s3);
  align-items:center}
.tp{padding:var(--s3) 0;border-bottom:1px solid var(--border);min-height:44px}
.tp:last-of-type{border-bottom:0}
.tp-h span{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--low);font-family:var(--mono)}
.tp-h span:nth-child(3),.tp-h span:nth-child(5){text-align:right}
.tp-f{font-size:var(--t-s);color:var(--mid);font-variant-numeric:tabular-nums}
.tp-t{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--low);font-family:var(--mono)}
.tp-v{font-size:var(--t-l);font-weight:700;text-align:right;color:var(--good)}
.tp-g{font-size:var(--t-m);font-weight:600;text-align:right;color:var(--mid)}

/* DELIVERY */
.blq{display:grid;grid-template-columns:230px 1fr 40px 1.4fr;gap:var(--s3);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border);min-height:44px}
.blq:last-of-type{border-bottom:0}
.blq-v{font-size:var(--t-l);font-weight:700;text-align:right}
.blq.brk .blq-v{color:var(--danger)} .blq.blind .blq-v{color:var(--low)}
.prg{display:grid;grid-template-columns:180px 78px 1fr 130px 100px 1.4fr;gap:var(--s3);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border);min-height:48px}
.prg:last-of-type{border-bottom:0}
.prg-s{font-size:var(--t-l);font-weight:700;text-align:right}
.prg-s span{font-size:var(--t-xs);color:var(--low);font-weight:500}
.prg-e{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--low);font-family:var(--mono)}
.prg-r{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  text-align:center;padding:3px 0;border-radius:var(--r-pill);border:1px solid var(--border);
  color:var(--low);font-family:var(--mono)}
.prg-r.ok{color:var(--good);border-color:rgba(46,208,138,.4)}
.frw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.frw-c{padding:14px 16px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-in);border-left:2px solid var(--gold);display:flex;flex-direction:column}
.frw-n{font-size:var(--t-m);font-weight:700;margin-bottom:6px}
.frw-c p{font-size:11.5px;color:var(--mid);line-height:1.45}
.frw-c2{margin-top:auto;padding-top:10px;font-size:9px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--low);font-family:var(--mono)}

/* SUCCESS */
.sig{display:grid;grid-template-columns:190px 110px 130px 1fr;gap:var(--s3);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border);min-height:48px}
.sig:last-of-type{border-bottom:0}
.sig-s{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  text-align:center;padding:4px 0;border-radius:var(--r-pill);
  border:1px solid var(--border);color:var(--low);font-family:var(--mono)}
.sig-s.ok{color:var(--good);border-color:rgba(46,208,138,.4);background:rgba(46,208,138,.08)}
.sig-s.mid{color:var(--warn);border-color:rgba(232,179,57,.4)}
.sig-e{font-size:var(--t-xs);font-weight:600;color:var(--mid)}
.cso-w{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.cso{padding:16px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-in);display:flex;flex-direction:column}
.cso.live{border-color:rgba(46,208,138,.28)}
.cso-n{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--low);font-family:var(--mono);margin-bottom:8px}
.cso-r{font-size:var(--t-l);font-weight:700;line-height:1.3;color:var(--good);margin-bottom:8px}
.cso.mid .cso-r{color:var(--hi)}
.cso .k2{margin-top:auto}

@media(max-width:1240px){
  .cnl-h,.cnl{grid-template-columns:110px 54px 60px 50px 1fr}
  .cnl-h span:nth-child(6),.cnl .k2{display:none}
  .etp{grid-template-columns:1fr 1fr}

  .prg{grid-template-columns:1fr 70px;row-gap:var(--s2)}

  .prg-e,.prg-r{grid-column:auto}
  .blq{grid-template-columns:1fr 40px;row-gap:6px}
  .blq > div:nth-child(2){grid-column:1/-1}
  .gpr{grid-template-columns:36px 1fr;row-gap:4px}
  .gpr .k2{grid-column:2}
  .acc{grid-template-columns:1fr;row-gap:4px}
  .sig{grid-template-columns:1fr 110px;row-gap:var(--s2)}
  .sig-e,.sig .k2{grid-column:1/-1}
}

/* ── 1 · MENOS TEXTO ───────────────────────────────────────── */

/* ── 2 · TIPOGRAFÍA DEL KIT ────────────────────────────────── */

.card-t,.tile .k,.tile .st,.mt-k,.gp3-m,.arh span,.tsum>div>span,.pgm span,
.pgm-l span,.cal-h,.sk-area b,.pg-h span,.ld-h span,.tm-h span,.ltv-h span,
.dg-lbl,.gen-i,.fnl-x span,.lec span,.mta-n span,.mta-t span,.ang-f i,
.sy-fa i,.bal b,.alg span,.ce-f b,.cf-key b,.cf-bl b,.cf-f b,.fmx-f span,

/* encabezado de vista: eyebrow → titular con una palabra en rojo → bajada */
.vhead{margin-bottom:20px;padding:6px 0 18px}
.vkick{margin-bottom:10px}
.vkick i{background:var(--danger);width:14px}
.vkick span{font:600 10.5px/1 var(--mono);letter-spacing:.24em;color:var(--low)}

.vread{font-size:14px;line-height:1.5;color:var(--mid);max-width:70ch;

/* separador de sección: eyebrow mono con regla */

/* ── 3 · CAJAS DE TAMAÑO FIJO ──────────────────────────────── */

.tile .f{font-size:11.5px;margin-top:8px}

/* toda caja interna: mismo radio, mismo aire, mismas alturas en su fila */
.mt,.lec,.fnl-x,.gp3,.ang,.fmx,.gen,.des,.cfg,.pgm,.arh,.tsum,.dg-lanes,.mta{

.mt-c,.lec>div,.fnl-x>div,.ang-c,.fmx-c,.gen-c,.des>div,.cf,.pgm>div,

/* filas de tabla: altura mínima pareja, texto recortado */

/* el título del bloque: nombre fuerte, bajada tenue, una sola línea */

<script>
(function(){
  var D = JSON.parse(document.getElementById('pvt-data').textContent);
  var esc = function(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var money = function(n){ return n.toLocaleString('es-CL'); };
  /* los logos viven embebidos: el panel no depende de la red para pintarlos */
  var LG=(function(){ try{ return JSON.parse(document.getElementById('pvt-logos').textContent); }
    catch(e){ return {}; } })();
  var PZ=(function(){ try{ return JSON.parse(document.getElementById('pvt-piezas').textContent); }
    catch(e){ return {}; } })();
  var ALIAS={ig:'instagram', wsp:'whatsapp', yt:'youtube', li:'linkedin',
    ntn:'notion', gh:'github', ftm:'fathom'};
  function logo(k, cls){
    var id=ALIAS[k]||String(k||'').toLowerCase().replace(/[^a-z]/g,'');
    if(!LG[id]) return '';
    return '<img class="lgo '+(cls||'')+'" src="'+LG[id]+'" alt="'+esc(id)+'" loading="lazy">';
  }
  /* chip con logo cuando existe, con inicial cuando no */
  function chip(nombre){
    var l=logo(nombre);
    return '<span class="chp">'+(l||'<i class="chp-d"></i>')+esc(nombre)+'</span>';
  }
  var STATE = { live:'Corre', mid:'Flojo', brk:'Roto', blind:'A ciegas' };
  var LINE = ['gold','blue','teal'];

  var NB=0, SVGID=0;
  /* cada bloque lleva número para poder nombrarlo, y se pliega desde la esquina */
  function card(t, inner){
    NB++; var n=(NB<10?'0':'')+NB;
    return '<details class="glass card" open><summary class="card-h">'
      + '<span class="card-nb">'+n+'</span>'
      + (function(){
          var tt=String(t||''), k=tt.indexOf(' — ');
          if(k<0) return '<span class="card-t">'+tt+'</span>';
          return '<span class="card-t">'+tt.slice(0,k)
            +'<em class="card-sub"> — '+tt.slice(k+3)+'</em></span>';
        })()
      + '<span class="card-cv">›</span></summary>'
      + '<div class="card-in">'+inner+'</div></details>'; }
  function tile(t){
    return '<div class="glass tile '+esc(t.s||'')+'"><div class="k">'+esc(t.k)+'</div>'
      + '<div class="n">'+esc(t.v)+(t.u?'<em>'+esc(t.u)+'</em>':'')+'</div>'
      + '<div class="f">'+esc(t.f)+'</div>'
      + (t.s?'<div class="st s-'+t.s+'">'+esc(STATE[t.s])+'</div>':'')+'</div>';
  }
  function tiles(a){ return '<div class="tiles">'+a.map(tile).join('')+'</div>'; }
  function meter(m,s){
    var h='<div class="meter'+(s==='live'?' live':s==='brk'?' brk':s==='blind'?' blind':'')+'">';
    for(var i=0;i<5;i++) h+='<i class="'+(i<m?'on':'')+'"></i>';
    return h+'</div>';
  }
  /* qué skills del OS operan esta pestaña */
  function skArea(id){
    var l=(D.skills_area||{})[id]; if(!l||!l.length) return '';
    return '<div class="sk-area"><b>Skills que operan esta vista</b>'
      + l.map(function(n){return '<span class="chip">'+esc(n)+'</span>'}).join('') + '</div>';
  }
  /* Barras verticales agrupadas con EJE COMPARTIDO.
     Escalar cada serie a su propio máximo hacía que 16 leads y 5 calls se
     vieran iguales: con eje común la caída del embudo se lee sola. */
  function delta(v,l){
    if(v==null) return '';
    var c=v>0?'up':v<0?'dn':'eq', t=v>0?'▲ +'+v:v<0?'▼ '+v:'=';
    return '<span class="dt '+c+'" title="'+esc(l||'')+'">'+t+'</span>';
  }
  /* kicker + título + lectura: tres niveles, no un bloque de texto suelto */
  function vhead(t,em,read){
    var fr=String(em||t), w=fr.split(' '), ult=w.pop();
    var tit=(w.length? esc(w.join(' '))+' ' : '')+'<span class="pv">'+esc(ult)+'</span>';
    tit=tit.charAt(0).toUpperCase()+tit.slice(1);
    return '<div class="vhead">'
      + '<div class="vkick"><i></i><span>'+esc(t)+'</span></div>'
      + '<h1 class="vtitle">'+tit+'</h1>'
      + '<p class="vread">'+esc(read)+'</p></div>';
  }

  /* ══ CRM · cómo vienen los leads ══ */
  function vCRM(){
    var C=D.crm;
    var barra=function(v,max,cls){
      return '<div class="bq"><i class="'+(cls||'')+'" style="width:'
        +Math.round(v/max*100)+'%"></i></div>'; };

    var cn=C.canales, mx=Math.max.apply(null,cn.filas.map(function(x){return x.total}));
    var ch='<div class="cnl-h"><span>Canal</span><span>Fichas</span><span>Pagaron</span>'
      +'<span>Tasa</span><span>Volumen</span><span>Qué pasa</span></div>';
    cn.filas.forEach(function(f){
      var t=f.total?Math.round(f.pago/f.total*100):0;
      ch+='<div class="cnl '+esc(f.e)+'"><div class="k1">'+esc(f.n)+'</div>'
        +'<div class="cnl-v">'+f.total+'</div>'
        +'<div class="cnl-v">'+f.pago+'</div>'
        +'<div class="cnl-t">'+t+'%</div>'
        +'<div>'+barra(f.total,mx,f.e)+'</div>'
        +'<div class="k2">'+esc(f.d)+'</div></div>';
    });
    ch+='<div class="concl"><b>Conclusión</b>'+esc(cn.concl)+'</div>';

    var et=C.etapas, me=Math.max.apply(null,et.filas.map(function(x){return x.v}));
    var eh='<div class="etp">'+et.filas.map(function(f){
      return '<div class="etp-c '+esc(f.e)+'"><div class="etp-v">'+f.v+'</div>'

  /* ── FUNNEL DE RATIOS ── */
  /* embudo real: el ancho de cada tramo es su volumen, y el trapecio
     entre tramos hace visible dónde se cae la gente */
  function funnelHTML(etapas){
    var e=etapas, N=e.length;
    var base=Math.max.apply(null,e.map(function(x){return x.v||0}))||1;
    var W=560, PAD=8, H_T=52, H_G=22, H=N*H_T+(N-1)*H_G+PAD*2;
    var an=function(v){ return Math.max(v/base,.055)*(W-PAD*2); };
    var COL={live:'var(--good)',mid:'var(--warn)',brk:'var(--danger)'};

    var ratios=e.map(function(x,i){
      return i===0?null:Math.round(x.v/e[i-1].v*100); });
    var worst=null;
    ratios.forEach(function(r,i){ if(r!=null&&(worst===null||r<ratios[worst])) worst=i; });

    var fid='funnel-'+(++SVGID);
    var fdet=e.map(function(x){ return x.n+': '+x.v; }).join('; ')
      +'. Conversión total: '+Math.round(e[N-1].v/e[0].v*100)+'%. Peor tramo: '
      + e[worst-1].n+' a '+e[worst].n+', '+ratios[worst]+'%.';
    var s2='<svg class="fnl" viewBox="0 0 '+W+' '+H+'" role="img" '
      +'aria-labelledby="'+fid+'-t '+fid+'-d" preserveAspectRatio="xMidYMid meet">'
      +'<title id="'+fid+'-t">Embudo comercial de lead a cierre</title>'
      +'<desc id="'+fid+'-d">'+esc(fdet)+'</desc>';
    e.forEach(function(x,i){
      var w=an(x.v), x0=(W-w)/2, y=PAD+i*(H_T+H_G), c=COL[x.e]||'var(--mid)';
      /* el cuerpo del tramo */
      s2+='<rect x="'+x0.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+H_T+'" '
        +'rx="5" fill="'+c+'" fill-opacity=".17" stroke="'+c+'" stroke-opacity=".55"/>';
      s2+='<text class="fnl-v" x="'+(W/2)+'" y="'+(y+23)+'" text-anchor="middle" fill="'+c+'">'
        +x.v+'</text>';
      s2+='<text class="fnl-n" x="'+(W/2)+'" y="'+(y+39)+'" text-anchor="middle">'
        +esc(x.n.toUpperCase())+'</text>';
      /* el trapecio de caída hacia el siguiente */
      if(i<N-1){
        var w2=an(e[i+1].v), x2=(W-w2)/2, y2=y+H_T, peor=(i+1===worst);
        s2+='<path d="M'+x0.toFixed(1)+' '+y2+' L'+(x0+w).toFixed(1)+' '+y2
          +' L'+(x2+w2).toFixed(1)+' '+(y2+H_G)+' L'+x2.toFixed(1)+' '+(y2+H_G)+' Z" '
          +'fill="'+(peor?'var(--danger)':'var(--border-hi)')+'" fill-opacity="'
          +(peor?'.20':'.12')+'"/>';
        s2+='<text class="fnl-r'+(peor?' worst':'')+'" x="'+(W-PAD)+'" y="'+(y2+15)+'" '
          +'text-anchor="end">'+ratios[i+1]+'%</text>';
        if(peor) s2+='<text class="fnl-w" x="'+PAD+'" y="'+(y2+15)+'">EL CUELLO</text>';
      }
    });
    s2+='</svg>';
    var perd=e[0].v-e[e.length-1].v;
    return '<div class="fnl-w2">'+s2+'</div>'
      +'<div class="fnl-x"><div><b>'+Math.round(e[e.length-1].v/e[0].v*100)+'%</b>'
      +'<span>Conversión total</span></div>'
      +'<div><b>'+perd+'</b><span>Leads perdidos en el camino</span></div>'
      +'<div class="no"><b>'+ratios[worst]+'%</b><span>El peor tramo: '
      +esc(e[worst-1].n)+' → '+esc(e[worst].n)+'</span></div></div>';
  }






  /* torta en SVG, sin librerías */
  function torta(datos, titulo){
    var tot=datos.reduce(function(a,b){return a+b.v},0)||1, ang=-Math.PI/2, R=52, C=60;
    var s='<svg class="pie-svg" viewBox="0 0 120 120" role="img" aria-label="'+esc(titulo)+'">';
    datos.forEach(function(d){
      if(!d.v) return;
      var a2=ang+(d.v/tot)*2*Math.PI;
      var x1=C+Math.cos(ang)*R, y1=C+Math.sin(ang)*R;
      var x2=C+Math.cos(a2)*R,  y2=C+Math.sin(a2)*R;
      var big=(a2-ang)>Math.PI?1:0;
      if(d.v===tot)
        s+='<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="'+esc(d.c)+'" opacity=".85"/>';
      else
        s+='<path d="M'+C+' '+C+' L'+x1.toFixed(1)+' '+y1.toFixed(1)
          +' A'+R+' '+R+' 0 '+big+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" fill="'
          +esc(d.c)+'" opacity=".85" stroke="var(--bg)" stroke-width="1.5"/>';
      ang=a2;
    });
    s+='<circle cx="'+C+'" cy="'+C+'" r="26" fill="var(--surface)"/>'
      +'<text x="'+C+'" y="'+(C+5)+'" text-anchor="middle" class="bv-m" '
      +'style="font-size:15px">'+tot+'</text></svg>';
    var leg='<div class="pie-l">'+datos.map(function(d){
      return '<div><i style="background:'+esc(d.c)+'"></i>'+esc(d.n)
        +'<b>'+d.v+'</b></div>'; }).join('')+'</div>';
    return '<div class="pie-w"><div class="pie-t">'+esc(titulo)+'</div>'+s+leg+'</div>';
  }




  /* ── PUNTO CERO — dónde estoy, cómo vengo, a dónde puedo llegar ── */

  /* el radar de los 8 sistemas: figura y nada más. Las etiquetas son
     legibles de lejos, que es para lo que sirve el radar. */
  /* Los iconos son los del Founder OS: se leen del bloque de datos, que el
     sync copia desde assets/sistemas.js. Nunca se dibujan a mano acá. */
  var SLUG={fnd:'foundations',ofr:'offer',avt:'avatar',mkt:'marketing',
            cap:'captura',vta:'ventas',ent:'entrega',suc:'success'};
  function icono(k){
    var g=(D.iconos||{})[SLUG[k]||k];
    if(!g) return '';
    return '<svg class="ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" '
      +'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + g + '</svg>';
  }

  /* ── PIEZAS COMPARTIDAS ──────────────────────────────────────
     chips()  lista compacta: donde cabía una fila caben cuatro
     figura() caja de gráfico con alto fijo, el patrón del Content OS
     serie()  histórico mes a mes, una métrica por caja           */
  function chips(arr,o){
    o=o||{};
    return '<div class="chps'+(o.cls?' '+o.cls:'')+'">'+arr.map(function(x){
      return '<div class="chp2 '+esc(x.e||'mid')+'">'
        +'<div class="chp2-h"><span class="dot '+esc(x.e||'mid')+'"></span>'
        +'<b>'+esc(x.n)+'</b></div>'
        +(x.v!==undefined&&x.v!==''?'<div class="chp2-v">'+esc(x.v)+'</div>':'')
        +(x.d?'<p>'+esc(x.d)+'</p>':'')+'</div>'; }).join('')+'</div>';
  }
  function figura(cap,svg,pie){
    return '<div class="ch"><span class="cap">'+esc(cap)+'</span>'
      +'<div class="fig">'+svg+'</div>'
      +(pie?'<div class="ch-p">'+esc(pie)+'</div>':'')+'</div>';
  }
  /* histórico: barras con eje, el último mes marcado y lo proyectado rayado */
  function serie(datos,o){
    o=o||{}; var W=400,H=210,P=26,B=26;
    var max=Math.max.apply(null,datos.map(function(x){return x.v}))||1;
    var paso=(W-P*2)/datos.length, an=Math.min(paso*.56,34);
    /* el lector de pantalla recibe la serie completa sin texto en pantalla */
    var sid='serie-'+(++SVGID);
    var det=datos.map(function(x){
      return x.m+': '+(o.fmt?o.fmt(x.v):x.v)+(x.proy?' proyectado':''); }).join('; ');
    var g='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" '
      +'aria-labelledby="'+sid+'-t '+sid+'-d">'
      +'<title id="'+sid+'-t">'+esc(o.alt||'Serie mensual')+'</title>'
      +'<desc id="'+sid+'-d">'+esc(det)+'</desc>';
    [0,.5,1].forEach(function(f){
      var y=H-B-(H-B-14)*f;
      g+='<line class="sr-g" x1="'+P+'" y1="'+y.toFixed(1)+'" x2="'+(W-P)+'" y2="'+y.toFixed(1)+'"/>'
        +'<text class="sr-a" x="'+(P-5)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'
        + (o.fmt?o.fmt(max*f):Math.round(max*f)) +'</text>';
    });
    datos.forEach(function(x,i){
      var h=Math.max((H-B-14)*(x.v/max),1), cx=P+paso*i+paso/2, y=H-B-h;
      g+='<rect class="sr-b'+(x.proy?' proy':'')+(i===o.hoy?' hoy':'')+'" x="'+(cx-an/2).toFixed(1)
        +'" y="'+y.toFixed(1)+'" width="'+an.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/>'
        +'<text class="sr-v'+(i===o.hoy?' hoy':'')+'" x="'+cx.toFixed(1)+'" y="'+(y-5).toFixed(1)
        +'" text-anchor="middle">'+(o.fmt?o.fmt(x.v):x.v)+'</text>'
        +'<text class="sr-m" x="'+cx.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'
        +esc(x.m)+'</text>';
    });
    return g+'</svg>';
  }

  function radarOcho(){
    var A=D.sistemas.areas, N=A.length, W=460, C=W/2, R=W*.355, PX=92, PY=40;
    var pt=function(i,v){ var a=-Math.PI/2+i*2*Math.PI/N;
      return [C+Math.cos(a)*R*v, C+Math.sin(a)*R*v]; };
    var poly=function(f){ return A.map(function(x,i){
      var q=pt(i,f(x)); return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' '); };
    var rid='radar-'+(++SVGID);
    var rdet=A.map(function(x){
      return x.n+': hoy '+Math.round(x.v*100)+', objetivo '+Math.round(x.t*100); }).join('; ');
    var g='<svg class="r8" viewBox="'+(-PX)+' '+(-PY)+' '+(W+PX*2)+' '+(W+PY*2)+'" '
      +'role="img" aria-labelledby="'+rid+'-t '+rid+'-d">'
      +'<title id="'+rid+'-t">Estado de los ocho sistemas</title>'
      +'<desc id="'+rid+'-d">'+esc(rdet)+'</desc>';
    [.25,.5,.75,1].forEach(function(v){
      g+='<polygon class="rx-grid" points="'+poly(function(){return v})+'"/>'; });
    A.forEach(function(_,i){ var q=pt(i,1);
      g+='<line class="rx-spoke" x1="'+C+'" y1="'+C+'" x2="'+q[0].toFixed(1)
        +'" y2="'+q[1].toFixed(1)+'"/>'; });
    g+='<polygon class="rx-target" points="'+poly(function(x){return x.t})+'"/>';
    g+='<polygon class="rx-now" points="'+poly(function(x){return x.v})+'"/>';
    A.forEach(function(x,i){
      var q=pt(i,x.v), lp=pt(i,1.24), a=-Math.PI/2+i*2*Math.PI/N, cx=Math.cos(a);
      var an=Math.abs(cx)<.25?'middle':(cx>0?'start':'end');
      g+='<circle class="rx-dot '+esc(x.e)+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4.5"/>'
        +'<text class="r8-l" x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="'+an+'">'
        +esc(x.n)+'</text>'
        +'<text class="r8-v '+esc(x.e)+'" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+20).toFixed(1)
        +'" text-anchor="'+an+'">'+Math.round(x.v*100)+'<tspan class="r8-t"> / '
        +Math.round(x.t*100)+'</tspan></text>';
    });
    g+='</svg>';
    return '<div class="ch r8-w"><div class="fig">'+g+'</div>'
      +'<div class="legend ctr"><span><i></i>Hoy</span><span><i class="t"></i>Objetivo</span></div></div>';
  }

  function vOS(){
    var SI=D.sistemas, A=SI.areas;
    var gap=function(a){ return Math.round((a.t-a.v)*100); };
    var peor=A.reduce(function(m,a){ return gap(a)>gap(m)?a:m; }, A[0]);
