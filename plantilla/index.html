<style>
:root{
  /* paleta heredada de Athlete OS — mismo OS, mismo lenguaje */
  --bg:#0B0C0F;
  --surface:#14161B; --surface2:#1A1D24; --surface3:#20242C;
  --border:#252932; --border-hi:#363B45;
  --gold:#D8A847; --gold-dim:#8C7438; --gold-glow:rgba(216,168,71,.12);
  --hi:#F2EFE6; --mid:#A9ADB4; --low:#5F636B;
  --good:#4ADE80; --danger:#E5484D; --warn:#E8B339;
  --blue:#5B9BD5; --teal:#4EC3A8;

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  /* ESCALA TIPOGRÁFICA — rangos fijos, nada fuera de esta lista */
  --t-micro:10px;  /* labels de campo, códigos */
  --t-xs:11.5px;   /* metadata secundaria */
  --t-s:12.5px;    /* descripciones de fila */
  --t-m:13.5px;    /* nombres, cuerpo compacto */
  --t-l:15px;      /* lectura */
  --t-xl:17px;     /* subtítulo de bloque */
  --n-s:24px; --n-m:32px;   /* números */

  /* ESPACIADO — múltiplos de 4, nada suelto */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;

  --r-s:10px; --r-m:14px; --r-l:20px; --r-pill:999px;
  --gut:clamp(20px,4vw,56px);
  --maxw:1280px;
  --navh:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--hi);font-family:var(--sans);
  font-variant-numeric:tabular-nums;min-height:100vh;position:relative;
  font-size:var(--t-m);line-height:1.5}

/* ── ATMÓSFERA ── */
.atm{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.atm i{position:absolute;display:block;border-radius:50%;will-change:transform}
.p1{width:70vw;height:60vh;right:-18vw;top:-20vh;background:rgba(91,155,213,.07);
  filter:blur(70px);animation:d1 48s ease-in-out infinite alternate}
.p2{width:30vw;height:26vh;left:-8vw;bottom:-10vh;background:rgba(216,168,71,.12);
  filter:blur(52px);animation:d2 39s ease-in-out infinite alternate}
.p3{width:60vw;height:40vh;left:-10vw;bottom:-18vh;background:rgba(216,168,71,.05);
  filter:blur(64px);animation:d3 55s ease-in-out infinite alternate}
@keyframes d1{from{transform:translate3d(0,0,0)}to{transform:translate3d(-4vw,3vh,0) scale(1.1)}}
@keyframes d2{from{transform:translate3d(0,0,0)}to{transform:translate3d(5vw,-2vh,0) scale(1.12)}}
@keyframes d3{from{transform:translate3d(0,0,0)}to{transform:translate3d(3vw,-4vh,0) scale(1.07)}}
@media(prefers-reduced-motion:reduce){.atm i{animation:none}}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.03;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* ── SUPERFICIE PLANA ── el glass teñía el borde y lo rompía visualmente ── */
.glass{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-m);transition:border-color .15s;min-width:0}
.glass:hover{border-color:var(--border-hi)}

/* ── NAV FIJA ── */
.topnav{position:fixed;top:0;left:0;right:0;z-index:20;
  background:rgba(11,12,15,.80);backdrop-filter:blur(22px) saturate(130%);
  -webkit-backdrop-filter:blur(22px) saturate(130%);
  border-bottom:1px solid var(--border)}
.topnav-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:var(--s4);min-height:var(--navh)}
.brand{display:flex;align-items:baseline;gap:var(--s2);min-width:0}
.brand b{font-size:var(--t-m);font-weight:700;letter-spacing:.10em;color:var(--hi);white-space:nowrap}
.navdate{font-size:var(--t-micro);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--low);white-space:nowrap;text-align:right}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;position:relative;
  padding:4px;border-radius:var(--r-pill);
  background:var(--surface2);border:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
/* el indicador se desliza entre pestañas en vez de saltar */
.slider{position:absolute;top:4px;bottom:4px;border-radius:var(--r-pill);
  background:var(--gold);transition:left .34s cubic-bezier(.2,.8,.25,1),
  width .34s cubic-bezier(.2,.8,.25,1);z-index:0;pointer-events:none}
.tabs button{appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:inherit;color:var(--mid);white-space:nowrap;position:relative;z-index:1;
  padding:9px var(--s4);border-radius:var(--r-pill);
  font-size:var(--t-l);font-weight:600;letter-spacing:-.005em;
  transition:color .22s;display:flex;align-items:baseline;gap:7px}
.tabs button:hover{color:var(--hi)}
.tabs button.on{color:#0B0C0F}
.tabs .tn{font-size:var(--t-micro);font-weight:700;letter-spacing:.06em;opacity:.45}
.tabs button.on .tn{opacity:.5}

.wrap{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;
  padding:calc(var(--navh) + var(--s7)) var(--gut) var(--s6)}

/* ── CABECERA DE VISTA ── */
.vhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s7);
  align-items:end;margin-bottom:var(--s5)}
.vtitle{font-size:clamp(24px,min(3.2vh,3.4vw),38px);line-height:.92;font-weight:700;
  letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap}
.vtitle em{font-style:normal;color:var(--low)}
.vread{font-size:var(--t-xl);font-weight:400;line-height:1.6;color:var(--mid);
  max-width:74ch;padding-bottom:2px}

/* ── BLOQUES ── */
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.card{padding:var(--s4) var(--s5)}
.card-t{font-size:var(--t-micro);font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s3)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s3)}
.tiles.eight{margin-bottom:0;row-gap:var(--s3)}
.tile{padding:var(--s4)}
.tile .k{font-size:var(--t-micro);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s2);line-height:1.4}
.tile .n{font-size:var(--n-m);font-weight:700;letter-spacing:-.03em;line-height:1}
.tile .n em{font-style:normal;font-size:.44em;font-weight:500;letter-spacing:.01em;
  margin-left:3px;color:var(--mid)}
.tile .f{margin-top:var(--s2);font-size:var(--t-xs);color:var(--mid);line-height:1.45}
.tile .st{margin-top:var(--s2);font-size:var(--t-micro);font-weight:600;
  letter-spacing:.10em;text-transform:uppercase}
.s-live{color:var(--good)}.s-mid{color:var(--mid)}
.s-brk{color:var(--danger)}.s-blind{color:var(--low)}

/* ── RADAR ── */
.radar-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:var(--s6);align-items:center}
.radar-wrap > div{min-width:0}
.radar-svg{width:100%;height:auto;display:block;margin:0 auto;
  max-width:min(100%,560px)}
.rx-grid{fill:none;stroke:var(--border-hi);stroke-width:1;opacity:.6}
.rx-spoke{stroke:var(--border);stroke-width:1}
.rx-target{fill:none;stroke:var(--gold-dim);stroke-width:1;stroke-dasharray:3 4}
.rx-now{fill:var(--gold-glow);stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round}
.rx-dot{fill:var(--gold)}.rx-dot.brk{fill:var(--danger)}
.rx-lbl{font-family:var(--sans);font-size:var(--t-s);font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;fill:var(--hi)}
.rx-val{font-family:var(--sans);font-size:var(--t-xs);font-weight:700;fill:var(--gold)}
.legend{display:flex;gap:var(--s4);margin-bottom:var(--s3);
  font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low)}
.legend i{display:inline-block;width:14px;height:2px;margin-right:6px;
  vertical-align:middle;background:var(--gold);border-radius:2px}
.legend i.t{background:none;border-top:1px dashed var(--gold-dim);height:0}

/* ── FILAS ── */
.rw{display:grid;align-items:center;gap:var(--s4);
  padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.rw:last-child{border-bottom:0}
.rw-ax{grid-template-columns:100px 58px 1fr}
.rw-tr{grid-template-columns:22px 1fr 78px 92px}
.rw-ar{grid-template-columns:22px 1.05fr 132px 92px 1.7fr}
.rw-sy{grid-template-columns:18px 1.05fr 1fr 1.7fr}
.rw-ch{grid-template-columns:112px 1fr 82px 44px}
.k1{font-size:var(--t-m);font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.k2{font-size:var(--t-s);color:var(--mid);line-height:1.45}
.k3{font-size:var(--t-xs);color:var(--low)}
.num{font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em;text-align:right}
.idx{font-size:var(--t-micro);font-weight:600;color:var(--low)}
.rw.brk .idx{color:var(--danger)}
.rw.brk{box-shadow:inset 2px 0 0 var(--danger);padding-left:var(--s3);margin-left:-14px}
.ax-v{font-size:var(--t-l);font-weight:700;letter-spacing:-.02em;text-align:right}
.ax-v.low{color:var(--danger)}

.meter{display:flex;gap:3px}
.meter i{flex:1;height:7px;border-radius:2px;background:var(--surface3);display:block}
.meter i.on{background:var(--mid)}
.meter.live i.on{background:var(--good)}
.meter.brk i.on{background:var(--danger)}
.meter.blind i{background:var(--surface2);
  background-image:repeating-linear-gradient(115deg,transparent 0 3px,rgba(255,255,255,.13) 3px 6px)}

.dot{width:7px;height:7px;border-radius:50%;background:var(--low)}
.dot.live{background:var(--good);box-shadow:0 0 8px rgba(74,222,128,.55)}
.dot.mid{background:var(--mid)}
.dot.brk{background:var(--danger);box-shadow:0 0 8px rgba(229,72,77,.55)}
.dot.blind{background:var(--low)}

.bar{height:9px;border-radius:var(--r-pill);background:var(--surface3);
  position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-pill);
  background:var(--mid);display:block}
.bar i.gold{background:var(--gold)}
.bar i.dgr{background:var(--danger)}

.note{margin-top:var(--s3);font-size:var(--t-xs);color:var(--low);line-height:1.55}

/* ── TENDENCIA · un solo gráfico, cada cifra una vez ── */
.trend-svg{width:100%;height:auto;display:block;max-height:min(38vh,300px)}
.tg-grid{stroke:var(--border);stroke-width:1}
.tg-axis{font-family:var(--sans);font-size:var(--t-micro);font-weight:600;
  letter-spacing:.10em;text-transform:uppercase;fill:var(--low)}
.tg-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tg-val{font-family:var(--sans);font-size:var(--t-xs);font-weight:700;fill:var(--hi)}
.tkey{display:flex;gap:var(--s5);flex-wrap:wrap;margin-bottom:var(--s3)}
.tkey span{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--mid);display:flex;align-items:center;gap:6px}
.tkey i{width:14px;height:2px;border-radius:2px;display:inline-block}
.rev{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s3)}
.rev div{text-align:center}
.rev .m{font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s1)}
.rev .v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em}
.rev .v.zero{color:var(--low)}
.rev .v.gold{color:var(--gold)}

/* ── CONTRATOS ── */
.ct{display:grid;grid-template-columns:1.3fr 92px 1fr 80px;gap:var(--s4);
  align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.ct:last-child{border-bottom:0}

/* ── TERRITORIOS DE CONTENIDO ── */
.ikigai{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.ike{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.ike.core{border-color:var(--gold-dim);
  background:linear-gradient(160deg,var(--gold-glow),var(--surface))}
.ike .n{font-size:var(--t-m);font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;margin-bottom:var(--s2)}
.ike.core .n{color:var(--gold)}
.ike .d{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.ike .r{margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--border);
  font-size:var(--t-xs);color:var(--low);line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{font-size:var(--t-xs);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:5px 12px;color:var(--mid);white-space:nowrap;background:var(--surface2)}
.chip.off{color:var(--low);border-style:dashed}

.chain{display:flex;align-items:stretch;gap:var(--s2);flex-wrap:wrap}
.chain-i{flex:1 1 0;min-width:118px;padding:var(--s3);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border)}
.chain-i:last-child{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.07)}
.chain-i .n{font-size:var(--t-s);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.chain-i .d{margin-top:var(--s1);font-size:var(--t-xs);color:var(--mid);line-height:1.45}

.skillrow{display:grid;grid-template-columns:44px 1fr;gap:var(--s4);align-items:center;
  padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.skillrow:last-child{border-bottom:0}
.skillrow .m{font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low)}
.skillrow .m b{display:block;margin-top:2px;font-size:var(--t-xl);color:var(--hi)}

.foot{max-width:var(--maxw);margin:0 auto;padding:var(--s5) var(--gut) var(--s6);
  display:flex;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;
  font-size:var(--t-micro);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--low);position:relative;z-index:2}
.fresh{display:flex;gap:var(--s4);flex-wrap:wrap}
.fresh i{display:inline-block;width:4px;height:4px;border-radius:50%;
  margin-right:5px;vertical-align:middle;background:var(--good)}
.fresh i.lag{background:var(--warn)}.fresh i.none{background:var(--low)}

.view{display:none}.view.on{display:block;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── FUNNEL DE RATIOS ── */
.fn{display:flex;flex-direction:column;gap:2px}
.fnr{display:grid;grid-template-columns:112px 1fr 92px;gap:var(--s4);align-items:center}
.fn-n{font-size:var(--t-m);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.fn-n span{display:block;font-size:var(--t-xs);font-weight:400;color:var(--low);
  text-transform:none;letter-spacing:0;margin-top:2px}
.fn-bar{height:30px;border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);position:relative;overflow:hidden;
  display:flex;align-items:center}
.fn-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,
  rgba(216,168,71,.9),rgba(216,168,71,.45));display:block;border-radius:var(--r-s)}
.fn-bar.nil{background-image:repeating-linear-gradient(115deg,
  transparent 0 5px,rgba(255,255,255,.06) 5px 10px)}
.fn-bar b{position:relative;z-index:1;padding-left:var(--s3);
  font-size:var(--t-l);font-weight:700;color:var(--hi)}
.fn-bar.nil b{color:var(--low)}
.fn-rt{text-align:right;font-size:var(--t-l);font-weight:700;letter-spacing:-.02em}
.fn-rt span{display:block;font-size:var(--t-micro);font-weight:600;color:var(--low);
  letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.fn-rt.worst{color:var(--danger)}
.fn-gap{height:14px;margin-left:112px;border-left:1px dashed var(--border-hi);width:1px}

/* ── CLIENTES ── */
.cli{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);display:grid;
  grid-template-columns:1.15fr 88px 1fr 1.35fr;gap:var(--s4);align-items:center}
.cli + .cli{margin-top:var(--s2)}
.cli.brk{border-color:rgba(229,72,77,.3)}
.cli.live{border-color:rgba(74,222,128,.28)}
.cli-h .k1{font-size:var(--t-l)}
.cli-p{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.cli-x{font-size:var(--t-s);line-height:1.5}
.cli-x b{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:3px}
.ccbar{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);align-items:end;
  height:96px;margin-bottom:var(--s3)}
.ccb{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.ccb i{display:block;border-radius:var(--r-s) var(--r-s) 0 0;background:var(--gold);width:100%}
.ccb i.zero{background:var(--surface3);height:3px!important}
.ccb .v{font-size:var(--t-l);font-weight:700;margin-bottom:var(--s1);text-align:center}
.ccb .m{font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--low);text-align:center;margin-top:var(--s2)}

/* ── CANALES ── */
.cn{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.cn + .cn{margin-top:var(--s2)}
.cn.hot{border-color:var(--gold-dim);background:linear-gradient(160deg,var(--gold-glow),var(--surface))}
.cn-top{display:grid;grid-template-columns:1fr repeat(3,84px);gap:var(--s4);
  align-items:baseline;margin-bottom:var(--s3)}
.cn-n{font-size:var(--t-xl);font-weight:700;letter-spacing:-.015em}
.cn-m{text-align:right}
.cn-m b{display:block;font-size:var(--t-l);font-weight:700;letter-spacing:-.02em}
.cn-m span{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--low);margin-top:2px}
.cn-m.gold b{color:var(--gold)}
.cn-txt{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);
  padding-top:var(--s3);border-top:1px solid var(--border)}
.cn-txt div b{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s1)}
.cn-txt div p{font-size:var(--t-s);color:var(--mid);line-height:1.55}

/* ── IKIGAI ── */
.ik-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);
  gap:var(--s6);align-items:center}
.ik-wrap > div{min-width:0}
.ik-svg{width:100%;height:auto;display:block;max-width:min(100%,470px);min-width:0;margin:0 auto}
.ik-c{fill-opacity:.13;stroke-width:1.5}
.ik-lbl{font-family:var(--sans);font-size:var(--t-s);font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;fill:var(--hi)}
.ik-sub{font-family:var(--sans);font-size:var(--t-micro);fill:var(--mid)}
.ik-core{font-family:var(--sans);font-size:var(--t-m);font-weight:700;fill:var(--gold)}
.ik-pair{font-family:var(--sans);font-size:var(--t-micro);font-weight:600;fill:var(--low)}
.ik-side .core{padding:var(--s4);border-radius:var(--r-s);
  border:1px solid var(--gold-dim);background:linear-gradient(160deg,var(--gold-glow),var(--surface));
  margin-bottom:var(--s3)}
.ik-side .core b{font-size:var(--t-xl);color:var(--gold);display:block;margin-bottom:var(--s2)}
.ik-side .core p{font-size:var(--t-s);color:var(--mid);line-height:1.55}
.ik-p{display:grid;grid-template-columns:150px 1fr;gap:var(--s3);
  padding:var(--s2) 0;border-bottom:1px solid var(--border)}
.ik-p:last-child{border-bottom:0}
.ik-p b{font-size:var(--t-s);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.ik-p span{font-size:var(--t-s);color:var(--mid);line-height:1.5}

/* ── GAPS ── */
.gp{display:grid;grid-template-columns:26px 1.1fr 1.35fr 1fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.gp:last-child{border-bottom:0}
.gp-p{font-size:var(--t-m);font-weight:700;color:var(--low)}
.gp.brk .gp-p{color:var(--danger)}
.gp-d{font-size:var(--t-s);color:var(--gold)}

/* ── ORIGEN / TIEMPO / DIAGNÓSTICO ── */
.og{display:grid;grid-template-columns:132px 54px 1fr;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.og:last-child{border-bottom:0}
.og-v{font-size:var(--n-s);font-weight:700;letter-spacing:-.03em;text-align:right}
.og-v.brk{color:var(--danger)}
.og-bar{height:6px;border-radius:var(--r-pill);background:var(--surface3);
  margin-top:var(--s2);overflow:hidden}
.og-bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--mid)}
.og-bar i.brk{background:var(--danger)}

.tm{display:grid;grid-template-columns:150px 78px 84px 78px 1fr;gap:var(--s4);
  align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.tm:last-child{border-bottom:0}
.tm-v{font-size:var(--t-l);font-weight:700;letter-spacing:-.02em;text-align:right}
.tm-v.live{color:var(--good)}.tm-v.brk{color:var(--danger)}
.tm-h{display:grid;grid-template-columns:150px 78px 84px 78px 1fr;gap:var(--s4);
  padding-bottom:var(--s2);border-bottom:1px solid var(--border-hi);
  font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low)}
.tm-h span:not(:first-child):not(:last-child){text-align:right}

.dg{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);border-left:3px solid var(--danger)}
.dg.live{border-left-color:var(--good)}
.dg + .dg{margin-top:var(--s2)}
.dg-top{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3);flex-wrap:wrap}
.sev{display:flex;gap:3px;margin-left:auto}
.sev i{width:16px;height:6px;border-radius:2px;background:var(--surface3);display:block}
.sev i.on{background:var(--danger)}
.dg.live .sev i.on{background:var(--good)}
.dg-tr{font-size:var(--t-xl);font-weight:700;letter-spacing:-.015em}
.dg-cul{font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--danger);border:1px solid rgba(229,72,77,.35);border-radius:var(--r-pill);
  padding:3px 10px}
.dg.live .dg-cul{color:var(--good);border-color:rgba(74,222,128,.35)}
.dg-b{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.dg-b div b{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--low);margin-bottom:var(--s1)}
.dg-b div p{font-size:var(--t-l);color:var(--mid);line-height:1.5}
.concl{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--border);
  font-size:var(--t-xl);color:var(--hi);line-height:1.6}
.concl b{color:var(--gold);font-weight:600;display:block;font-size:var(--t-micro);
  letter-spacing:.10em;text-transform:uppercase;margin-bottom:var(--s2)}

/* ── SKILLS POR PESTAÑA ── */
.sk-area{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-s);
  background:var(--surface2);border:1px solid var(--border)}
.sk-area b{font-size:var(--t-micro);font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;color:var(--low);white-space:nowrap}

/* ── ESCALERA SOP → AGENTE ── */
.esc{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.esc-s{padding:var(--s4);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border);position:relative}
.esc-s.brk{border-color:rgba(229,72,77,.35)}
.esc-s.live{border-color:rgba(74,222,128,.3)}
.esc-n{font-size:var(--t-m);font-weight:700;letter-spacing:.10em;margin-bottom:var(--s2)}
.esc-v{font-size:var(--n-m);font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:var(--s2)}
.esc-s.live .esc-v{color:var(--good)}
.esc-s.brk .esc-v{color:var(--danger)}
.esc-d{font-size:var(--t-s);color:var(--mid);line-height:1.5}
.esc-e{margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--border);
  font-size:var(--t-xs);color:var(--low);line-height:1.45}
.esc-ar{position:absolute;right:-11px;top:50%;transform:translateY(-50%);
  color:var(--low);font-size:var(--t-l);z-index:1}

/* ── INVENTARIO DE SKILLS ── */
.inv{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.inv-i{display:grid;grid-template-columns:104px 1fr 74px;gap:var(--s3);align-items:center;
  padding:var(--s2) var(--s3);border-radius:var(--r-s);background:var(--surface2);
  border:1px solid var(--border)}
.inv-n{font-size:var(--t-m);font-weight:700}
.inv-c{font-size:var(--t-micro);font-weight:600;letter-spacing:.08em;text-transform:uppercase;

<script>
(function(){
  var D = JSON.parse(document.getElementById('pvt-data').textContent);
  var esc = function(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var money = function(n){ return n.toLocaleString('es-CL'); };
  var STATE = { live:'Corre', mid:'Flojo', brk:'Roto', blind:'A ciegas' };
  var LINE = ['gold','blue','teal'];

  function card(t, inner){ return '<div class="glass card">'
    + (t?'<div class="card-t">'+esc(t)+'</div>':'') + inner + '</div>'; }
  function tile(t){
    return '<div class="glass tile"><div class="k">'+esc(t.k)+'</div>'
      + '<div class="n">'+esc(t.v)+(t.u?'<em>'+esc(t.u)+'</em>':'')+'</div>'
      + '<div class="f">'+esc(t.f)+'</div>'
      + (t.s?'<div class="st s-'+t.s+'">'+esc(STATE[t.s])+'</div>':'')+'</div>';
  }
  function tiles(a){ return '<div class="tiles">'+a.map(tile).join('')+'</div>'; }
  function meter(m,s){
    var h='<div class="meter'+(s==='live'?' live':s==='brk'?' brk':s==='blind'?' blind':'')+'">';
    for(var i=0;i<5;i++) h+='<i class="'+(i<m?'on':'')+'"></i>';
    return h+'</div>';
  }
  /* qué skills del OS operan esta pestaña */
  function skArea(id){
    var l=(D.skills_area||{})[id]; if(!l||!l.length) return '';
    return '<div class="sk-area"><b>Skills que operan esta vista</b>'
      + l.map(function(n){return '<span class="chip">'+esc(n)+'</span>'}).join('') + '</div>';
  }
  /* Barras verticales agrupadas con EJE COMPARTIDO.
     Escalar cada serie a su propio máximo hacía que 16 leads y 5 calls se
     vieran iguales: con eje común la caída del embudo se lee sola. */
  function barrasV(meses, series, opt){
    opt=opt||{};
    var W=760, H=opt.h||260, L=44, R=16, T=22, B=42;
    var iw=W-L-R, ih=H-T-B, N=meses.length, S=series.length;
    var max=0;
    meses.forEach(function(m){ series.forEach(function(se){
      max=Math.max(max, m[se.k]||0); }); });
    max=max||1;
    var esc_=Math.pow(10,Math.floor(Math.log10(max)));
    var tope=Math.ceil(max/esc_)*esc_;
    var gw=iw/N, bw=Math.min((gw-18)/S, 44);
    var y=function(v){ return T+ih-(v/tope)*ih; };
    var out='<svg viewBox="0 0 '+W+' '+H+'" class="bv" role="img" aria-label="'
      +esc(opt.alt||'Series por mes')+'">';
    [0,.5,1].forEach(function(f){
      var yy=(T+ih-f*ih).toFixed(1);
      out+='<line class="tg-grid" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/>'
        +'<text class="tg-axis" x="'+(L-9)+'" y="'+(+yy+4)+'" text-anchor="end">'
        +(opt.money?'$'+money(Math.round(tope*f)):Math.round(tope*f))+'</text>';
    });
    meses.forEach(function(m,mi){
      var gx=L+mi*gw, cx=gx+gw/2, tot=S*bw+(S-1)*4, x0=cx-tot/2;
      series.forEach(function(se,si){
        var v=m[se.k]||0, bx=x0+si*(bw+4), by=y(v), bh=T+ih-by;
        if(v>0){
          out+='<rect class="bv-b'+(m.parcial?' parcial':'')+'" x="'+bx.toFixed(1)+'" y="'
            +by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,2).toFixed(1)
            +'" rx="3" fill="var(--'+se.c+')"/>';
          out+='<text class="bv-v" x="'+(bx+bw/2).toFixed(1)+'" y="'+(by-7).toFixed(1)
            +'" text-anchor="middle" fill="var(--'+se.c+')">'
            +(opt.money?'$'+money(v):v)+'</text>';
        } else {
          out+='<line class="bv-z" x1="'+bx.toFixed(1)+'" y1="'+(T+ih)+'" x2="'
            +(bx+bw).toFixed(1)+'" y2="'+(T+ih)+'"/>';
          out+='<text class="bv-v zero" x="'+(bx+bw/2).toFixed(1)+'" y="'+(T+ih-7)
            +'" text-anchor="middle">0</text>';
        }
      });
      out+='<text class="bv-m" x="'+cx.toFixed(1)+'" y="'+(H-16)+'" text-anchor="middle">'
        +esc(m.m)+'</text>';
      if(m.parcial)
        out+='<text class="bv-sub" x="'+cx.toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">en curso</text>';
    });
    var key='<div class="bg-key">'+series.map(function(se){
      return '<span><i style="background:var(--'+se.c+')"></i>'+esc(se.n)+'</span>'; }).join('')+'</div>';
    return key+out+'</svg>';
  }

  /* ── RADAR ── */
  function vRadar(){
    var r=D.radar, ejes=r.areas, W=430, C=W/2, R=W*.31, N=ejes.length, PX=64, PY=12;
    var pt=function(i,v){ var a=-Math.PI/2+i*2*Math.PI/N;
      return [C+Math.cos(a)*R*v, C+Math.sin(a)*R*v]; };
    var poly=function(vals){ return vals.map(function(v,i){
      var p=pt(i,v); return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' '); };
    var s='<svg class="radar-svg" viewBox="'+(-PX)+' '+(-PY)+' '+(W+PX*2)+' '+(W+PY*2)+'" '
      +'role="img" aria-label="Radar de areas: hoy contra objetivo">';
    [.25,.5,.75,1].forEach(function(v){
      s+='<polygon class="rx-grid" points="'+poly(ejes.map(function(){return v}))+'"/>'; });
    ejes.forEach(function(_,i){ var p=pt(i,1);
      s+='<line class="rx-spoke" x1="'+C+'" y1="'+C+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'; });
    s+='<polygon class="rx-target" points="'+poly(ejes.map(function(e){return e.t}))+'"/>';
    s+='<polygon class="rx-now" points="'+poly(ejes.map(function(e){return e.v}))+'"/>';
    ejes.forEach(function(e,i){
      var p=pt(i,e.v), brk=(e.t-e.v)>=.45;
      s+='<circle class="rx-dot'+(brk?' brk':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(brk?4:3)+'"/>';
      var lp=pt(i,1.30), a=-Math.PI/2+i*2*Math.PI/N, cx=Math.cos(a);
      var an=Math.abs(cx)<.25?'middle':(cx>0?'start':'end');
      s+='<text class="rx-lbl" x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="'+an+'">'+esc(e.n.toUpperCase())+'</text>'
        +'<text class="rx-val" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+11).toFixed(1)+'" text-anchor="'+an+'">'+Math.round(e.v*100)+'</text>';
    });
    s+='</svg>';
    var ax='<div class="legend"><span><i></i>Hoy</span><span><i class="t"></i>Objetivo</span></div>';
    ejes.forEach(function(e){
      var low=(e.t-e.v)>=.45;

        +'<div class="ax-v'+(low?' low':'')+'">'+Math.round(e.v*100)+' / '+Math.round(e.t*100)+'</div>'
        +'<div class="k2">'+esc(e.nota)+'</div></div>';
    });
    var ar='';
    (r.areas||[]).forEach(function(x){
      var fh='';
      (x.falta||[]).forEach(function(f){
        fh+='<div class="fl '+esc(f.e)+'"><span class="fl-i"></span>'
          +'<div class="fl-q">'+esc(f.q)+'</div>'
          +'<div class="fl-d">'+esc(f.d)+'</div></div>';
      });
      ar+='<details class="ar'+(x.e==='brk'?' brk':'')+'"><summary>'
        +'<div class="idx">'+esc(x.i)+'</div><div class="k1">'+esc(x.n)+'</div>'
        +'<div class="k3">'+esc(x.et)+'<span class="ar-sc">'+Math.round(x.v*100)
        +' / '+Math.round(x.t*100)+'</span></div>'
        +'<div>'+meter({live:5,mid:3,brk:1,blind:0}[x.e],x.e)+'</div>'
        +'<div class="k2">'+esc(x.r)+'</div>'
        +'<div class="ar-cv">›</div></summary>'
        +'<div class="ar-body">'+fh+'</div></details>';
    });
    var nx=D.next, nh='';
    (nx.items||[]).forEach(function(x,i){
      nh+='<div class="ns"><div class="ns-n">'+(i+1)+'</div>'
        +'<div class="ns-t">'+esc(x.n)+'</div>'

        +'<div class="k2">'+esc(x.por)+'</div>'
        +'<div class="ns-q">'+esc(x.q)+'</div></div>';

      + '<div class="stack">'
      + card('Fuerza por área — hoy contra objetivo',
             '<div class="radar-wrap"><div>'+s+'</div><div>'+ax+'</div></div>')
      + card('Las 8 áreas — abre cada una para ver qué falta',
             ar + '<div class="concl"><b>Conclusión</b>'+esc(r.areas_lectura||'')+'</div>')

  /* ── FUNNEL DE RATIOS ── */
  function funnelHTML(etapas){
    var e=etapas;
    var base=Math.max.apply(null,e.map(function(x){return x.v||0}))||1;
    /* el peor ratio marca el cuello de eficiencia */
    var ratios=e.map(function(x,i){
      if(i===0||x.v==null||e[i-1].v==null) return null;
      return Math.round(x.v/e[i-1].v*100); });
    var worst=null;
    ratios.forEach(function(r,i){ if(r!=null&&(worst===null||r<ratios[worst])) worst=i; });
    var h='<div class="fn">';
    e.forEach(function(x,i){
      var nil=(x.v==null), w=nil?100:Math.max(Math.round(x.v/base*100),3);
      if(i) h+='<div class="fn-gap"></div>';
      h+='<div class="fnr"><div class="fn-n">'+esc(x.n)+'<span>'+esc(x.u)+'</span></div>'
        +'<div class="fn-bar'+(nil?' nil':'')+'">'+(nil?'':'<i style="width:'+w+'%"></i>')
        +'<b>'+(nil?'sin dato':money(x.v))+'</b></div>'
        +'<div class="fn-rt'+(i===worst?' worst':'')+'">'
        +(ratios[i]==null?'<span>—</span>':ratios[i]+'%<span>conversión</span>')+'</div></div>';
    });
    return h+'</div><div class="note">Cada porcentaje es la conversión desde el escalón de arriba. '
      +'El tramo en rojo es el peor ratio del embudo: ahí se pierde más gente por eficiencia, no por volumen.</div>';
  }

    var pp=[[(cx[0]+cx[1])/2-16,(cy[0]+cy[1])/2],
            [(cx[1]+cx[2])/2,(cy[1]+cy[2])/2+64],
            [(cx[0]+cx[2])/2+16,(cy[0]+cy[2])/2]];
    c.pares.forEach(function(x,i){
      s+='<text class="ik-pair" x="'+pp[i][0]+'" y="'+pp[i][1]+'" text-anchor="middle">'
        +esc(x.n.toUpperCase())+'</text>';
    });
    var lp=[[W/2,cy[0]-R-16],[cx[1]-R+6,cy[1]+R+26],[cx[2]+R-6,cy[2]+R+26]];
    var an=['middle','start','end'];
    c.circulos.forEach(function(x,i){
      s+='<text class="ik-lbl" x="'+lp[i][0]+'" y="'+lp[i][1]+'" text-anchor="'+an[i]+'">'
        +esc(x.k.toUpperCase())+'</text>'
        +'<text class="ik-sub" x="'+lp[i][0]+'" y="'+(lp[i][1]+14)+'" text-anchor="'+an[i]+'">'
        +esc(x.n)+'</text>';
    });
    var mx=W/2, my=(cy[0]+cy[1]+cy[2])/3;
    s+='<circle cx="'+mx+'" cy="'+my+'" r="46" fill="rgba(216,168,71,.20)" '
      +'stroke="var(--gold)" stroke-width="1.5"/>'
      +'<text class="ik-core" x="'+mx+'" y="'+(my-3)+'" text-anchor="middle">YO SOY</text>'
      +'<text class="ik-core" x="'+mx+'" y="'+(my+13)+'" text-anchor="middle">MI AVATAR</text></svg>';
    var side='<div class="ik-side"><div class="core"><b>'+esc(c.centro.n)+'</b><p>'
      +esc(c.centro.d)+'</p></div>'
      + c.pares.map(function(x){
          return '<div class="ik-p"><b>'+esc(x.n)+'</b><span>'+esc(x.d)+'</span></div>'; }).join('')
      + '</div>';

    /* el ciclo: de dónde sale y en qué se convierte */
    var mo=c.motor, mh='<div class="motor">';
    mo.nodos.forEach(function(x,i){
      if(i) mh+='<div class="mo-ar">→</div>';
      mh+='<div class="mo"><div class="n">'+esc(x.n)+'</div><div class="d">'+esc(x.d)+'</div></div>';
    });
    mh+='</div><div class="loop">↻ &nbsp;<b>El ciclo se cierra:</b> más llamadas producen más gemas, '
      +'y cada gema vuelve a entrar por el primer nodo.</div>'
      +'<div class="concl"><b>Conclusión</b>'+esc(mo.concl)+'</div>'
      +'<div class="note">'+esc(mo.estado)+'</div>';

    /* formatos y su cadencia */
    var fh='';
    (c.formatos||[]).forEach(function(f){
      var pc=Math.round(f.hecho/f.meta*100);
      fh+='<div class="fmt"><div class="fmt-n">'+esc(f.n)+'<span>'+esc(f.p)+'</span></div>'
        +'<div class="fmt-c">'+esc(f.cad)+'</div>'
        +'<div class="fmt-b'+(f.e==='brk'?' brk':'')+'"><i style="width:'+Math.max(pc,f.hecho?4:0)+'%"></i></div>'
        +'<div class="fmt-v'+(f.e==='brk'?' brk':'')+'">'+f.hecho+' / '+f.meta+'</div>'
        +'<div class="k2">'+esc(f.r)+'</div></div>';
    });

    return vhead('Contenido','el motor',c.lectura)
      + tiles(c.prod.stats)
      + '<div class="stack">'
      + card(esc(mo.t), mh)
      + card('Los cinco formatos y su cadencia',
             fh + '<div class="concl"><b>Conclusión</b>'+esc(c.prod.concl)+'</div>')
      + card('Hacia qué salidas', (function(){
          var sh='<div class="sal">';
          (c.salidas||[]).forEach(function(x){
            sh+='<div class="sal-c '+(x.e==='brk'?'brk':'')+'">'
              +'<div class="sal-n">'+esc(x.n)+'</div><div class="sal-d">'+esc(x.d)+'</div>'
              +'<div class="sal-v">'+x.act+' / '+x.tot+'</div>'
              +'<div class="sal-r">'+esc(x.r)+'</div></div>';
          });
          return sh+'</div>';
        })())
      + card('Dónde apunta — los tres territorios',
             '<div class="ik-wrap"><div>'+s+'</div>'+side+'</div>')
      + '</div>' + skArea('contenido');
  }

  var VIEWS=[
    {id:'radar',     l:'Radar',     r:vRadar},
    {id:'tendencia', l:'Tendencia', r:vTendencia},
    {id:'comercial', l:'Comercial', r:vComercial},
    {id:'clientes',  l:'Clientes',  r:vClientes},
    {id:'canales',   l:'Canales',   r:vCanales},
    {id:'contenido', l:'Contenido', r:vContenido},
    {id:'infra',     l:'Infra',     r:vInfra}
  ];

  document.getElementById('brand').textContent = D.meta.os;
  document.getElementById('navdate').textContent = D.meta.fecha;
  document.getElementById('footL').textContent = D.meta.os+' — '+D.meta.operador;
  document.getElementById('fresh').innerHTML = D.meta.frescura.map(function(f){
    var cls=f.al===null?'none':(f.lag>5?'lag':'');
    var txt=f.al===null?'sin dato':(f.lag===0?'al día':f.lag+'d');
    return '<span><i class="'+cls+'"></i>'+esc(f.n)+' — '+txt+'</span>'; }).join('');

  var stage=document.getElementById('stage'), tabs=document.getElementById('tabs');
  stage.innerHTML=VIEWS.map(function(v){
    return '<section class="view" id="v-'+v.id+'">'+v.r()+'</section>'; }).join('');
  tabs.insertAdjacentHTML('beforeend', VIEWS.map(function(v,i){
    return '<button data-i="'+i+'"><span class="tn">'+(i<9?'0':'')+(i+1)+'</span>'
      + esc(v.l)+'</button>'; }).join(''));

  var cur=0, views=stage.querySelectorAll('.view'), btns=tabs.querySelectorAll('button');
  var slider=document.getElementById('slider');
  function moverSlider(){
    var b=btns[cur]; if(!b) return;
    slider.style.left=b.offsetLeft+'px';
    slider.style.width=b.offsetWidth+'px';
  }
  window.addEventListener('resize',moverSlider);
  function go(i){
    cur=(i+VIEWS.length)%VIEWS.length;
    for(var k=0;k<views.length;k++){
      views[k].classList.toggle('on',k===cur);
      btns[k].classList.toggle('on',k===cur);
    }
    moverSlider();
    if(btns[cur].scrollIntoView) btns[cur].scrollIntoView({block:'nearest',inline:'center'});
    window.scrollTo({top:0,behavior:'smooth'});
  }
  for(var k=0;k<btns.length;k++)
    btns[k].addEventListener('click',function(e){
      go(parseInt(e.currentTarget.getAttribute('data-i'),10)); });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){ e.preventDefault(); go(cur+1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); go(cur-1); }
    if(e.key>='1'&&e.key<='7') go(parseInt(e.key,10)-1);
  });
  go(0);
})();
</script>
